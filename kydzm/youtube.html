<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>유튜브 · kydz.kr</title>
<style>
  :root { --bg:#fff; --card:#fff; --text:#1a1a1a; --muted:#6e6e6e; --line:#e5e5e5; --soft:#f5f5f3; --danger:#e63946; --ok:#03c75a; --warn:#f59e0b; --brand:#FFE873; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif; }
  .wrap { max-width:1100px; margin:0 auto; padding:14px 16px 60px; }
  a { color:inherit; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  .muted { color:var(--muted); font-size:13px; }
  .gh { font-weight:700; margin:18px 2px 8px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; }
  .kpi { background:var(--soft); border-radius:10px; padding:10px 12px; }
  .kpi .l { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .kpi .v { font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; }
  .d { font-size:12px; font-weight:700; margin-left:4px; }
  .d.up { color:var(--ok); } .d.dn { color:var(--danger); }
  .chart { width:100%; height:150px; display:block; }
  .chart text { fill:var(--muted); font-size:10px; }
  .vgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px; }
  .vc { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; text-decoration:none; }
  .vc.bad { border-color:var(--danger); }
  .vc img { width:100%; aspect-ratio:16/9; object-fit:cover; background:var(--soft); display:block; }
  .vc .b { padding:9px 11px 11px; }
  .vc .t { font-weight:600; font-size:14px; line-height:1.35; height:2.7em; overflow:hidden; }
  .tags { display:flex; gap:5px; flex-wrap:wrap; margin:4px 0 6px; }
  .tag { font-size:11px; padding:1px 7px; border-radius:9px; background:var(--soft); color:var(--muted); font-weight:600; }
  .tag.short { color:#e5483f; } .tag.long { color:var(--info, #4a7ba6); } .tag.red { background:var(--danger-soft, #fdecee); color:var(--danger); } .tag.or { background:var(--warning-soft, #fff4e0); color:var(--warn); }
  .nums { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; font-size:12px; color:var(--muted); }
  .nums b { display:block; font-size:15px; color:var(--text); font-variant-numeric:tabular-nums; }
  .ret { display:flex; gap:2px; align-items:flex-end; height:30px; margin-top:6px; }
  .ret i { flex:1; background:var(--ok); opacity:.75; border-radius:2px 2px 0 0; }
  .ret i.low { background:var(--danger); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .sched { display:flex; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .sched:last-child { border-bottom:0; }
  .sched .dt { flex:none; width:86px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .btn { border:1px solid var(--line); background:var(--soft); color:var(--text); border-radius:8px; padding:6px 10px; font-size:13px; text-decoration:none; display:inline-block; }
  .banner { padding:10px 12px; border-radius:10px; background:var(--soft); margin-bottom:10px; }
  .banner.err { background:var(--danger-soft, #fdecee); color:var(--danger); }
  .login { min-height:90vh; display:flex; align-items:center; justify-content:center; }
  input.pw { border:1px solid var(--line); border-radius:8px; padding:8px; font:inherit; background:var(--bg); color:var(--text); }
  @media (max-width:600px) { .wrap { padding:10px 12px 60px; } .kpi .v { font-size:19px; } .vgrid { grid-template-columns:1fr 1fr; gap:8px; } .vc .t { font-size:12.5px; } .nums { grid-template-columns:1fr 1fr; } .nums b { font-size:13px; } .vc .b { padding:7px 8px 9px; } }
  .hbars { display:flex; gap:5px; align-items:flex-end; height:160px; margin:10px 0 6px; }
  .hb { flex:1; min-width:0; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; }
  .hb-v { font-size:10.5px; color:var(--muted); white-space:nowrap; margin-bottom:3px; font-variant-numeric:tabular-nums; }
  .hb-s { font-size:10.5px; font-weight:700; white-space:nowrap; } .hb-s.up { color:var(--ok); } .hb-s.dn { color:var(--danger); }
  .hb-col { width:100%; max-width:48px; background:var(--ok); opacity:.85; border-radius:3px 3px 1px 1px; min-height:2px; }
  .hb-d { font-size:10.5px; color:var(--muted); height:15px; margin-top:4px; white-space:nowrap; }
  @media (max-width:600px) { .hbars { gap:2px; height:140px; } .hb-v, .hb-s { font-size:8.5px; } .hb-d { font-size:9px; } }
</style>
<link rel="stylesheet" href="lib/theme.css?v=261126l">
<script src="lib/nav.js?v=261126p"></script>
</head>
<body>
<div class="login" id="login" style="display:none">
  <div class="card" style="width:300px">
    <div style="font-weight:700;margin-bottom:8px">유튜브 · 관리자 전용</div>
    <div class="row" style="flex-wrap:nowrap"><input type="password" class="pw" id="pw" placeholder="비밀번호"><button class="btn" id="pw-go">입장</button></div>
    <div class="muted" id="pw-err" style="display:none;color:var(--danger)">비밀번호가 올바르지 않습니다</div>
  </div>
</div>
<div class="wrap" id="app" style="display:none"><div id="main"><div class="card muted">불러오는 중...</div></div></div>
<script src="lib/passkey.js?v=261103c"></script>
<script>
// 📺 유튜브 현황판 (사용자 261126 'AI 시말서 하나만') — 데이터는 비공개 cupas state/yt_stats.json(+ 날짜별 state/yt_stats/YYYY-MM-DD.json, 매일 05:10 yt-report)
// 와 board/board.json(유튜브 프로젝트 할 일)을 cupas 토큰으로 읽기만 함. 공개 저장소라 숫자·영상 정보를 이 파일에 넣지 않는다.
const PASSWORD_HASH = 'fc0d164e3259b5a28b9b7ac489e95e1638ba1bc37a27c2bb07ac7bdb624f1347';
const AUTH_KEY = 'kydz_admin_authed', TOKEN_KEY = 'kydz_cupas_gh_token';
const RP = 'https://api.github.com/repos/kydxyz-git/cupas';
const YT_DOC = 'https://docs.google.com/document/d/1q2iO_7QoJW6ZsUmiCmvg_nOdwUZURVE1KTnmHhW4P4o/edit';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const n = x => (x == null ? '-' : Number(x).toLocaleString('ko-KR'));
function tok() { try { return localStorage.getItem(TOKEN_KEY) || localStorage.getItem('kydz_admin_gh_token') || ''; } catch (e) { return ''; } }
async function sha256(t) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
async function gh(url, raw) {
  const r = await fetch(url, { cache: 'no-store', headers: { Authorization: 'Bearer ' + tok(), Accept: raw ? 'application/vnd.github.raw' : 'application/vnd.github+json' } });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(`깃허브 오류 ${r.status} — 토큰을 스레드 관리 화면에서 확인해 주세요`);
  return raw ? JSON.parse(await r.text()) : r.json();
}
const kst = iso => new Date(new Date(iso).getTime() + 9 * 3600e3);
const ymd = d => d.toISOString().slice(0, 10);
const md = s => `${+s.slice(5, 7)}/${+s.slice(8, 10)}`;
function delta(v) { if (v == null || !isFinite(v) || v === 0) return ''; return `<span class="d ${v > 0 ? 'up' : 'dn'}">${v > 0 ? '+' : ''}${n(v)}</span>`; }

async function load() {
  const [cur, list, board] = await Promise.all([
    gh(`${RP}/contents/state/yt_stats.json?ref=main`, true),
    gh(`${RP}/contents/state/yt_stats?ref=main`),
    gh(`${RP}/contents/board/board.json?ref=main`, true),
  ]);
  if (!cur) throw new Error('유튜브 통계가 아직 없어요 (state/yt_stats.json)');
  const files = (list || []).map(f => f.name).filter(x => /^\d{4}-\d{2}-\d{2}\.json$/.test(x)).sort();
  const todayFile = ymd(kst(cur.at)) + '.json';
  const prevName = files.filter(x => x < todayFile).pop();
  const prev = prevName ? await gh(`${RP}/contents/state/yt_stats/${prevName}?ref=main`, true) : null;
  return { cur, prev, board };
}

function chart(daily) {
  const ds = (daily || []).slice(-21);
  if (!ds.length) return '<div class="muted">날짜별 숫자가 아직 없어요</div>';
  const mx = Math.max(1, ...ds.map(x => x.views || 0)), step = Math.ceil(ds.length / 10);
  // 막대는 HTML로 (사용자 261126 '글자가 가로로 늘어나' — SVG를 폭에 맞춰 늘리면 글자도 늘어남)
  const cols = ds.map((x, i) => { const subs = (x.subscribersGained || 0) - (x.subscribersLost || 0);
    return `<div class="hb" title="${md(x.day)} 조회 ${n(x.views)} · 구독 ${subs >= 0 ? '+' : ''}${subs}">
      ${subs ? `<span class="hb-s ${subs > 0 ? 'up' : 'dn'}">${subs > 0 ? '+' : ''}${subs}</span>` : ''}<span class="hb-v">${n(x.views || 0)}</span>
      <div class="hb-col" style="height:${Math.round((x.views || 0) / mx * 100)}%"></div>
      <span class="hb-d">${i % step === 0 || i === ds.length - 1 ? md(x.day) : ''}</span></div>`; }).join('');
  return `<div class="hbars">${cols}</div>
    <div class="muted">막대 = 하루 조회 · 위 숫자 = 그날 구독 변화 · 분석 숫자는 1~2일 늦게 들어와요</div>`;
}

function video(v, pv) {
  const life = v.analytics_life || {}, pct = life.averageViewPercentage, r30 = (v.retention || {})['0:30'];
  const isShort = v.kind === 'short', url = isShort ? `https://www.youtube.com/shorts/${v.id}` : `https://www.youtube.com/watch?v=${v.id}`;
  const dv = pv ? v.views - (pv.views || 0) : null;
  const flags = [];
  if (!isShort && r30 != null && r30 < 0.5) flags.push(['red', `0:30 ${Math.round(r30 * 100)}% — 첫 30초`]);
  if (isShort && pct && pct < 70) flags.push(['or', `평균 ${Math.round(pct)}% — 첫 2초·길이`]);
  if ((life.views || 0) >= 300 && !(life.subscribersGained > 0)) flags.push(['or', '조회는 많은데 구독 0']);
  const ret = !isShort && v.retention ? `<div class="ret" title="구간별 남은 비율">${Object.entries(v.retention).map(([k, x]) => `<i class="${x < 0.5 ? 'low' : ''}" style="height:${Math.max(4, Math.min(100, x * 100))}%" title="${k} ${Math.round(x * 100)}%"></i>`).join('')}</div><div class="muted" style="font-size:11px">${Object.keys(v.retention).join(' · ')}</div>` : '';
  const m = Math.floor((v.seconds || 0) / 60), s = (v.seconds || 0) % 60;
  return `<a class="vc ${flags.some(f => f[0] === 'red') ? 'bad' : ''}" href="${url}" target="_blank" rel="noopener">
    <img src="https://i.ytimg.com/vi/${esc(v.id)}/mqdefault.jpg" alt="" loading="lazy">
    <div class="b"><div class="t">${esc(v.title)}</div>
      <div class="tags"><span class="tag ${isShort ? 'short' : 'long'}">${isShort ? '쇼츠' : '롱폼'} ${m}:${String(s).padStart(2, '0')}</span><span class="tag">${md(ymd(kst(v.published)))} 공개</span>${flags.map(f => `<span class="tag ${f[0]}">${esc(f[1])}</span>`).join('')}</div>
      <div class="nums"><div>조회<b>${n(v.views)}${delta(dv)}</b></div><div>평균 시청<b>${pct ? Math.round(pct) + '%' : '<span class="muted">집계 전</span>'}</b></div><div>${isShort ? '구독+' : '0:30 남음'}<b>${isShort ? (life.subscribersGained ?? '-') : (r30 != null ? Math.round(r30 * 100) + '%' : '<span class="muted">집계 전</span>')}</b></div></div>
      ${ret}</div></a>`;
}

function render({ cur, prev, board }) {
  const ch = cur.channel || {}, pch = (prev || {}).channel || {};
  const pv = Object.fromEntries(((prev || {}).videos || []).map(v => [v.id, v]));
  const vids = (cur.videos || []).slice().sort((a, b) => (b.published > a.published ? 1 : -1));
  const pub = vids.filter(v => v.privacy === 'public'), hidden = vids.filter(v => v.privacy !== 'public');
  const d7 = (cur.daily || []).slice(-7);
  const sum = (arr, k) => arr.reduce((a, x) => a + (x[k] || 0), 0);
  const subs7 = sum(d7, 'subscribersGained') - sum(d7, 'subscribersLost');
  const dayViews = k => pub.filter(v => v.kind === k).reduce((a, v) => a + (pv[v.id] ? v.views - (pv[v.id].views || 0) : 0), 0);
  // 공개 예정: 운영판 유튜브 프로젝트의 안 끝난 할 일 중 오늘~14일 안
  const today = ymd(kst(new Date().toISOString())), end = ymd(new Date(Date.now() + 14 * 864e5 + 9 * 3600e3));
  const tasks = ((board || {}).tasks || []).filter(t => t.project === 'youtube' && !['done', 'canceled'].includes(t.bucket) && (t.date || t.due))
    .map(t => ({ ...t, when: t.date || t.due })).filter(t => t.when >= today && t.when <= end).sort((a, b) => (a.when > b.when ? 1 : -1));
  $('#main').innerHTML = `
    <div class="row" style="justify-content:space-between;margin-bottom:10px"><div><b style="font-size:18px">📺 AI 시말서</b> <span class="muted">${esc(md(ymd(kst(cur.at))))} ${esc(kst(cur.at).toISOString().slice(11, 16))} 수집 · 분석은 ${esc(cur.analytics_until ? md(cur.analytics_until) : '-')}까지</span></div>
      <div class="row"><a class="btn" href="${YT_DOC}" target="_blank" rel="noopener">📄 유튜브_기록(규칙·확인할 것)</a><a class="btn" href="insights.html">📈 주간 카드</a><a class="btn" href="https://studio.youtube.com/" target="_blank" rel="noopener">스튜디오</a></div></div>
    <div class="kpis">
      <div class="kpi"><div class="l">구독자</div><div class="v">${n(ch.subscriberCount)}${delta(pch.subscriberCount != null ? ch.subscriberCount - pch.subscriberCount : null)}</div></div>
      <div class="kpi"><div class="l">전체 조회</div><div class="v">${n(ch.viewCount)}${delta(pch.viewCount != null ? ch.viewCount - pch.viewCount : null)}</div></div>
      <div class="kpi"><div class="l">최근 7일 조회 (분석)</div><div class="v">${n(sum(d7, 'views'))}</div></div>
      <div class="kpi"><div class="l">최근 7일 구독</div><div class="v">${subs7 >= 0 ? '+' : ''}${subs7}</div></div>
      <div class="kpi" title="어제 수집 때보다 오늘 수집 때 늘어난 조회수 (쇼츠만)"><div class="l">하루 새 조회 · 쇼츠</div><div class="v">+${n(dayViews('short'))}</div></div>
      <div class="kpi" title="어제 수집 때보다 오늘 수집 때 늘어난 조회수 (롱폼만)"><div class="l">하루 새 조회 · 롱폼</div><div class="v">+${n(dayViews('long'))}</div></div>
      <div class="kpi"><div class="l">영상</div><div class="v">${n(ch.videoCount)}</div></div>
    </div>
    <div class="gh">📊 날짜별 조회·구독</div><div class="card">${chart(cur.daily)}</div>
    ${tasks.length ? `<div class="gh">🗓 공개·작업 일정 (운영판 유튜브, 14일 안)</div><div class="card">${tasks.map(t => `<div class="sched"><span class="dt">${md(t.when)}</span><span>${esc(t.title)}</span></div>`).join('')}</div>` : ''}
    ${hidden.length ? `<div class="gh">🔒 비공개·예약 <span class="muted">${hidden.length} · 곧 공개할 영상</span></div><div class="vgrid">${hidden.map(v => video(v, pv[v.id])).join('')}</div>` : ''}
    <div class="gh">🎬 공개 영상 <span class="muted">${pub.length} · 빨간 테두리 = 롱폼 0:30에서 절반 아래</span></div>
    <div class="vgrid">${pub.map(v => video(v, pv[v.id])).join('')}</div>
`;
}

async function start() {
  $('#app').style.display = 'block';
  if (!tok()) { $('#main').innerHTML = '<div class="banner err">cupas 토큰이 없어요 — <a href="threads.html">스레드 관리</a>에서 넣어 주세요</div>'; return; }
  try { render(await load()); } catch (e) { $('#main').innerHTML = `<div class="banner err">${esc(e.message)}</div>`; }
}
(function boot() {
  try { if (sessionStorage.getItem(AUTH_KEY) === '1') return start(); } catch (e) {}
  $('#login').style.display = 'flex';
  const go = async () => { if (await sha256($('#pw').value) === PASSWORD_HASH) { try { sessionStorage.setItem(AUTH_KEY, '1'); } catch (e) {} $('#login').style.display = 'none'; start(); kydzPasskey.offer(); } else $('#pw-err').style.display = 'block'; };
  $('#pw-go').onclick = go; $('#pw').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) go(); });
  kydzPasskey.mountLogin(() => { $('#login').style.display = 'none'; start(); });
})();
</script>
</body>
</html>
