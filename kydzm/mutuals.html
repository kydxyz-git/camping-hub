<!DOCTYPE html>
<html lang="ko">
<head>

<title>인스타 · kydz.kr</title>
<style>
  :root { --bg:#fff; --card:#fff; --text:#1a1a1a; --muted:#6e6e6e; --line:#e5e5e5; --soft:#f5f5f3; --danger:#e63946; --ok:#03c75a; --warn:#f59e0b; --brand:#FFE873; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1d1f1d; --card:#262926; --text:#ececea; --muted:#9a9e98; --line:#343834; --soft:#2c302c; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif; }
  .wrap { max-width:760px; margin:0 auto; padding:12px 16px 60px; }

  .muted { color:var(--muted); font-size:13px; }
  .btn { border:1px solid var(--line); background:var(--soft); color:var(--text); border-radius:8px; padding:6px 10px; font-size:13px; cursor:pointer; }
  .btn.pri { background:var(--brand); border-color:var(--brand); color:#1a1a1a; font-weight:600; }

  .tabs { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }

  .u { font-weight:600; } .n { font-variant-numeric:tabular-nums; }

  .pill.red { background:var(--danger-soft); color:var(--danger); } .pill.ok { color:var(--ok); }
  textarea { width:100%; border:1px solid var(--line); border-radius:8px; padding:8px; font:inherit; background:var(--bg); color:var(--text); }
  .cm { font-size:14px; margin:4px 0; padding:6px 8px; background:var(--soft); border-radius:8px; }

  .pu { font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .pn { font-size:11px; color:var(--muted); display:flex; justify-content:space-between; min-height:14px; }
  .ck { color:var(--ok); font-weight:700; padding:0 2px; }
  .bar { display:flex; align-items:center; gap:8px; text-decoration:none; padding:3px 0; font-size:13px; }
  .bn { width:16px; color:var(--muted); text-align:right; flex:none; }
  .bu { width:130px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:none; font-weight:600; }
  .bb { flex:1; height:8px; background:var(--soft); border-radius:4px; overflow:hidden; } .bb i { display:block; height:100%; background:var(--brand); }
  .bc { flex:none; color:var(--muted); font-size:12px; }
  .card.open { border-color:var(--danger); }
  .note { font-size:12px; margin-top:6px; cursor:pointer; }
  .nm { font-size:11px; background:var(--brand-soft); color:var(--text); border-radius:4px; padding:1px 4px; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .nb { color:var(--muted); padding:0 3px; cursor:pointer; }

  .tc .pn { flex-direction:column; }
  .tc img, .tc .ph { width:100%; aspect-ratio:1; object-fit:cover; border-radius:6px; background:var(--soft); display:block; margin-bottom:4px; }
  .pcard.ty, .lg.y { background:rgba(250,204,21,.16); border-color:rgba(250,204,21,.55); }
  .pcard.to, .lg.o { background:rgba(249,115,22,.16); border-color:rgba(249,115,22,.55); }
  .pcard.tr, .lg.r { background:rgba(230,57,70,.14); border-color:rgba(230,57,70,.5); }
  .lg { font-size:12px; padding:2px 8px; border-radius:10px; border:1px solid; }
  .sbar { display:flex; flex-wrap:wrap; gap:4px 12px; align-items:center; font-size:13px; padding:8px 12px; background:var(--soft); border-radius:10px; margin-bottom:10px; }
  .tabs { position:sticky; top:0; z-index:50; background:var(--bg); padding:6px 0; margin:0 0 8px; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; }
  .tabs .btn { flex:none; white-space:nowrap; }
  .gh.red { color:var(--danger); }
  .card.going { border-color:var(--ok); }
  .card.sel { background:var(--soft); }
  .prow { display:flex; align-items:center; gap:10px; }
  /* 내 답 가로 막대 (사용자 261126 '오른쪽에 가로바 그래프, 숫자도') */

  .btn.sm { padding:5px 9px; flex:none; }
  .actbar { position:fixed; left:var(--kn-w,0px); right:0; bottom:0; z-index:8000; display:flex; align-items:center; gap:8px; padding:10px 16px calc(10px + env(safe-area-inset-bottom)); background:var(--card); border-top:1px solid var(--line); box-shadow:0 -4px 14px rgba(0,0,0,.12); }
  .actbar span { flex:1; padding-left:52px; }
  .actbar .btn { padding:9px 14px; font-size:14px; }

  @media (max-width:600px) { .wrap { padding:8px 12px 60px; } .card { padding:10px; } .th { width:46px; height:46px; } }
  .card.sk { opacity:.7; }
  .pill.scr { color:var(--info); }
  .phead { display:flex; gap:14px; align-items:flex-start; }

  .pstats { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .pstats > div { background:var(--soft); border-radius:8px; padding:6px 8px; }
  .pstats span { display:block; font-size:11px; color:var(--muted); }
  .pstats b { font-size:17px; font-variant-numeric:tabular-nums; }
  .pstats .red b { color:var(--danger); }
  .pcap { white-space:pre-line; font-size:13.5px; line-height:1.55; max-height:190px; overflow-y:auto; padding:8px 10px; background:var(--soft); border-radius:8px; }
  .pill.ok { color:var(--ok); }
  @media (max-width:600px) { .phead { flex-direction:column; } .pthumb { width:60%; max-width:240px; margin:0 auto; } .pcap { max-height:160px; } }
  /* 유튜브식 (261126) */
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px; }
  .kpi { background:var(--soft); border-radius:10px; padding:10px 12px; min-width:0; }

  .igrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(118px,1fr)); gap:8px; }   /* PC 한 줄 8개쯤 (사용자 261126) */
  .igc { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; cursor:pointer; transition:border-color .12s, transform .08s; }

  /* 폰은 리스트 (사용자 261126 '모바일에서는 리스트 형태로'): 왼쪽 작은 썸네일 + 오른쪽 제목·정보·막대 */

<script>
// 맞팔 방문·대댓글 (사용자 261126) — 데이터는 비공개 cupas state/ig_comments.json(ig_comments.py가 씀).
// 이 화면은 state/ig_visits.json(다녀옴)과 state/ig_comments_ctl.json(모드·수정·건너뛰기)만 씀 — 봇 파일을 직접 고치지 않음.
// 공개 저장소라 이 파일에 계정 이름·댓글 예시를 넣지 않는다.
const PASSWORD_HASH = 'fc0d164e3259b5a28b9b7ac489e95e1638ba1bc37a27c2bb07ac7bdb624f1347';
const AUTH_KEY = 'kydz_admin_authed', TOKEN_KEY = 'kydz_cupas_gh_token';
const RP = 'https://api.github.com/repos/kydxyz-git/cupas';
const $ = s => document.querySelector(s);
const n = x => (x == null ? '-' : Number(x).toLocaleString('ko-KR'));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const S = { st: null, visits: {}, ctl: {}, tab: 'posts', post: null, sending: {}, sel: new Set() };
try { S.tab = localStorage.getItem('kydz_mutuals_tab') || 'posts'; } catch (e) {}

function tok() { try { return localStorage.getItem(TOKEN_KEY) || localStorage.getItem('kydz_admin_gh_token') || ''; } catch (e) { return ''; } }
async function sha256(t) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
function kstNow() { return new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 19) + '+09:00'; }
function ago(iso) { if (!iso) return ''; const d = (Date.now() - new Date(iso)) / 864e5; return d < 1 ? '오늘' : d < 2 ? '어제' : `${Math.floor(d)}일 전`; }
function utf8ToB64(t) { const a = new TextEncoder().encode(t); let s = ''; for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode(...a.subarray(i, i + 0x8000)); return btoa(s); }
function b64ToUtf8(b) { const bin = atob(b.replace(/\n/g, '')); const a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new TextDecoder().decode(a); }
async function gh(url, opts = {}) {
  const r = await fetch(url, { method: opts.method || 'GET', cache: 'no-store', headers: { Authorization: 'Bearer ' + tok(), Accept: opts.raw ? 'application/vnd.github.raw' : 'application/vnd.github+json', ...(opts.body ? { 'Content-Type': 'application/json' } : {}) }, body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (r.status === 404 && opts.ok404) return null;
  if (!r.ok) throw new Error(`깃허브 오류 ${r.status} — 토큰을 스레드 관리 화면에서 확인해 주세요`);
  if (r.status === 204) return null;
  return opts.raw ? r.text() : r.json();
}
async function readJson(path) {   // 작은 파일: sha 같이
  const d = await gh(`${RP}/contents/${path}?ref=main`, { ok404: true });
  return d ? { data: JSON.parse(b64ToUtf8(d.content)), sha: d.sha } : { data: {}, sha: '' };
}
async function writeJson(path, mutate, msg) {   // 최신본 위에 고쳐 저장 (충돌 나면 한 번 더)
  for (let i = 0; i < 3; i++) {
    const f = await readJson(path); mutate(f.data);
    try { await gh(`${RP}/contents/${path}`, { method: 'PUT', body: { message: msg, content: utf8ToB64(JSON.stringify(f.data, null, 2) + '\n'), branch: 'main', ...(f.sha ? { sha: f.sha } : {}) } }); return f.data; }
    catch (e) { if (i === 2) throw e; }
  }
}

async function load() {
  // 가벼운 화면용 파일(state/ig_view.json, 봇이 만듦)만 읽음 — 전체 ig_comments.json(3MB)은 느려서 (사용자 261126 '불러오는 게 너무 느리네')
  const view = gh(`${RP}/contents/state/ig_view.json?ref=main`, { raw: true, ok404: true }).then(t => t || gh(`${RP}/contents/state/ig_comments.json?ref=main`, { raw: true }));
  const [st, v, c, mu, no] = await Promise.all([view, readJson('state/ig_visits.json'), readJson('state/ig_comments_ctl.json'), readJson('state/ig_mutuals.json'), readJson('state/ig_notes.json')]);
  S.st = JSON.parse(st); S.visits = v.data.visits || {}; S.ctl = c.data; S.mut = mu.data.mutual || []; S.mutAt = mu.data.at || ''; S.notes = no.data.notes || {};
  S.mtype = Object.fromEntries(Object.entries(S.st.media || {}).filter(([, m]) => m.type).map(([id, m]) => [id, m.type]));   // 릴스 표시용
}

// 띄워 두면 3분마다 조용히 새로 받음 (사용자 261126 '화면 띄워 두면 자동 새로고침 되지?' — 봇은 10분마다 돎). 쓰는 중(입력 칸에 커서·고친 글)이면 건너뜀
async function autoRefresh() {
  if (document.hidden || !S.st) return;
  const ae = document.activeElement;
  if (ae && /^(TEXTAREA|INPUT)$/.test(ae.tagName)) return;
  if ([...document.querySelectorAll('#main textarea')].some(t => t.value !== t.defaultValue)) return;
  try { const y = scrollY; await load(); render(); scrollTo(0, y); S.refreshedAt = new Date(); } catch (e) { console.warn('자동 새로고침 실패', e); }
}
setInterval(autoRefresh, 3 * 60e3);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.refreshedAt && Date.now() - S.refreshedAt > 60e3) autoRefresh(); });
function todayPosted() { const t = dayKey(new Date().toISOString()); return Object.values(S.st.comments || {}).filter(c => c.status === 'posted' && c.posted_at && dayKey(c.posted_at) === t).length; }
function renderMode() {   // 위 상태 줄 (사용자 261126: 큰 '자동 시작' 버튼 없애고 게시물별로)
  const st = S.st, on = Object.keys(S.ctl.auto_media || {}).length, paused = st.mode === 'paused' && !(S.ctl.mode === 'on' && S.ctl.mode_at > (st.mode_at || ''));
  const next = (st.pace || {}).next_at;
  $('#mode').innerHTML = paused
    ? `<div class="banner err"><div class="row" style="justify-content:space-between"><b>⛔ 대댓글 멈춤 — 인스타가 거절</b><button class="btn pri" data-resume>다시 켜기</button></div><div class="muted">${esc(st.paused_reason || '')}</div></div>`
    : (S.tab === 'posts' && !S.post) ? '' : `<div class="sbar"><span>🔄 진행 중 <b>${on}</b>개</span><span>오늘 단 답글 <b>${todayPosted()}</b></span>${on && next ? `<span class="muted">다음 ${esc(hm(next))} 이후</span>` : ''}<span class="muted">확인 ${esc(hm((st.pace || {}).fetched_at || ''))}</span></div>`;
  $('#mode').querySelectorAll('[data-resume]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    S.ctl = await writeJson('state/ig_comments_ctl.json', d => { d.mode = 'on'; d.mode_at = kstNow(); }, 'ig(admin): 맞팔 대댓글 다시 켬');
    render(); toast('다시 켰어요 — 10분 안에 반영');
  });
}
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }

function dayKey(iso) { return new Date(new Date(iso).getTime() + 9 * 3600e3).toISOString().slice(0, 10); }
function dayLabel(k) { const t = dayKey(new Date().toISOString()); const y = dayKey(new Date(Date.now() - 864e5).toISOString()); return k === t ? '오늘' : k === y ? '어제' : `${+k.slice(5, 7)}/${+k.slice(8, 10)}`; }
function hm(iso) { return iso ? new Date(new Date(iso).getTime() + 9 * 3600e3).toISOString().slice(11, 16) : ''; }
function postLink(mid) { return (S.st.media[mid] || {}).permalink || '#'; }
function norm(t, u) { let s = String(t || ''); if (u) s = s.split(u).join(''); return s.replace(/@[\w.]+/g, '').replace(/[^\p{L}\p{N}_]/gu, '').toLowerCase(); }
function skipWhy(id, c) {   // 건너뜀: 화면에서 [건너뛰기] 누른 것만 (메모 '제외'는 자동만 안 하고 목록엔 보임 — 사용자 261126 '수동으로 달긴 해야 돼서')
  if ((S.ctl.skip || []).includes(id)) return '화면에서 건너뜀';
  if (c.status === 'skip' && c.why !== '화면에서 건너뜀' && c.why !== '메모: 제외') return c.why || '건너뜀';
  return '';
}
// 줄에 올리거나 고쳐 저장하면 그 게시물 자동도 켬 — 진행 중 = 자동 켠 게시물 (사용자 261126)
function autoOn(d, id) { const m = ((S.st.comments || {})[id] || {}).media; if (!m) return; d.auto_media ||= {}; if (!d.auto_media[m]) d.auto_media[m] = kstNow(); if (d.mode === 'paused') { d.mode = 'on'; d.mode_at = kstNow(); } }
function autoOff(c) { const n = (S.notes || {})[c.user]; return !!(n && n.includes('제외')); }
function myReplies(c, withSb) {   // 내가 단 답글(직접·자동). 소셜비즈 자동 DM 답글은 withSb일 때만
  if (!S.tpl) S.tpl = new Set(S.st.tpl || []);
  const out = (c.mine || []).filter(r => r.id !== c.reply_id).map(r => ({ t: r.text, k: (S.tpl.has(norm(r.text)) || S.tpl.has(norm(r.text, c.user))) ? '소셜비즈' : '직접' })).filter(r => withSb || r.k !== '소셜비즈');
  if (c.status === 'posted') out.push({ t: c.reply, k: c.by_hand ? '수동' : '자동' });   // 봇이 단 것: 화면 [댓글 달기]면 '수동', 아니면 '자동' (사용자 261126 '화면을 수동')
  return out;
}

// 내 게시물 썸네일 (사용자 261126 '2번으로'): 봇이 보관한 cupas state/ig_thumbs/{id}.jpg를 토큰으로 받아 보여 줌 — 인스타 주소는 며칠 뒤 만료돼서
const SHOT = {}, SHOT_BAD = new Set();   // 경로 → blob 주소 · 못 받은 경로
function shotImg(m, onerr) {
  if (!m.thumb && !m.shot) return '';
  const src = (m.shot && SHOT[m.shot]) || m.thumb || '';
  return `<img ${m.shot ? `data-shot="${esc(m.shot)}"` : ''} src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer" ${m.shot && !SHOT[m.shot] ? '' : onerr}>`;
}
let shotBusy = false;
async function loadShots() {
  if (shotBusy) return; shotBusy = true;
  try {
    const want = [...new Set([...document.querySelectorAll('img[data-shot]')].map(i => i.dataset.shot).filter(p => !SHOT[p] && !SHOT_BAD.has(p)))];
    if (!want.length) return;
    const one = async p => {
      try {
        const r = await fetch(`${RP}/contents/${p}?ref=main`, { knQuiet: true, headers: { Authorization: 'Bearer ' + tok(), Accept: 'application/vnd.github.raw' } });
        if (!r.ok) { SHOT_BAD.add(p); return; }
        SHOT[p] = URL.createObjectURL(await r.blob());
        document.querySelectorAll(`img[data-shot="${CSS.escape(p)}"]`).forEach(i => { i.src = SHOT[p]; i.style.visibility = ''; i.parentNode.classList.remove('noimg'); });
      } catch (e) { SHOT_BAD.add(p); }
    };
    for (let i = 0; i < want.length; i += 4) await Promise.all(want.slice(i, i + 4).map(one));
  } finally { shotBusy = false; }
  if ([...document.querySelectorAll('img[data-shot]')].some(i => !SHOT[i.dataset.shot] && !SHOT_BAD.has(i.dataset.shot))) loadShots();   // 받는 동안 화면이 바뀐 경우
}
// 협찬 구분 (사용자 261126 '(협찬 × ○○)·(장소제공)·(제품제공)도 다 협찬'): (광고)=광고, 협찬·장소제공·제품제공으로 시작하는 괄호=협찬
// "(광고❌️ 내돈내산❌️ …)"처럼 괄호 안이 다른 말이면 잡지 않음
const SP_RE = /^\((광고|협찬(?:\s*[×xX]\s*[^)]*)?|장소\s*제공|제품\s*제공)\)\s*/;
function spOf(cap) { const m = String(cap || '').match(SP_RE); return m ? (m[1] === '광고' ? '광고' : '협찬') : ''; }
function capBody(cap) { return String(cap || '').replace(SP_RE, ''); }
// ── 1번 탭: 내 게시물 ──
function renderPosts() {
  const by = {};
  for (const [id, c] of Object.entries(S.st.comments || {})) (by[c.media] ||= []).push([id, c]);
  if (S.post) return renderPost(S.post, by[S.post] || []);
  // 댓글 상태 셋 (사용자 261126 '제안 A'): 답 필요(손 안 댐) · ⏳ 대기(줄에 올림·수정 저장) · 다 함(답함·자동·건너뜀)
  const waiting = (id, c) => !myReplies(c).length && !skipWhy(id, c) && !!(S.ctl.auto_media || {})[c.media] && !!((S.ctl.queue || {})[id] || (S.ctl.edits || {})[id]);   // 대기 = 자동 켠 게시물에서 줄에 올렸거나 고쳐 둔 것
  const wait = mid => (by[mid] || []).filter(([id, c]) => waiting(id, c)).length;
  const need = mid => (by[mid] || []).filter(([id, c]) => !myReplies(c).length && !skipWhy(id, c) && !waiting(id, c)).length;
  const auto = S.ctl.auto_media || {};
  const ms = Object.entries(S.st.media || {}).sort((a, b) => (b[1].at > a[1].at ? 1 : -1)).slice(0, 40);
  const isGoing = mid => !!auto[mid] && wait(mid) > 0;   // 진행 중 = 달릴 차례인 답글(줄에 올림·고쳐 저장)이 남은 것. 다 달리면 — 답 필요가 남았으면 답 필요로, 없으면 다 답함으로 (사용자 261126 '진행 중이 끝나면 답 필요로 다시') — AI 초안은 확인해야 달리니까   // 진행 중 = 자동 켠 게시물 (사용자 261126 '진행 중인 건 다 자동 시작인 거잖아') — 줄에 올리거나 고쳐 저장하면 자동도 켜짐
  const going = ms.filter(([mid]) => isGoing(mid)), open = ms.filter(([mid]) => !isGoing(mid) && need(mid)), done = ms.filter(([mid]) => !isGoing(mid) && !need(mid));
  // 유튜브 화면처럼 (사용자 261126 '인스타 화면도 유튜브처럼'): 위 숫자 칸 → 날짜별 막대 → 게시물 카드
  const card = ([mid, m], kind) => {
    const cs = by[mid] || [], nd = need(mid), wt = wait(mid), on = !!auto[mid];
    const got0 = cs.filter(([, c]) => myReplies(c).length).length;
    const nSk = cs.filter(([id, c]) => !myReplies(c).length && skipWhy(id, c)).length, got = got0 + nSk;   // 건너뜀도 '다 한 것'으로 (사용자 261126)
    const auto1 = cs.filter(([, c]) => c.status === 'posted').length, chk = cs.filter(([, c]) => c.status === 'check').length;
    const sp = spOf(m.cap);
    const title = capBody(m.cap).split('\n')[0] || '(글 없음)';
    const sel = S.sel.has(mid), pct = cs.length ? Math.round(got / cs.length * 100) : 100;
    return `<div class="igc ${kind} ${sel ? 'sel' : ''}" data-post="${esc(mid)}">
      <div class="igc-img">${shotImg(m, `onerror="this.style.visibility='hidden'"`)}
        ${kind === 'open' ? `<label class="igc-ck" data-sel="${esc(mid)}" title="골라서 자동 시작"><input type="checkbox" ${sel ? 'checked' : ''} tabindex="-1"></label>` : ''}
        ${nSk && kind !== 'going' ? `<span class="igc-skip" title="건너뛴 댓글 — 다 한 것으로 셈">⏭ 건너뜀 ${nSk}</span>` : ''}
        ${S.mtype[mid] === 'VIDEO' ? '<span class="igc-reel" title="릴스">▶</span>' : ''}
        ${kind === 'going' ? `<span class="igc-badges">${nSk ? `<span class="igc-b2">⏭ 건너뜀 ${nSk}</span>` : ''}${wt ? `<span class="igc-b2 wait">⏳ 대기 ${wt}</span>` : ''}${nd ? `<span class="igc-b2 red">답 필요 ${nd}</span>` : ''}${!wt && !nd ? '<span class="igc-b2 go">🔄 진행 중</span>' : ''}</span>` : nd ? `<span class="igc-badge red">답 필요 ${nd}</span>` : '<span class="igc-badge ok">✅ 다 답함</span>'}</div>

  // 품앗이 (사용자 261126): 1순위 = 3일 안에 내 글에 댓글 단 맞팔이 새 글을 올림, 2순위 = 자주 오는 맞팔(30일 내 게시물의 절반 이상에 댓글)이 새 글을 올림
  // 새 글 = 3일 안 글 중 이 화면에서 아직 안 연 글 — 한 글에 한 번만 뜸
  const lt = S.st.latest || {}, cut = new Date(Date.now() - 3 * 864e5).toISOString(), d30 = new Date(Date.now() - 30 * 864e5).toISOString();
  const m3 = counts(3), m30 = counts(30);
  const n30 = Object.values(S.st.media || {}).filter(x => (x.at || '') >= d30).length, half = Math.max(2, Math.ceil(n30 / 2));
  const pool = {};
  for (const u of Object.values(m3)) pool[u.user] = { ...u, tier: 1, often: (m30[u.user] || u).posts.size };
  for (const u of Object.values(m30)) if (!pool[u.user] && u.posts.size >= half) pool[u.user] = { ...u, tier: 2, often: u.posts.size };
  const all = Object.values(pool).filter(u => lt[u.user] && lt[u.user].at && lt[u.user].at >= cut);
  const todo = all.filter(u => !opened(u.user, lt[u.user].at)).sort((a, b) => (a.tier - b.tier) || (b.often - a.often) || (lt[b.user].at > lt[a.user].at ? 1 : -1));
  const doneN = all.length - todo.length;
  const n1 = Object.keys(m3).length, n2 = Object.values(m30).filter(u => u.posts.size >= half).length;
  return `<div class="card"><div class="row" style="justify-content:space-between"><b>🚶 오늘 다녀올 맞팔</b><span class="muted">① 3일 안 나한테 댓글 단 맞팔 → ② 자주 오는 맞팔(30일 내 게시물 ${n30}개 중 ${half}개+) · 새 글 올리고 아직 안 연 사람</span></div>
    ${todo.length ? `<div class="tgrid" data-n="${todo.length}">${todo.slice(0, 24).map(u => { const x = lt[u.user]; return `<a class="pcard tc" href="${esc(x.permalink)}" target="_blank" rel="noopener" data-open="${esc(u.user)}">
      ${x.thumb ? `<img src="${esc(x.thumb)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">` : '<div class="ph"></div>'}
      <div class="pu">@${esc(u.user)}</div><div class="pn"><span>${hoursAgo(x.at)} 새 글</span><span>${u.tier === 2 ? '<b class="often">자주 옴</b> ' : ''}30일 ${u.often}개에 옴</span></div>${noteMini(u.user)}</a>`; }).join('')}</div>`
      : `<div class="muted" style="padding:6px 0">${doneN ? `오늘 다 다녀왔어요 ✅ (${doneN}명)` : '최근 3일 새 글 올린 맞팔이 아직 없어요'}</div>`}
    <div class="muted" style="margin-top:6px"><span class="tmore"></span>대상 ① ${n1}명 · ② ${n2}명 중 새 글 올리고 아직 안 연 사람 · 새 글은 4시간마다 확인(개인 계정은 안 보임) · 인스타 앱에서 직접 다녀온 건 몰라서 또 뜰 수 있어요 — 'N시간 전 새 글'로 확인</div></div>`;
}

// ── 맞팔 후보 (사용자 261126 '4번 좋아'): 맞팔 아닌데 내 게시물에 자주 오는 사람 ──
function renderCands() {
  const cut = new Date(Date.now() - 30 * 864e5).toISOString(), mut = new Set(S.mut);
  // 눌러서 열어 본 사람은 숨김 — 7일 지나고, 그 뒤에도 또 댓글을 달았으면 다시 (사용자 261126 '확인하면 사라지게·일주일 뒤에도 추천할 사람이면')
  const wk = new Date(Date.now() - 7 * 864e5 + 9 * 3600e3).toISOString().slice(0, 19);
  const snoozed = (u, o) => { const v = S.visits[u]; return !!v && (v.slice(0, 19) > wk || o.last <= v); };
  // 소통 댓글만 셈 — DM 키워드 댓글은 뺌 (사용자 261126). o.talk {댓글 id: 소통이면 게시물 id, 키워드면 ''} — 봇이 채우기 전 사람은 안 나옴
  const talk = o => { const v = Object.values(o.talk || {}); return { posts: new Set(v.filter(Boolean)).size, n: v.filter(Boolean).length, kw: v.filter(x => !x).length }; };
  const cs = Object.entries(S.st.others || {}).filter(([u, o]) => !mut.has(u) && o.last >= cut && talk(o).posts >= 2 && !snoozed(u, o))
    .map(([u, o]) => ({ user: u, ...talk(o), last: o.last })).sort((a, b) => (b.posts - a.posts) || (b.n - a.n));
  if (!cs.length) return '';   // 없으면 숨김 (맞팔 탭 맨 위라)
  return `<div class="gh" style="margin-top:4px">🌱 맞팔 후보 <span class="muted">${cs.length}명 · 맞팔은 아닌데 최근 30일 내 게시물 2개 이상에 소통 댓글(DM 키워드 말고) 단 사람 · 눌러 보면 7일 숨김</span></div>` +
    (cs.length ? `<div class="grid" style="margin-bottom:16px">${cs.map(u => `<a class="pcard ${opened(u.user, u.last) ? 'v' : ''}" href="https://www.instagram.com/${esc(u.user)}/" target="_blank" rel="noopener" data-open="${esc(u.user)}">
      <div class="pu">@${esc(u.user)}</div><div class="pn"><span>게시물 ${u.posts}개 · 소통 ${u.n}${u.kw ? ` · 키워드 ${u.kw}` : ''}</span></div><div class="pn"><span>${ago(u.last)}</span><span class="nb" data-note="${esc(u.user)}">✎</span></div>${noteMini(u.user)}</a>`).join('')}</div>` : '<div class="card muted">아직 없어요 — 며칠 쌓이면 나와요</div>');
}

// ── 2번 탭: 최근 나에게 댓글 단 맞팔 (날짜별 묶음, 작은 카드) ──
function counts(days) {
  const cut = new Date(Date.now() - days * 864e5).toISOString(), m = {};
  for (const c of Object.values(S.st.comments || {})) if (c.at >= cut) { const u = m[c.user] ||= { user: c.user, n: 0, posts: new Set(), last: '' }; u.n++; u.posts.add(c.media); if (c.at > u.last) u.last = c.at; }
  return m;
}
function renderStats() {
  const m = counts(30), ranked = Object.values(m).sort((a, b) => (b.posts.size - a.posts.size) || (b.n - a.n)), top = S.statsAll ? ranked : ranked.slice(0, 10);
  if (!top.length) return '';
  const mx = top[0].posts.size, posts30 = Object.values(S.st.media || {}).filter(x => x.at >= new Date(Date.now() - 30 * 864e5).toISOString()).length;
  return `<div class="card"><div class="row" style="justify-content:space-between"><b>🏆 자주 오는 맞팔 · 최근 30일${S.statsAll ? '' : ' TOP 10'}</b><span class="muted">내 게시물 ${posts30}개 중 몇 개에 왔는지</span></div>
    <div class="ubs">${top.map((u, i) => `<a class="ub ${i < 3 ? 'ub-top' : ''}" href="https://www.instagram.com/${esc(u.user)}/" target="_blank" rel="noopener" data-open="${esc(u.user)}">${avatar(u.user)}
      <span class="ub-n">${i < 3 ? ['🥇', '🥈', '🥉'][i] : `<i>${i + 1}</i>`}@${esc(u.user)}</span><span class="ub-c">${u.posts.size}개 · 💬${u.n}</span><span class="ub-c2">${u.posts.size}개</span></a>`).join('')}</div>
    ${ranked.length > 10 ? `<button class="btn" data-more style="width:100%;margin-top:8px">${S.statsAll ? '접기' : `더보기 (${ranked.length}명 전부)`}</button>` : ''}
    <div class="muted" style="margin-top:6px">맞팔 ${S.mut.length}명 중 30일 안에 댓글 단 사람 ${Object.keys(m).length}명 · 사진은 비즈니스·크리에이터 계정만(개인 계정은 첫 글자)</div></div>`;
}
// 프로필 동그라미 (사용자 261126): 봇이 보관한 사진(state/ig_thumbs/u_*.jpg), 없으면 첫 글자
function avatar(u) {
  const x = (S.st.latest || {})[u] || {}, h = [...u].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 360, 7);
  return `<span class="av" style="background:hsl(${h} 45% 42%)">${esc((u.replace(/[^a-zA-Z0-9]/g, '')[0] || u[0] || '?').toUpperCase())}${x.pic ? `<img data-shot="${esc(x.pic)}" src="${esc(SHOT[x.pic] || '')}" alt="" style="${SHOT[x.pic] ? '' : 'visibility:hidden'}">` : ''}</span>`;
}
function renderQuiet() {
  const m = counts(30), all = S.st.ulast ? Object.fromEntries(Object.entries(S.st.ulast).map(([u, last]) => [u, { last }])) : counts(3650);   // 가벼운 파일엔 31일 댓글만 → 사람별 마지막 댓글 시각(ulast)
  const dir = S.quietOld ? -1 : 1;   // 최근순(기본) ↔ 오래된순 (사용자 261126)
  const q = S.mut.filter(u => !m[u]).map(u => ({ user: u, last: (all[u] || {}).last || '' }))
    .sort((a, b) => (a.last === b.last ? (a.user > b.user ? 1 : -1) : !a.last ? 1 : !b.last ? -1 : (b.last > a.last ? dir : -dir)));
  const age = l => l ? (Date.now() - new Date(l)) / 864e5 : 9999;
  const tone = l => { const d = age(l); return d < 60 ? 'y' : d < 90 ? 'o' : 'r'; };   // 1~2달 노랑 · 2~3달 주황 · 그 뒤·기록 없음 빨강
  const cnt = { y: 0, o: 0, r: 0 }; q.forEach(u => cnt[tone(u.last)]++);
  // 뱃지로 (사용자 261126 '조용한 맞팔도 마찬가지'): 기간별로 칸을 나누고 사진+아이디+마지막 댓글
  const badge = u => {
    const v = !!S.visits[u.user], note = (S.notes || {})[u.user] || '', d = age(u.last);
    return `<a class="ub pb q${tone(u.last)} ${v ? 'v' : ''}" href="https://www.instagram.com/${esc(u.user)}/" target="_blank" rel="noopener" data-open="${esc(u.user)}" title="${u.last ? `마지막 댓글 ${esc(ago(u.last))}` : '댓글 기록 없음'}">
      <span class="avw">${avatar(u.user)}</span><span class="ub-n">@${esc(u.user)}</span><span class="ub-c">${u.last ? `${Math.floor(d)}일` : '기록 없음'}</span>
      ${note ? `<span class="pb-i" title="${esc(note)}">${note.includes('제외') ? '🙅' : '📝'}</span>` : ''}<span class="nb" data-note="${esc(u.user)}" title="메모">✎</span>${v ? `<span class="ck" data-undo="${esc(u.user)}" title="열어 봄 취소">✓</span>` : ''}</a>`;
  };
  const sec = (t, k) => { const l = q.filter(u => tone(u.last) === k); return l.length ? `<div class="gh"><span class="lg ${k}">${t}</span> <span class="muted">${l.length}명</span></div><div class="ubs">${l.map(badge).join('')}</div>` : ''; };
  return `<div class="row" style="justify-content:space-between;margin:0 2px 8px"><span class="muted">맞팔 ${S.mut.length}명 중 30일 동안 댓글 없는 ${q.length}명 · 맞팔 목록 ${esc(S.mutAt)} 기준 · 숫자 = 마지막 댓글 뒤 지난 날</span>
    <button class="btn" data-qsort>${S.quietOld ? '오래된 순 ↓' : '최근 순 ↓'}</button></div>` +
    sec('1~2달', 'y') + sec('2~3달', 'o') + sec('3달 넘음·기록 없음', 'r');
}
function renderPeople() {
  const cut = new Date(Date.now() - 7 * 864e5).toISOString(), m = {};
  for (const c of Object.values(S.st.comments || {})) {
    if (c.at < cut) continue;
    const u = m[c.user] ||= { user: c.user, n: 0, last: '', text: '' };
    u.n++; if (c.at > u.last) { u.last = c.at; u.text = c.text; }
  }
  const groups = {};
  Object.values(m).forEach(u => (groups[dayKey(u.last)] ||= []).push(u));
  const days = Object.keys(groups).sort().reverse();
  if (!days.length) return '<div class="card muted">최근 7일 맞팔 댓글이 없어요</div>';
  // 뱃지로 (사용자 261126 '이 화면도 좀 바꾸면' → 해): 사진+아이디+💬횟수, 댓글 내용은 마우스 올리면, 새 글은 초록 점, 연 사람은 흐리게+✓
  const all = Object.values(m), notOpen = all.filter(u => !(S.visits[u.user] >= u.last)).length;
  const newCut = new Date(Date.now() - 864e5).toISOString();
  const badge = u => {
    const v = S.visits[u.user] >= u.last, lt = (S.st.latest || {})[u.user], nw = lt && lt.at >= newCut, note = (S.notes || {})[u.user] || '';
    return `<a class="ub pb ${v ? 'v' : ''}" href="https://www.instagram.com/${esc(u.user)}/" target="_blank" rel="noopener" data-open="${esc(u.user)}" title="${esc(u.text)}${nw ? '\n🆕 24시간 안에 새 글' : ''}">
      <span class="avw">${avatar(u.user)}${nw ? '<i class="nd"></i>' : ''}</span><span class="ub-n">@${esc(u.user)}</span><span class="ub-c">💬${u.n}</span>
      ${note ? `<span class="pb-i" title="${esc(note)}">${note.includes('제외') ? '🙅' : '📝'}</span>` : ''}<span class="nb" data-note="${esc(u.user)}" title="메모">✎</span>${v ? `<span class="ck" data-undo="${esc(u.user)}" title="열어 봄 취소">✓</span>` : ''}</a>`;
  };
  return renderCands() + renderStats() + `<div class="gh" style="margin-top:4px">💬 최근 7일 나한테 댓글 단 맞팔 <span class="muted">${all.length}명 · 아직 안 연 ${notOpen}명</span></div><div class="muted" style="margin:0 2px 8px">누르면 프로필이 열리고 ✓(열어 봄)가 붙어요 · 마우스를 올리면 댓글 내용 · 🟢 = 24시간 안 새 글</div>` +
    days.map(d => {
      const us = groups[d].sort((a, b) => (+(S.visits[a.user] >= a.last) - +(S.visits[b.user] >= b.last)) || (b.n - a.n));
      return `<div class="gh">${esc(dayLabel(d))} <span class="muted">${us.length}명</span></div><div class="ubs">${us.map(badge).join('')}</div>`;
    }).join('');
}

// 주소 #탭/게시물 — 뒤로 가기가 전 화면(게시물 목록·전 탭)으로 (사용자 261126)
function go(tab, post, replace) {
  S.tab = tab; S.post = post || null;
  try { localStorage.setItem('kydz_mutuals_tab', tab); } catch (e) {}
  const h = '#' + tab + (post ? '/' + post : '');
  if (location.hash !== h) history[replace ? 'replaceState' : 'pushState']({ kd: 1 }, '', h);
  render(); scrollTo(0, 0);
}
function fromHash() {
  const [t, p] = (location.hash || '').slice(1).split('/');
  if (['posts', 'people', 'quiet', 'cands'].includes(t)) { S.tab = t === 'cands' ? 'people' : t; S.post = p || null; return true; }   // 예전 #cands 주소는 맞팔 탭으로
  return false;
}
addEventListener('popstate', () => { if (history.state && history.state.knLayer) return; if (fromHash() || !location.hash) { if (!location.hash) S.post = null; if (S.st) render(); } });
function render() {
  renderMode();
  const TABS = [['posts', '📝 게시물'], ['people', '💬 맞팔'], ['quiet', '💤 조용한 맞팔']];   // 맞팔 후보는 맞팔 탭 맨 위로 (사용자 261126)
  if (window.kydzNav) kydzNav.setSub(TABS.map(([key, label]) => ({ key, label })), S.tab, k => go(k));
  $('#tabs').innerHTML = TABS.map(([k, t]) => `<button class="btn ${S.tab === k ? 'on' : ''}" data-tab="${k}">${t}</button>`).join('') + apiBattery();
  $('#tabs').querySelectorAll('[data-tab]').forEach(b => b.onclick = () => go(b.dataset.tab));
  if (S.tab === 'cands') S.tab = 'people';
  if (!['posts', 'people', 'quiet'].includes(S.tab)) S.tab = 'posts';
  $('#main').innerHTML = S.tab === 'posts' ? renderPosts() : S.tab === 'people' ? renderPeople() : renderQuiet();
  loadShots();
  $('#main').querySelectorAll('[data-post]').forEach(b => b.onclick = e => { if (e.target.closest('[data-sel],[data-stop]')) return; go('posts', b.dataset.post); });
  $('#main').querySelectorAll('[data-sel]').forEach(b => b.onclick = e => { e.preventDefault(); e.stopPropagation(); const m = b.dataset.sel; S.sel.has(m) ? S.sel.delete(m) : S.sel.add(m); render(); });
  // 선택 줄은 위 메뉴 줄 오른쪽 끝에 (사용자 261126)
  if (window.kydzNav && kydzNav.setActions) {
    if (S.sel.size && S.tab === 'posts' && !S.post) {
      const box = document.createElement('span'); box.style.cssText = 'display:flex;gap:6px;align-items:center';
      box.innerHTML = `<span class="sel">${S.sel.size}개</span><button class="btn" data-selclear>취소</button><button class="btn pri" data-autostart>자동 시작</button>`;
      kydzNav.setActions(box);
    } else kydzNav.setActions(null);
  }
  document.querySelectorAll('[data-selclear]').forEach(b => b.onclick = () => { S.sel.clear(); render(); });
  document.querySelectorAll('[data-autostart]').forEach(b => b.onclick = async () => {
    const ids = [...S.sel]; if (!confirm(`게시물 ${ids.length}개의 맞팔 댓글에 대댓글을 자동으로 달까요?\n(3~9분 간격(평균 6분), 9~22시, 초안은 10분 안에 만들어져요)`)) return;
    b.disabled = true;
    try { S.ctl = await writeJson('state/ig_comments_ctl.json', d => { d.auto_media ||= {}; ids.forEach(m => d.auto_media[m] = kstNow()); if (d.mode === 'paused') { d.mode = 'on'; d.mode_at = kstNow(); } }, 'ig(admin): 대댓글 자동 시작'); S.sel.clear(); render(); toast('자동 시작 — 진행 중으로 옮겼어요'); }
    catch (e) { alert(e.message); b.disabled = false; }
  });
  $('#main').querySelectorAll('[data-autoone]').forEach(b => b.onclick = async () => {
    const m = b.dataset.autoone; if (!confirm('이 게시물의 맞팔 댓글에 대댓글을 자동으로 달까요?\n(3~9분 간격(평균 6분), 9~22시, 초안은 10분 안에 만들어져요)')) return;
    b.disabled = true;
    try { S.ctl = await writeJson('state/ig_comments_ctl.json', d => { d.auto_media ||= {}; d.auto_media[m] = kstNow(); if (d.mode === 'paused') { d.mode = 'on'; d.mode_at = kstNow(); } }, 'ig(admin): 대댓글 자동 시작'); render(); toast('자동 시작'); }
    catch (e) { alert(e.message); b.disabled = false; }
  });
  $('#main').querySelectorAll('[data-stop]').forEach(b => b.onclick = async e => {
    e.stopPropagation(); const m = b.dataset.stop; b.disabled = true;
    try { S.ctl = await writeJson('state/ig_comments_ctl.json', d => { if (d.auto_media) delete d.auto_media[m]; for (const id of Object.keys(d.queue || {})) if (((S.st.comments || {})[id] || {}).media === m) delete d.queue[id]; }, 'ig(admin): 대댓글 멈춤'); render(); toast('이 게시물 자동 멈춤 — 줄에 올린 것도 뺐어요 (고친 글은 남아요)'); }   // 멈추면 줄에서도 뺌 (261126)
    catch (er) { alert(er.message); b.disabled = false; }
  });
  $('#main').querySelectorAll('[data-back]').forEach(b => b.onclick = () => { if (history.state && history.state.kd) history.back(); else go('posts', null, true); });
  const mark = async (u, val) => {
    if (val) S.visits[u] = val; else delete S.visits[u];
    render();
    try { await writeJson('state/ig_visits.json', d => { d.visits ||= {}; if (val) d.visits[u] = val; else delete d.visits[u]; }, 'ig(admin): 맞팔 열어 봄'); } catch (e) { alert(e.message); }
  };
  $('#main').querySelectorAll('[data-qmore]').forEach(b => b.onclick = () => { S.openQueue = !S.openQueue; render(); });
  fitQline(); fitToday();
  // 마우스 올리면 게시물 썸네일 크게 + 제목·답글 (사용자 261126 '마우스 오버 시 게시물 썸네일 크게') — 한 줄이 넘침 숨김이라 화면 위에 띄움
  let pop = document.getElementById('qpop');
  if (!pop) { pop = document.createElement('div'); pop.id = 'qpop'; document.body.appendChild(pop); }
  $('#main').querySelectorAll('.qp').forEach(a => {
    a.onmouseenter = () => {
      const img = a.querySelector('.qth img');
      pop.innerHTML = `${img && img.src ? `<img src="${esc(img.src)}" alt="">` : ''}<div class="qpt">📝 ${esc(a.dataset.qt || '')}</div><div class="qpr">↳ ${esc(a.dataset.qr || '')}</div>`;
      const r = a.getBoundingClientRect(), W = 260;
      pop.style.left = Math.max(8, Math.min(innerWidth - W - 8, r.left)) + 'px';
      pop.style.top = (r.bottom + 6 + 330 > innerHeight ? Math.max(8, r.top - 6 - pop.offsetHeight) : r.bottom + 6) + 'px';
      pop.classList.add('on');
      if (r.bottom + 6 + pop.offsetHeight > innerHeight) pop.style.top = Math.max(8, r.top - 6 - pop.offsetHeight) + 'px';
    };
    a.onmouseleave = () => pop.classList.remove('on');
  });
  $('#main').querySelectorAll('[data-qpost]').forEach(a => a.onclick = e => { e.preventDefault(); go('posts', a.dataset.qpost); });
  $('#main').querySelectorAll('[data-donetg]').forEach(b => b.onclick = () => { S.openDoneP = !S.openDoneP; render(); });
  $('#main').querySelectorAll('[data-qsort]').forEach(b => b.onclick = () => { S.quietOld = !S.quietOld; render(); });
  $('#main').querySelectorAll('[data-more]').forEach(b => b.onclick = () => { S.statsAll = !S.statsAll; render(); });
  $('#main').querySelectorAll('[data-note]').forEach(b => b.onclick = e => { e.preventDefault(); e.stopPropagation(); noteEdit(b, b.dataset.note); });
  $('#main').querySelectorAll('[data-undo]').forEach(b => b.onclick = e => { e.preventDefault(); e.stopPropagation(); mark(b.dataset.undo, ''); });
  $('#main').querySelectorAll('[data-open]').forEach(a => a.addEventListener('click', e => { if (e.target.dataset.undo || e.target.dataset.note) return; mark(a.dataset.open, kstNow()); }));
  $('#main').querySelectorAll('[data-save]').forEach(b => b.onclick = async () => {
    const id = b.dataset.save, t = $(`[data-edit="${id}"]`).value.trim(); if (!t) return;
    b.disabled = true;
    try { S.ctl = await writeJson('state/ig_comments_ctl.json', d => { (d.edits ||= {})[id] = t; d.skip = (d.skip || []).filter(x => x !== id); autoOn(d, id); }, 'ig(admin): 대댓글 수정'); b.textContent = '저장됨'; } catch (e) { alert(e.message); b.disabled = false; }
  });
  // [댓글 달기] = 줄에 올림 (사용자 261126 '바로 달지 말고 큐에 쌓아 지금 자동으로 돌리는 거에 같이') — 봇이 3~9분 간격(평균 6분)으로, 줄에 올린 것 먼저
  $('#main').querySelectorAll('[data-postnow]').forEach(b => b.onclick = async () => {
    const id = b.dataset.postnow, t = $(`[data-edit="${id}"]`).value.trim(); if (!t) { alert('답글을 써 주세요'); return; }
    b.disabled = true;
    try {
      S.ctl = await writeJson('state/ig_comments_ctl.json', d => { (d.edits ||= {})[id] = t; (d.queue ||= {})[id] = kstNow(); d.skip = (d.skip || []).filter(x => x !== id); autoOn(d, id); }, 'ig(admin): 대댓글 줄에 올림');
      render(); toast('줄에 올렸어요 — 차례대로 달려요');
    } catch (e) { alert(e.message); b.disabled = false; }
  });
  $('#main').querySelectorAll('[data-unqueue]').forEach(b => b.onclick = async () => {
    const id = b.dataset.unqueue; b.disabled = true;
    try { S.ctl = await writeJson('state/ig_comments_ctl.json', d => { if (d.queue) delete d.queue[id]; }, 'ig(admin): 대댓글 줄에서 뺌'); render(); toast('줄에서 뺐어요'); }
    catch (e) { alert(e.message); b.disabled = false; }
  });
  $('#main').querySelectorAll('[data-skip]').forEach(b => b.onclick = async () => {
    const id = b.dataset.skip; b.disabled = true;
    try { S.ctl = await writeJson('state/ig_comments_ctl.json', d => { d.skip = [...new Set([...(d.skip || []), id])]; if (d.queue) delete d.queue[id]; }, 'ig(admin): 대댓글 건너뜀'); render(); } catch (e) { alert(e.message); b.disabled = false; }
  });
  $('#main').querySelectorAll('[data-unskip]').forEach(b => b.onclick = async () => {
    const id = b.dataset.unskip; b.disabled = true;
    try { S.ctl = await writeJson('state/ig_comments_ctl.json', d => { d.skip = (d.skip || []).filter(x => x !== id); }, 'ig(admin): 건너뜀 되돌림'); render(); } catch (e) { alert(e.message); b.disabled = false; }
  });
}

// 메모 바로 입력 (사용자 261126 '입력칸이 왜 이걸로' → '카드 안에서 바로 입력'): 댓글 카드는 그 자리에서, 작은 카드(✎)는 그 옆에 작은 칸
function noteEdit(el, u) {
  document.querySelectorAll('.npop').forEach(x => x.remove());
  const form = document.createElement('div'); form.className = 'nedit';
  form.innerHTML = `<input type="text" placeholder="메모 ('제외' 넣으면 자동 안 함) · 비우면 지움" value="${esc(S.notes[u] || '')}"><button class="btn sm pri">저장</button><button class="btn sm">취소</button>`;
  let host;
  if (el.classList.contains('note')) { host = el; el.replaceChildren(form); el.onclick = null; el.removeAttribute('data-note'); }
  else {
    host = document.createElement('div'); host.className = 'npop'; host.innerHTML = `<div class="u">@${esc(u)} 메모</div>`; host.appendChild(form); form.style.marginTop = '0';
    document.body.appendChild(host);
    const r = el.getBoundingClientRect(), w = host.offsetWidth;
    host.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.right - w)) + 'px';
    host.style.top = Math.min(innerHeight - host.offsetHeight - 8, r.bottom + 6) + 'px';
  }
  const inp = form.querySelector('input'), [ok, no] = form.querySelectorAll('button');
  ['click', 'pointerdown'].forEach(t => form.addEventListener(t, ev => ev.stopPropagation()));
  const close = () => { if (host.classList.contains('npop')) host.remove(); else render(); };
  const save = async () => {
    const v = inp.value.trim();
    if (v) S.notes[u] = v; else delete S.notes[u];
    ok.disabled = true;
    try { await writeJson('state/ig_notes.json', d => { d.notes ||= {}; if (v) d.notes[u] = v; else delete d.notes[u]; }, 'ig(admin): 맞팔 메모'); } catch (er) { alert(er.message); }
    if (host.classList.contains('npop')) host.remove();
    render(); toast(v ? '메모 저장' : '메모 지움');
  };
  ok.onclick = save; no.onclick = close;
  inp.addEventListener('keydown', ev => { if (ev.key === 'Enter' && !ev.isComposing) save(); else if (ev.key === 'Escape') close(); });
  inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
}
async function start() {
  $('#app').style.display = 'block';
  if (!tok()) { $('#main').innerHTML = '<div class="banner err">cupas 토큰이 없어요 — <a href="threads.html">스레드 관리</a>에서 넣어 주세요</div>'; return; }
  fromHash(); if (!location.hash) history.replaceState({ kd: 0 }, '', '#' + S.tab);
  try { await load(); render(); S.refreshedAt = new Date(); } catch (e) { $('#main').innerHTML = `<div class="banner err">${esc(e.message)}</div>`; }
}
(function boot() {
  try { if (sessionStorage.getItem(AUTH_KEY) === '1') return start(); } catch (e) {}
  $('#login').style.display = 'flex';
  const go = async () => { if (await sha256($('#pw').value) === PASSWORD_HASH) { try { sessionStorage.setItem(AUTH_KEY, '1'); } catch (e) {} $('#login').style.display = 'none'; start(); kydzPasskey.offer(); } else $('#pw-err').style.display = 'block'; };
  $('#pw-go').onclick = go; $('#pw').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) go(); });
  kydzPasskey.mountLogin(() => { $('#login').style.display = 'none'; start(); });
})();
</script>
