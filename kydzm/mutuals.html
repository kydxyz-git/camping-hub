<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>인스타 · kydz.kr</title>
<style>
  :root { --bg:#fff; --card:#fff; --text:#1a1a1a; --muted:#6e6e6e; --line:#e5e5e5; --soft:#f5f5f3; --danger:#e63946; --ok:#03c75a; --warn:#f59e0b; --brand:#FFE873; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1d1f1d; --card:#262926; --text:#ececea; --muted:#9a9e98; --line:#343834; --soft:#2c302c; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif; }
  .wrap { max-width:760px; margin:0 auto; padding:12px 16px 60px; }
  .top { display:flex; align-items:center; gap:8px; justify-content:space-between; margin:6px 0 12px; }
  h1 { font-size:19px; margin:0; } a { color:inherit; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; }
  .muted { color:var(--muted); font-size:13px; }
  .btn { border:1px solid var(--line); background:var(--soft); color:var(--text); border-radius:8px; padding:6px 10px; font-size:13px; cursor:pointer; }
  .btn.pri { background:var(--brand); border-color:var(--brand); color:#1a1a1a; font-weight:600; }
  .btn.red { color:var(--danger); }
  .tabs { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
  .tabs .btn.on { background:var(--text); color:var(--bg); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .u { font-weight:600; } .n { font-variant-numeric:tabular-nums; }
  .pill { font-size:12px; padding:1px 7px; border-radius:10px; background:var(--soft); color:var(--muted); }
  .pill.red { background:var(--danger-soft); color:var(--danger); } .pill.ok { color:var(--ok); }
  textarea { width:100%; border:1px solid var(--line); border-radius:8px; padding:8px; font:inherit; background:var(--bg); color:var(--text); }
  .cm { font-size:14px; margin:4px 0; padding:6px 8px; background:var(--soft); border-radius:8px; }
  .banner { padding:10px 12px; border-radius:10px; margin-bottom:10px; background:var(--soft); }
  .banner.err { background:var(--danger-soft); color:var(--danger); }
  .login { min-height:90vh; display:flex; align-items:center; justify-content:center; }
  input.pw { border:1px solid var(--line); border-radius:8px; padding:8px; font:inherit; background:var(--bg); color:var(--text); }
  .pc { cursor:pointer; padding:8px 10px; }
  .th { width:52px; height:52px; border-radius:8px; object-fit:cover; flex:none; background:var(--soft); }
  .gh { font-weight:700; margin:14px 2px 6px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:6px; }
  .pcard { display:block; text-decoration:none; border:1px solid var(--line); border-radius:10px; padding:6px 7px; background:var(--card); min-width:0; }
  .pcard.v { opacity:.45; }
  .pu { font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pt { font-size:11px; color:var(--muted); line-height:1.3; height:2.6em; overflow:hidden; }
  .pn { font-size:11px; color:var(--muted); display:flex; justify-content:space-between; min-height:14px; }
  .ck { color:var(--ok); font-weight:700; padding:0 2px; }
  .bar { display:flex; align-items:center; gap:8px; text-decoration:none; padding:3px 0; font-size:13px; }
  .bn { width:16px; color:var(--muted); text-align:right; flex:none; }
  .bu { width:130px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:none; font-weight:600; }
  .bb { flex:1; height:8px; background:var(--soft); border-radius:4px; overflow:hidden; } .bb i { display:block; height:100%; background:var(--brand); }
  .bc { flex:none; color:var(--muted); font-size:12px; }
  .card.open { border-color:var(--danger); }
  .note { font-size:12px; margin-top:6px; cursor:pointer; }
  .nm { font-size:11px; background:var(--brand-soft); color:var(--text); border-radius:4px; padding:1px 4px; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .nb { color:var(--muted); padding:0 3px; cursor:pointer; }
  .g2 { grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); margin-top:8px; }
  .tc .pn { flex-direction:column; }
  .tc img, .tc .ph { width:100%; aspect-ratio:1; object-fit:cover; border-radius:6px; background:var(--soft); display:block; margin-bottom:4px; }
  .pcard.ty, .lg.y { background:rgba(250,204,21,.16); border-color:rgba(250,204,21,.55); }
  .pcard.to, .lg.o { background:rgba(249,115,22,.16); border-color:rgba(249,115,22,.55); }
  .pcard.tr, .lg.r { background:rgba(230,57,70,.14); border-color:rgba(230,57,70,.5); }
  .lg { font-size:12px; padding:2px 8px; border-radius:10px; border:1px solid; }
  .sbar { display:flex; flex-wrap:wrap; gap:4px 12px; align-items:center; font-size:13px; padding:8px 12px; background:var(--soft); border-radius:10px; margin-bottom:10px; }
  .tabs { position:sticky; top:0; z-index:50; background:var(--bg); padding:6px 0; margin:0 0 8px; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; }
  .tabs .btn { flex:none; white-space:nowrap; }
  .gh.red { color:var(--danger); }
  .card.going { border-color:var(--ok); }
  .card.sel { background:var(--soft); }
  .prow { display:flex; align-items:center; gap:10px; }
  .pmid { min-width:0; flex:1; }
  .ptitle { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ck2 { flex:none; display:flex; align-items:center; justify-content:center; width:34px; height:52px; margin:-8px 0 -8px -6px; cursor:pointer; }
  .ck2 input { width:20px; height:20px; pointer-events:none; accent-color:var(--danger); }
  .btn.sm { padding:5px 9px; flex:none; }
  .actbar { position:fixed; left:var(--kn-w,0px); right:0; bottom:0; z-index:8000; display:flex; align-items:center; gap:8px; padding:10px 16px calc(10px + env(safe-area-inset-bottom)); background:var(--card); border-top:1px solid var(--line); box-shadow:0 -4px 14px rgba(0,0,0,.12); }
  .actbar span { flex:1; padding-left:52px; }
  .actbar .btn { padding:9px 14px; font-size:14px; }
  .toast { position:fixed; left:50%; bottom:84px; transform:translateX(-50%); z-index:9500; background:#1a1a1a; color:#fff; padding:9px 14px; border-radius:20px; font-size:13px; }
  @media (max-width:600px) { .wrap { padding:8px 12px 60px; } .card { padding:10px; } .th { width:46px; height:46px; } }
  .card.sk { opacity:.7; }
  .pill.scr { color:var(--info); }
</style>

<script src="lib/nav.js?v=261126f"></script>
</head>
<body>
<div class="login" id="login" style="display:none">
  <div class="card" style="width:300px">
    <div style="font-weight:700;margin-bottom:8px">인스타 · 관리자 전용</div>
    <div class="row" style="flex-wrap:nowrap"><input type="password" class="pw" id="pw" placeholder="비밀번호"><button class="btn pri" id="pw-go">입장</button></div>
    <div class="muted" id="pw-err" style="display:none;color:var(--danger)">비밀번호가 올바르지 않습니다</div>
  </div>
</div>
<div class="wrap" id="app" style="display:none">
    <div id="mode"></div>
  <div class="tabs" id="tabs"></div>
  <div id="main"><div class="card muted">불러오는 중...</div></div>
</div>
<script src="lib/passkey.js?v=261103c"></script>
<script>
// 맞팔 방문·대댓글 (사용자 261126) — 데이터는 비공개 cupas state/ig_comments.json(ig_comments.py가 씀).
// 이 화면은 state/ig_visits.json(다녀옴)과 state/ig_comments_ctl.json(모드·수정·건너뛰기)만 씀 — 봇 파일을 직접 고치지 않음.
// 공개 저장소라 이 파일에 계정 이름·댓글 예시를 넣지 않는다.
const PASSWORD_HASH = 'fc0d164e3259b5a28b9b7ac489e95e1638ba1bc37a27c2bb07ac7bdb624f1347';
const AUTH_KEY = 'kydz_admin_authed', TOKEN_KEY = 'kydz_cupas_gh_token';
const RP = 'https://api.github.com/repos/kydxyz-git/cupas';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const S = { st: null, visits: {}, ctl: {}, tab: 'posts', post: null, sending: {}, sel: new Set() };
try { S.tab = localStorage.getItem('kydz_mutuals_tab') || 'posts'; } catch (e) {}

function tok() { try { return localStorage.getItem(TOKEN_KEY) || localStorage.getItem('kydz_admin_gh_token') || ''; } catch (e) { return ''; } }
async function sha256(t) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
function kstNow() { return new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 19) + '+09:00'; }
function ago(iso) { if (!iso) return ''; const d = (Date.now() - new Date(iso)) / 864e5; return d < 1 ? '오늘' : d < 2 ? '어제' : `${Math.floor(d)}일 전`; }
function utf8ToB64(t) { const a = new TextEncoder().encode(t); let s = ''; for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode(...a.subarray(i, i + 0x8000)); return btoa(s); }
function b64ToUtf8(b) { const bin = atob(b.replace(/\n/g, '')); const a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new TextDecoder().decode(a); }
async function gh(url, opts = {}) {
  const r = await fetch(url, { method: opts.method || 'GET', cache: 'no-store', headers: { Authorization: 'Bearer ' + tok(), Accept: opts.raw ? 'application/vnd.github.raw' : 'application/vnd.github+json', ...(opts.body ? { 'Content-Type': 'application/json' } : {}) }, body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (r.status === 404 && opts.ok404) return null;
  if (!r.ok) throw new Error(`깃허브 오류 ${r.status} — 토큰을 스레드 관리 화면에서 확인해 주세요`);
  if (r.status === 204) return null;
  return opts.raw ? r.text() : r.json();
}
async function readJson(path) {   // 작은 파일: sha 같이
  const d = await gh(`${RP}/contents/${path}?ref=main`, { ok404: true });
  return d ? { data: JSON.parse(b64ToUtf8(d.content)), sha: d.sha } : { data: {}, sha: '' };
}
async function writeJson(path, mutate, msg) {   // 최신본 위에 고쳐 저장 (충돌 나면 한 번 더)
  for (let i = 0; i < 3; i++) {
    const f = await readJson(path); mutate(f.data);
    try { await gh(`${RP}/contents/${path}`, { method: 'PUT', body: { message: msg, content: utf8ToB64(JSON.stringify(f.data, null, 2) + '\n'), branch: 'main', ...(f.sha ? { sha: f.sha } : {}) } }); return f.data; }
    catch (e) { if (i === 2) throw e; }
  }
}

async function load() {
  const [st, v, c, mu, no] = await Promise.all([gh(`${RP}/contents/state/ig_comments.json?ref=main`, { raw: true }), readJson('state/ig_visits.json'), readJson('state/ig_comments_ctl.json'), readJson('state/ig_mutuals.json'), readJson('state/ig_notes.json')]);
  S.st = JSON.parse(st); S.visits = v.data.visits || {}; S.ctl = c.data; S.mut = mu.data.mutual || []; S.mutAt = mu.data.at || ''; S.notes = no.data.notes || {};
}

function todayPosted() { const t = dayKey(new Date().toISOString()); return Object.values(S.st.comments || {}).filter(c => c.status === 'posted' && c.posted_at && dayKey(c.posted_at) === t).length; }
function renderMode() {   // 위 상태 줄 (사용자 261126: 큰 '자동 시작' 버튼 없애고 게시물별로)
  const st = S.st, on = Object.keys(S.ctl.auto_media || {}).length, paused = st.mode === 'paused' && !(S.ctl.mode === 'on' && S.ctl.mode_at > (st.mode_at || ''));
  const next = (st.pace || {}).next_at;
  $('#mode').innerHTML = paused
    ? `<div class="banner err"><div class="row" style="justify-content:space-between"><b>⛔ 대댓글 멈춤 — 인스타가 거절</b><button class="btn pri" data-resume>다시 켜기</button></div><div class="muted">${esc(st.paused_reason || '')}</div></div>`
    : `<div class="sbar"><span>🔄 진행 중 <b>${on}</b>개</span><span>오늘 단 답글 <b>${todayPosted()}</b></span>${on && next ? `<span class="muted">다음 ${esc(hm(next))} 이후</span>` : ''}<span class="muted">확인 ${esc(hm((st.pace || {}).fetched_at || ''))}</span></div>`;
  $('#mode').querySelectorAll('[data-resume]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    S.ctl = await writeJson('state/ig_comments_ctl.json', d => { d.mode = 'on'; d.mode_at = kstNow(); }, 'ig(admin): 맞팔 대댓글 다시 켬');
    render(); toast('다시 켰어요 — 10분 안에 반영');
  });
}
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }

function dayKey(iso) { return new Date(new Date(iso).getTime() + 9 * 3600e3).toISOString().slice(0, 10); }
function dayLabel(k) { const t = dayKey(new Date().toISOString()); const y = dayKey(new Date(Date.now() - 864e5).toISOString()); return k === t ? '오늘' : k === y ? '어제' : `${+k.slice(5, 7)}/${+k.slice(8, 10)}`; }
function hm(iso) { return iso ? new Date(new Date(iso).getTime() + 9 * 3600e3).toISOString().slice(11, 16) : ''; }
function postLink(mid) { return (S.st.media[mid] || {}).permalink || '#'; }
function norm(t, u) { let s = String(t || ''); if (u) s = s.split(u).join(''); return s.replace(/@[\w.]+/g, '').replace(/[^\p{L}\p{N}_]/gu, '').toLowerCase(); }
function skipWhy(id, c) {   // 건너뜀: 화면에서 [건너뛰기] 누른 것만 (메모 '제외'는 자동만 안 하고 목록엔 보임 — 사용자 261126 '수동으로 달긴 해야 돼서')
  if ((S.ctl.skip || []).includes(id)) return '화면에서 건너뜀';
  if (c.status === 'skip' && c.why !== '화면에서 건너뜀' && c.why !== '메모: 제외') return c.why || '건너뜀';
  return '';
}
function autoOff(c) { const n = (S.notes || {})[c.user]; return !!(n && n.includes('제외')); }
function myReplies(c, withSb) {   // 내가 단 답글(직접·자동). 소셜비즈 자동 DM 답글은 withSb일 때만
  if (!S.tpl) S.tpl = new Set(S.st.tpl || []);
  const out = (c.mine || []).filter(r => r.id !== c.reply_id).map(r => ({ t: r.text, k: (S.tpl.has(norm(r.text)) || S.tpl.has(norm(r.text, c.user))) ? '소셜비즈' : '직접' })).filter(r => withSb || r.k !== '소셜비즈');
  if (c.status === 'posted') out.push({ t: c.reply, k: c.by_hand ? '화면' : '자동' });   // 봇이 단 것: 화면 [댓글 달기]면 '화면', 아니면 '자동'
  return out;
}

// ── 1번 탭: 내 게시물 ──
function renderPosts() {
  const by = {};
  for (const [id, c] of Object.entries(S.st.comments || {})) (by[c.media] ||= []).push([id, c]);
  if (S.post) return renderPost(S.post, by[S.post] || []);
  const need = mid => (by[mid] || []).filter(([id, c]) => !myReplies(c).length && !skipWhy(id, c)).length;
  const auto = S.ctl.auto_media || {};
  const ms = Object.entries(S.st.media || {}).sort((a, b) => (b[1].at > a[1].at ? 1 : -1)).slice(0, 40);
  const going = ms.filter(([mid]) => auto[mid]), open = ms.filter(([mid]) => !auto[mid] && need(mid)), done = ms.filter(([mid]) => !auto[mid] && !need(mid));
  const row = ([mid, m], kind) => {
    const cs = by[mid] || [], nd = need(mid);
    const got = cs.filter(([, c]) => myReplies(c).length).length;
    const auto1 = cs.filter(([, c]) => c.status === 'posted').length, chk = cs.filter(([, c]) => c.status === 'check').length;
    const title = (m.cap || '').replace(/^\((협찬|광고)\)\s*/, '').split('\n')[0].slice(0, 40) || '(글 없음)';
    const sel = S.sel.has(mid);
    return `<div class="card pc ${kind === 'open' ? 'open' : kind === 'going' ? 'going' : ''} ${sel ? 'sel' : ''}" data-post="${esc(mid)}"><div class="prow">
      ${kind === 'open' ? `<label class="ck2" data-sel="${esc(mid)}"><input type="checkbox" ${sel ? 'checked' : ''} tabindex="-1"></label>` : ''}
      ${m.thumb ? `<img class="th" src="${esc(m.thumb)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">` : '<div class="th"></div>'}
      <div class="pmid"><div class="muted">${esc(dayLabel(dayKey(m.at)))} ${hm(m.at)} · 💬${m.cc} · 맞팔 ${cs.length}</div><div class="ptitle">${esc(title)}</div>
        <div class="muted">${kind === 'going' ? (nd ? `남은 <b style="color:var(--text)">${nd}</b> · 자동으로 단 ${auto1}` : '✅ 다 달았어요') : nd ? `<span style="color:var(--danger);font-weight:600">답 필요 ${nd}</span> · 내 답 ${got}/${cs.length}` : `내 답 ${got}/${cs.length}`}${chk ? ` · <span style="color:var(--danger)">확인 ${chk}</span>` : ''}</div></div>
      ${kind === 'going' ? `<button class="btn red sm" data-stop="${esc(mid)}">멈춤</button>` : ''}</div></div>`;
  };
  const sec = (t, list, kind, cls = '') => list.length ? `<div class="gh ${cls}">${t} <span class="muted">${list.length}</span></div>` + list.map(x => row(x, kind)).join('') : '';
  return sec('🔄 대댓글 진행 중', going, 'going') +
    (open.length ? `<div class="gh red">🔴 답 필요 <span class="muted">${open.length} · 골라서 자동 시작</span></div>` + open.map(x => row(x, 'open')).join('') : '') +
    sec('✅ 다 답함', done, 'done') +
    (S.sel.size ? `<div class="actbar"><span>선택 <b>${S.sel.size}</b>개</span><button class="btn" data-selclear>취소</button><button class="btn pri" data-autostart>자동 시작</button></div><div style="height:64px"></div>` : '');
}
function renderPost(mid, cs) {
  const m = S.st.media[mid] || {}, edits = S.ctl.edits || {}, skip = new Set(S.ctl.skip || []);
  cs.sort((a, b) => (b[1].at > a[1].at ? 1 : -1));
  return `<div class="row" style="justify-content:space-between;margin-bottom:8px"><button class="btn" data-back>← 게시물</button><a class="btn" href="${esc(m.permalink || '#')}" target="_blank" rel="noopener">인스타에서 보기</a></div>
    <div class="card">${m.thumb ? `<img src="${esc(m.thumb)}" alt="" referrerpolicy="no-referrer" style="width:100%;max-height:320px;object-fit:cover;border-radius:8px;margin-bottom:8px" onerror="this.remove()">` : ''}<div class="muted">${esc(dayLabel(dayKey(m.at)))} ${hm(m.at)} · 전체 댓글 ${m.cc} · 맞팔 ${cs.length}</div><div style="white-space:pre-line;max-height:4.5em;overflow:hidden">${esc((m.cap || '').slice(0, 200))}</div></div>` +
    (cs.length ? (() => {
      const replied = ([, c]) => myReplies(c).length > 0;
      const skipped = cs.filter(x => !replied(x) && skipWhy(x[0], x[1]));
      const open = cs.filter(x => !replied(x) && !skipWhy(x[0], x[1])), done = cs.filter(replied);
      return (open.length ? `<div class="gh" style="color:var(--danger)">🔴 아직 답 안 단 댓글 ${open.length}</div>` + open.map(card).join('') : '<div class="gh">✅ 맞팔 댓글에 다 답했어요</div>')
        + (skipped.length ? `<div class="gh">⏭ 건너뜀 ${skipped.length}</div>` + skipped.map(([id, c]) => `<div class="card sk"><div class="row" style="justify-content:space-between"><span class="row"><a class="u" href="https://www.instagram.com/${esc(c.user)}/" target="_blank" rel="noopener">@${esc(c.user)}</a><span class="pill">${esc(skipWhy(id, c))}</span></span>${skipWhy(id, c) === '화면에서 건너뜀' ? `<button class="btn sm" data-unskip="${esc(id)}">되돌리기</button>` : ''}</div><div class="cm">${esc(c.text)}</div>${noteLine(c.user)}</div>`).join('') : '')
        + (done.length ? `<div class="gh">답한 댓글 ${done.length}</div>` + done.map(card).join('') : '');
    })() : '<div class="card muted">이 게시물엔 맞팔 댓글이 없어요</div>');
  function card([id, c]) {
      const mine = myReplies(c, true), real = mine.filter(r => r.k !== '소셜비즈');
      const draft = ['ready', 'check'].includes(c.status) && !real.length;
      return `<div class="card ${real.length ? '' : 'open'}"><div class="row" style="justify-content:space-between"><a class="u" href="https://www.instagram.com/${esc(c.user)}/" target="_blank" rel="noopener">@${esc(c.user)}</a><span class="muted">${esc(dayLabel(dayKey(c.at)))} ${hm(c.at)}</span></div>
        <div class="cm">${esc(c.text)}</div>
        ${mine.map(r => `<div class="muted">↳ <span class="pill ${r.k === '자동' ? 'ok' : r.k === '화면' ? 'scr' : ''}">${r.k}</span> ${esc(r.t)}</div>`).join('')}
        ${S.sending[id] ? `<div class="banner" style="margin-top:6px">⏳ 달고 있어요 — 1분쯤 뒤 새로고침하면 보여요</div>` : !real.length ? `${draft ? `<div class="muted">${c.status === 'check' ? `<span class="pill red">확인 필요 · ${esc(c.why || '')}</span>` : skip.has(id) ? '<span class="pill">건너뜀</span>' : ((S.ctl.auto_media || {})[c.media] ? `<span class="pill">${esc(dayLabel(dayKey(c.due_at || new Date().toISOString())))} ${esc((c.due_at || '').slice(11, 16))}부터 자동으로 달 예정</span>` : '<span class="pill">초안 (자동 꺼짐)</span>')}</div>` : ''}
          ${autoOff(c) ? '<div class="muted"><span class="pill red">🙅 자동 제외(메모) — 직접 달기</span></div>' : ''}
          <textarea rows="2" data-edit="${esc(id)}" placeholder="답글 쓰기 (@${esc(c.user)}는 자동으로 붙어요)">${esc(edits[id] || (draft ? c.reply : '') || '')}</textarea>
          <div class="row" style="justify-content:flex-end;margin-top:6px">${draft ? `<button class="btn" data-skip="${esc(id)}">건너뛰기</button><button class="btn" data-save="${esc(id)}">수정 저장</button>` : ''}<button class="btn pri" data-postnow="${esc(id)}">댓글 달기</button></div>` : ''}
        ${noteLine(c.user)}</div>`;
  }
}

// ── 메모 (사용자 261126 '8번 좋다') — state/ig_notes.json ──
function noteLine(u) { const n = (S.notes || {})[u]; return `<div class="note" data-note="${esc(u)}">${n ? '📝 ' + esc(n) : '<span class="muted">＋ 메모</span>'}</div>`; }
function noteMini(u) { const n = (S.notes || {})[u]; return n ? `<div class="nm">📝 ${esc(n)}</div>` : ''; }
function hoursAgo(iso) { const h = (Date.now() - new Date(iso)) / 36e5; return h < 1 ? '방금' : h < 24 ? `${Math.floor(h)}시간 전` : `${Math.floor(h / 24)}일 전`; }
function opened(u, since) { return !!S.visits[u] && S.visits[u] >= since; }

// ── 오늘 다녀올 사람 (2번 기준으로 1번, 사용자 261126): 나한테 자주 오는 맞팔 중 새 글 올렸는데 아직 안 연 사람 ──
function renderToday() {
  const m = counts(30), lt = S.st.latest || {}, cut = new Date(Date.now() - 3 * 864e5).toISOString();
  const all = Object.values(m).filter(u => lt[u.user] && lt[u.user].at && lt[u.user].at >= cut);
  const todo = all.filter(u => !opened(u.user, lt[u.user].at)).sort((a, b) => (b.posts.size - a.posts.size) || (lt[b.user].at > lt[a.user].at ? 1 : -1));
  const doneN = all.length - todo.length;
  const checked = Object.values(lt).filter(x => x.checked).length;
  return `<div class="card"><div class="row" style="justify-content:space-between"><b>🚶 오늘 다녀올 맞팔</b><span class="muted">새 글 올렸는데 아직 안 연 사람 · 나한테 자주 오는 순</span></div>
    ${todo.length ? `<div class="grid g2">${todo.slice(0, 10).map(u => { const x = lt[u.user]; return `<a class="pcard tc" href="${esc(x.permalink)}" target="_blank" rel="noopener" data-open="${esc(u.user)}">
      ${x.thumb ? `<img src="${esc(x.thumb)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">` : '<div class="ph"></div>'}
      <div class="pu">@${esc(u.user)}</div><div class="pn"><span>${hoursAgo(x.at)} 새 글</span><span>${u.posts.size}번 옴</span></div>${noteMini(u.user)}</a>`; }).join('')}</div>`
      : `<div class="muted" style="padding:6px 0">${doneN ? `오늘 다 다녀왔어요 ✅ (${doneN}명)` : '최근 3일 새 글 올린 맞팔이 아직 없어요'}</div>`}
    <div class="muted" style="margin-top:6px">${todo.length > 10 ? `외 ${todo.length - 10}명 · ` : ''}최근 30일 나한테 온 맞팔 ${Object.keys(m).length}명 중 ${checked}명 새 글 확인됨(30분마다 10명씩, 개인 계정은 안 보임)</div></div>`;
}

// ── 맞팔 후보 (사용자 261126 '4번 좋아'): 맞팔 아닌데 내 게시물에 자주 오는 사람 ──
function renderCands() {
  const cut = new Date(Date.now() - 30 * 864e5).toISOString(), mut = new Set(S.mut);
  const cs = Object.entries(S.st.others || {}).filter(([u, o]) => !mut.has(u) && o.last >= cut && o.posts.length >= 2)
    .map(([u, o]) => ({ user: u, posts: o.posts.length, n: o.c.length, last: o.last })).sort((a, b) => (b.posts - a.posts) || (b.n - a.n));
  return `<div class="muted" style="margin:0 2px 8px">맞팔은 아닌데 최근 30일 내 게시물 2개 이상에 댓글 단 사람 ${cs.length}명 · 26.11.26부터 쌓는 중(일주일 안 게시물 댓글로) — 맞팔 목록(${esc(S.mutAt)})에 없으면 여기 나와요</div>` +
    (cs.length ? `<div class="grid">${cs.map(u => `<a class="pcard ${opened(u.user, u.last) ? 'v' : ''}" href="https://www.instagram.com/${esc(u.user)}/" target="_blank" rel="noopener" data-open="${esc(u.user)}">
      <div class="pu">@${esc(u.user)}</div><div class="pn"><span>게시물 ${u.posts}개 · 댓글 ${u.n}</span></div><div class="pn"><span>${ago(u.last)}</span><span class="nb" data-note="${esc(u.user)}">✎</span></div>${noteMini(u.user)}</a>`).join('')}</div>` : '<div class="card muted">아직 없어요 — 며칠 쌓이면 나와요</div>');
}

// ── 2번 탭: 최근 나에게 댓글 단 맞팔 (날짜별 묶음, 작은 카드) ──
function counts(days) {
  const cut = new Date(Date.now() - days * 864e5).toISOString(), m = {};
  for (const c of Object.values(S.st.comments || {})) if (c.at >= cut) { const u = m[c.user] ||= { user: c.user, n: 0, posts: new Set(), last: '' }; u.n++; u.posts.add(c.media); if (c.at > u.last) u.last = c.at; }
  return m;
}
function renderStats() {
  const m = counts(30), ranked = Object.values(m).sort((a, b) => (b.posts.size - a.posts.size) || (b.n - a.n)), top = S.statsAll ? ranked : ranked.slice(0, 10);
  if (!top.length) return '';
  const mx = top[0].posts.size, posts30 = Object.values(S.st.media || {}).filter(x => x.at >= new Date(Date.now() - 30 * 864e5).toISOString()).length;
  return `<div class="card"><div class="row" style="justify-content:space-between"><b>🏆 자주 오는 맞팔 · 최근 30일${S.statsAll ? '' : ' TOP 10'}</b><span class="muted">내 게시물 ${posts30}개 중 몇 개에 왔는지</span></div>
    ${top.map((u, i) => `<a class="bar" href="https://www.instagram.com/${esc(u.user)}/" target="_blank" rel="noopener"><span class="bn">${i + 1}</span><span class="bu">@${esc(u.user)}</span>
      <span class="bb"><i style="width:${Math.round(u.posts.size / mx * 100)}%"></i></span><span class="bc n">${u.posts.size}개 · 댓글 ${u.n}</span></a>`).join('')}
    ${ranked.length > 10 ? `<button class="btn" data-more style="width:100%;margin-top:6px">${S.statsAll ? '접기' : `더보기 (${ranked.length}명 전부)`}</button>` : ''}
    <div class="muted" style="margin-top:6px">맞팔 ${S.mut.length}명 중 30일 안에 댓글 단 사람 ${Object.keys(m).length}명</div></div>`;
}
function renderQuiet() {
  const m = counts(30), all = counts(3650);
  const dir = S.quietOld ? -1 : 1;   // 최근순(기본) ↔ 오래된순 (사용자 261126)
  const q = S.mut.filter(u => !m[u]).map(u => ({ user: u, last: (all[u] || {}).last || '' }))
    .sort((a, b) => (a.last === b.last ? (a.user > b.user ? 1 : -1) : !a.last ? 1 : !b.last ? -1 : (b.last > a.last ? dir : -dir)));
  const age = l => l ? (Date.now() - new Date(l)) / 864e5 : 9999;
  const tone = l => { const d = age(l); return d < 60 ? 'y' : d < 90 ? 'o' : 'r'; };   // 1~2달 노랑 · 2~3달 주황 · 그 뒤·기록 없음 빨강
  const cnt = { y: 0, o: 0, r: 0 }; q.forEach(u => cnt[tone(u.last)]++);
  return `<div class="row" style="justify-content:space-between;margin:0 2px 8px"><span class="muted">맞팔 ${S.mut.length}명 중 30일 동안 댓글 없는 ${q.length}명 · 맞팔 목록 ${esc(S.mutAt)} 기준</span>
    <button class="btn" data-qsort>${S.quietOld ? '오래된 순 ↓' : '최근 순 ↓'}</button></div>
    <div class="row" style="margin:0 2px 8px;gap:6px"><span class="lg y">1~2달 ${cnt.y}</span><span class="lg o">2~3달 ${cnt.o}</span><span class="lg r">3달 넘음·기록 없음 ${cnt.r}</span></div><div class="grid">` +
    q.map(u => `<a class="pcard t${tone(u.last)} ${S.visits[u.user] ? 'v' : ''}" href="https://www.instagram.com/${esc(u.user)}/" target="_blank" rel="noopener" data-open="${esc(u.user)}"><div class="pu">@${esc(u.user)}</div>
      <div class="pn"><span>${u.last ? `마지막 ${ago(u.last)}` : '댓글 기록 없음'}</span><span><span class="nb" data-note="${esc(u.user)}">✎</span>${S.visits[u.user] ? '<span class="ck" data-undo="' + esc(u.user) + '">✓</span>' : ''}</span></div>${noteMini(u.user)}</a>`).join('') + '</div>';
}
function renderPeople() {
  const cut = new Date(Date.now() - 7 * 864e5).toISOString(), m = {};
  for (const c of Object.values(S.st.comments || {})) {
    if (c.at < cut) continue;
    const u = m[c.user] ||= { user: c.user, n: 0, last: '', text: '' };
    u.n++; if (c.at > u.last) { u.last = c.at; u.text = c.text; }
  }
  const groups = {};
  Object.values(m).forEach(u => (groups[dayKey(u.last)] ||= []).push(u));
  const days = Object.keys(groups).sort().reverse();
  if (!days.length) return '<div class="card muted">최근 7일 맞팔 댓글이 없어요</div>';
  return renderToday() + renderStats() + `<div class="gh" style="margin-top:4px">💬 최근 7일 나한테 댓글 단 맞팔</div><div class="muted" style="margin:0 2px 8px">누르면 프로필이 열리고 ✓(열어 봄)가 붙어요 — 실제로 댓글 달았는지는 인스타가 알려 주지 않아서 확인 못 해요</div>` +
    days.map(d => {
      const us = groups[d].sort((a, b) => (+!!S.visits[a.user] - +!!S.visits[b.user]) || (b.n - a.n));
      return `<div class="gh">${esc(dayLabel(d))} <span class="muted">${us.length}명</span></div><div class="grid">` +
        us.map(u => { const v = S.visits[u.user] >= u.last; return `<a class="pcard ${v ? 'v' : ''}" href="https://www.instagram.com/${esc(u.user)}/" target="_blank" rel="noopener" data-open="${esc(u.user)}">
          <div class="pu">@${esc(u.user)}</div><div class="pt">${esc(u.text)}</div><div class="pn"><span>${u.n > 1 ? `댓글 ${u.n}` : ''}${(S.st.latest || {})[u.user] && S.st.latest[u.user].at >= new Date(Date.now() - 864e5).toISOString() ? ' · 🆕새 글' : ''}</span><span><span class="nb" data-note="${esc(u.user)}">✎</span>${v ? '<span class="ck" data-undo="' + esc(u.user) + '">✓</span>' : ''}</span></div>${noteMini(u.user)}</a>`; }).join('') + '</div>';
    }).join('');
}

function render() {
  renderMode();
  const TABS = [['posts', '📝 게시물'], ['people', '💬 맞팔'], ['quiet', '💤 조용한 맞팔'], ['cands', '🌱 맞팔 후보']];
  if (window.kydzNav) kydzNav.setSub(TABS.map(([key, label]) => ({ key, label })), S.tab, k => { S.tab = k; S.post = null; try { localStorage.setItem('kydz_mutuals_tab', k); } catch (e) {} render(); scrollTo(0, 0); });
  $('#tabs').innerHTML = TABS.map(([k, t]) => `<button class="btn ${S.tab === k ? 'on' : ''}" data-tab="${k}">${t}</button>`).join('');
  $('#tabs').querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; S.post = null; try { localStorage.setItem('kydz_mutuals_tab', S.tab); } catch (e) {} render(); });
  if (!['posts', 'people', 'quiet', 'cands'].includes(S.tab)) S.tab = 'posts';
  $('#main').innerHTML = S.tab === 'posts' ? renderPosts() : S.tab === 'people' ? renderPeople() : S.tab === 'quiet' ? renderQuiet() : renderCands();
  $('#main').querySelectorAll('[data-post]').forEach(b => b.onclick = e => { if (e.target.closest('[data-sel],[data-stop]')) return; S.post = b.dataset.post; render(); scrollTo(0, 0); });
  $('#main').querySelectorAll('[data-sel]').forEach(b => b.onclick = e => { e.preventDefault(); e.stopPropagation(); const m = b.dataset.sel; S.sel.has(m) ? S.sel.delete(m) : S.sel.add(m); render(); });
  $('#main').querySelectorAll('[data-selclear]').forEach(b => b.onclick = () => { S.sel.clear(); render(); });
  $('#main').querySelectorAll('[data-autostart]').forEach(b => b.onclick = async () => {
    const ids = [...S.sel]; if (!confirm(`게시물 ${ids.length}개의 맞팔 댓글에 대댓글을 자동으로 달까요?\n(10~40분 간격, 9~22시, 초안은 10분 안에 만들어져요)`)) return;
    b.disabled = true;
    try { S.ctl = await writeJson('state/ig_comments_ctl.json', d => { d.auto_media ||= {}; ids.forEach(m => d.auto_media[m] = kstNow()); if (d.mode === 'paused') { d.mode = 'on'; d.mode_at = kstNow(); } }, 'ig(admin): 대댓글 자동 시작'); S.sel.clear(); render(); toast('자동 시작 — 진행 중으로 옮겼어요'); }
    catch (e) { alert(e.message); b.disabled = false; }
  });
  $('#main').querySelectorAll('[data-stop]').forEach(b => b.onclick = async e => {
    e.stopPropagation(); const m = b.dataset.stop; b.disabled = true;
    try { S.ctl = await writeJson('state/ig_comments_ctl.json', d => { if (d.auto_media) delete d.auto_media[m]; }, 'ig(admin): 대댓글 멈춤'); render(); toast('이 게시물 자동 멈춤'); }
    catch (er) { alert(er.message); b.disabled = false; }
  });
  $('#main').querySelectorAll('[data-back]').forEach(b => b.onclick = () => { S.post = null; render(); });
  const mark = async (u, val) => {
    if (val) S.visits[u] = val; else delete S.visits[u];
    render();
    try { await writeJson('state/ig_visits.json', d => { d.visits ||= {}; if (val) d.visits[u] = val; else delete d.visits[u]; }, 'ig(admin): 맞팔 열어 봄'); } catch (e) { alert(e.message); }
  };
  $('#main').querySelectorAll('[data-qsort]').forEach(b => b.onclick = () => { S.quietOld = !S.quietOld; render(); });
  $('#main').querySelectorAll('[data-more]').forEach(b => b.onclick = () => { S.statsAll = !S.statsAll; render(); });
  $('#main').querySelectorAll('[data-note]').forEach(b => b.onclick = async e => {
    e.preventDefault(); e.stopPropagation();
    const u = b.dataset.note, t = prompt(`@${u} 메모 (비우면 지움)`, S.notes[u] || '');
    if (t === null) return;
    const v = t.trim(); if (v) S.notes[u] = v; else delete S.notes[u]; render();
    try { await writeJson('state/ig_notes.json', d => { d.notes ||= {}; if (v) d.notes[u] = v; else delete d.notes[u]; }, 'ig(admin): 맞팔 메모'); } catch (er) { alert(er.message); }
  });
  $('#main').querySelectorAll('[data-undo]').forEach(b => b.onclick = e => { e.preventDefault(); e.stopPropagation(); mark(b.dataset.undo, ''); });
  $('#main').querySelectorAll('[data-open]').forEach(a => a.addEventListener('click', e => { if (e.target.dataset.undo || e.target.dataset.note) return; mark(a.dataset.open, kstNow()); }));
  $('#main').querySelectorAll('[data-save]').forEach(b => b.onclick = async () => {
    const id = b.dataset.save, t = $(`[data-edit="${id}"]`).value.trim(); if (!t) return;
    b.disabled = true;
    try { S.ctl = await writeJson('state/ig_comments_ctl.json', d => { (d.edits ||= {})[id] = t; d.skip = (d.skip || []).filter(x => x !== id); }, 'ig(admin): 대댓글 수정'); b.textContent = '저장됨'; } catch (e) { alert(e.message); b.disabled = false; }
  });
  $('#main').querySelectorAll('[data-postnow]').forEach(b => b.onclick = async () => {
    const id = b.dataset.postnow, t = $(`[data-edit="${id}"]`).value.trim(); if (!t) { alert('답글을 써 주세요'); return; }
    const c = S.st.comments[id];
    if (!confirm(`@${c.user} 댓글 밑에 지금 달까요?\n\n${t}`)) return;
    b.disabled = true; b.textContent = '보내는 중…';
    try {
      await gh(`${RP}/actions/workflows/ig-comments.yml/dispatches`, { method: 'POST', body: { ref: 'main', inputs: { cmd: `post ${id}`, text: t } } });
      S.sending[id] = 1; render();
      setTimeout(async () => { try { await load(); S.sending = {}; render(); } catch (e) {} }, 75000);
    } catch (e) { alert(e.message); b.disabled = false; b.textContent = '댓글 달기'; }
  });
  $('#main').querySelectorAll('[data-skip]').forEach(b => b.onclick = async () => {
    const id = b.dataset.skip; b.disabled = true;
    try { S.ctl = await writeJson('state/ig_comments_ctl.json', d => { d.skip = [...new Set([...(d.skip || []), id])]; }, 'ig(admin): 대댓글 건너뜀'); render(); } catch (e) { alert(e.message); b.disabled = false; }
  });
  $('#main').querySelectorAll('[data-unskip]').forEach(b => b.onclick = async () => {
    const id = b.dataset.unskip; b.disabled = true;
    try { S.ctl = await writeJson('state/ig_comments_ctl.json', d => { d.skip = (d.skip || []).filter(x => x !== id); }, 'ig(admin): 건너뜀 되돌림'); render(); } catch (e) { alert(e.message); b.disabled = false; }
  });
}

async function start() {
  $('#app').style.display = 'block';
  if (!tok()) { $('#main').innerHTML = '<div class="banner err">cupas 토큰이 없어요 — <a href="threads.html">스레드 관리</a>에서 넣어 주세요</div>'; return; }
  try { await load(); render(); } catch (e) { $('#main').innerHTML = `<div class="banner err">${esc(e.message)}</div>`; }
}
(function boot() {
  try { if (sessionStorage.getItem(AUTH_KEY) === '1') return start(); } catch (e) {}
  $('#login').style.display = 'flex';
  const go = async () => { if (await sha256($('#pw').value) === PASSWORD_HASH) { try { sessionStorage.setItem(AUTH_KEY, '1'); } catch (e) {} $('#login').style.display = 'none'; start(); kydzPasskey.offer(); } else $('#pw-err').style.display = 'block'; };
  $('#pw-go').onclick = go; $('#pw').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) go(); });
  kydzPasskey.mountLogin(() => { $('#login').style.display = 'none'; start(); });
})();
</script>
