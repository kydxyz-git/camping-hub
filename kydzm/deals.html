<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>딜 보드 · kydz.kr</title>
<style>
  :root {
    --bg:#fff; --text:#1a1a1a; --muted:#6e6e6e; --line:#e5e5e5;
    --soft:#f5f5f3; --danger:#e63946; --success:#03c75a;
    --warn:#f59e0b; --info:#4a7ba6; --hot:#ff5722;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Pretendard','Segoe UI',sans-serif;
    background:var(--soft); color:var(--text); line-height:1.5;
    -webkit-text-size-adjust:100%; padding-bottom:80px;
  }
  a,a:visited{color:inherit;text-decoration:none}

  .topbar{
    position:sticky; top:0; z-index:60;
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px; background:var(--bg); border-bottom:1px solid var(--line);
  }
  .topbar-title{font-size:15px;font-weight:800;letter-spacing:-0.02em}
  .topbar-btn{
    padding:7px 12px; font-size:12px; font-weight:600;
    background:var(--soft); border:1px solid var(--line);
    border-radius:7px; cursor:pointer; color:var(--text);
  }
  .container{max-width:820px;margin:0 auto;padding:16px}

  .bar{
    display:flex; gap:8px; flex-wrap:wrap; align-items:center;
    background:var(--bg); border:1px solid var(--line);
    border-radius:12px; padding:12px; margin-bottom:14px;
  }
  select,input[type=search]{
    padding:8px 10px; font-size:13px; border:1px solid var(--line);
    border-radius:7px; background:var(--bg); color:var(--text); font-family:inherit;
  }
  input[type=search]{flex:1;min-width:120px}
  .seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .seg button{
    padding:8px 12px; font-size:12px; font-weight:600; border:none;
    background:var(--bg); color:var(--muted); cursor:pointer; font-family:inherit;
  }
  .seg button.on{background:var(--text);color:var(--bg)}

  .meta{font-size:12px;color:var(--muted);margin-bottom:10px;padding:0 2px}

  .row{
    display:flex; gap:10px; background:var(--bg);
    border:1px solid var(--line); border-radius:11px;
    padding:12px; margin-bottom:8px; align-items:flex-start;
  }
  .row.picked{border-color:var(--text);background:#fafaf8}
  .chk{
    width:19px;height:19px;flex:0 0 19px;margin-top:2px;
    accent-color:var(--text);cursor:pointer;
  }
  .body{flex:1;min-width:0}
  .tagline{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
  .badge{
    font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;
    background:var(--soft);color:var(--muted);border:1px solid var(--line);
  }
  .badge.cafe-h{background:#eef4fb;color:#2c5e8f;border-color:#d5e5f5}
  .badge.cafe-c{background:#f0f8f2;color:#1e7a45;border-color:#d5eddd}
  .badge.score{background:var(--text);color:var(--bg);border-color:var(--text)}
  .badge.score.hot{background:var(--hot);border-color:var(--hot)}
  .badge.price{background:#fff4e5;color:#a35b00;border-color:#ffe0b2}
  .badge.disc{background:#ffeaec;color:#c2273a;border-color:#ffd0d5}
  .badge.coupon{background:#f3ecff;color:#5b32a8;border-color:#e2d5ff}

  .ttl{font-size:14px;font-weight:700;line-height:1.4;margin-bottom:4px;word-break:break-all}
  .dsc{font-size:12px;color:var(--muted);line-height:1.5;word-break:break-all}
  .links{margin-top:7px;display:flex;gap:10px;flex-wrap:wrap}
  .links a{
    font-size:11px;font-weight:600;color:var(--info);
    border-bottom:1px solid currentColor;padding-bottom:1px;
  }

  .empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px}
  .loading{text-align:center;padding:50px;color:var(--muted);font-size:13px}

  .dock{
    position:fixed;left:0;right:0;bottom:0;z-index:70;
    background:var(--bg);border-top:1px solid var(--line);
    padding:11px 16px;display:none;
    box-shadow:0 -3px 14px rgba(0,0,0,0.07);
  }
  .dock.on{display:block}
  .dock-in{
    max-width:820px;margin:0 auto;display:flex;
    gap:8px;align-items:center;justify-content:space-between;
  }
  .dock-n{font-size:13px;font-weight:700}
  .dock-btns{display:flex;gap:7px}
  .btn{
    padding:10px 15px;font-size:13px;font-weight:700;
    background:var(--text);color:var(--bg);border:none;
    border-radius:8px;cursor:pointer;font-family:inherit;
  }
  .btn.ghost{background:var(--soft);color:var(--text);border:1px solid var(--line)}

  .toast{
    position:fixed;left:50%;bottom:90px;transform:translateX(-50%);
    background:var(--text);color:var(--bg);padding:11px 18px;
    border-radius:9px;font-size:13px;font-weight:600;
    z-index:90;opacity:0;transition:opacity .2s;pointer-events:none;
  }
  .toast.on{opacity:1}

  @media(max-width:520px){
    .container{padding:12px}
    .bar{padding:10px;gap:6px}
    .ttl{font-size:13px}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title">🔥 딜 보드</div>
  <div style="display:flex;gap:6px">
    <button class="topbar-btn" id="reload">↻</button>
    <button class="topbar-btn" onclick="location.href='index.html'">← 관리자</button>
  </div>
</div>

<div class="container">
  <div class="bar">
    <select id="date"></select>
    <div class="seg" id="cafe">
      <button data-v="" class="on">전체</button>
      <button data-v="헬리녹스크루">헬리녹스</button>
      <button data-v="캠핑퍼스트">퍼스트</button>
    </div>
    <div class="seg" id="min">
      <button data-v="50">50+</button>
      <button data-v="30" class="on">30+</button>
      <button data-v="0">전체</button>
    </div>
    <input type="search" id="q" placeholder="검색">
  </div>

  <div class="meta" id="meta"></div>
  <div id="list"><div class="loading">불러오는 중…</div></div>
</div>

<div class="dock" id="dock">
  <div class="dock-in">
    <div class="dock-n"><span id="pickN">0</span>개 선택</div>
    <div class="dock-btns">
      <button class="btn ghost" id="clear">해제</button>
      <button class="btn" id="copy">복사</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// 수집 리포는 Private → 관리자 GitHub 토큰으로 API 경유 조회
const GH_API  = 'https://api.github.com';
const GH_PATH = '/repos/kydxyz-git/camping-search/contents/data';

// 관리자 인증 가드 — index.html 과 동일 키
if (sessionStorage.getItem('kydz_admin_authed') !== '1') {
  location.replace('index.html');
}

let RECORDS = [], PICKED = new Set();
const $ = id => document.getElementById(id);

function toast(msg){
  const t = $('toast');
  t.textContent = msg; t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'), 1800);
}

function getToken(){
  const t = localStorage.getItem('kydz_admin_gh_token');
  if (!t) throw new Error('GitHub 토큰이 없습니다. 관리자 대시보드에서 먼저 설정해주세요.');
  return t;
}

async function getJSON(path){
  const r = await fetch(`${GH_API}${GH_PATH}/${path}?ref=main&t=${Date.now()}`, {
    headers: {
      'Accept': 'application/vnd.github.raw+json',
      'Authorization': `Bearer ${getToken()}`,
      'X-GitHub-Api-Version': '2022-11-28'
    }
  });
  if (r.status === 404) {
    throw new Error('404 · 토큰에 camping-search 리포 접근 권한이 없습니다.\n' +
      'GitHub Settings → Developer settings → Fine-grained tokens →\n' +
      '해당 토큰 → Repository access 에 camping-search 를 추가해주세요.');
  }
  if (r.status === 401) throw new Error('401 · 토큰이 만료되었거나 유효하지 않습니다.');
  if (!r.ok) throw new Error(`GitHub API ${r.status}`);
  return r.json();
}

async function boot(){
  try {
    const idx = await getJSON('index.json');
    $('date').innerHTML = idx.dates.slice().reverse()
      .map((d,i)=>`<option value="${d}"${i===0?' selected':''}>${d}</option>`).join('');
    await loadDate(idx.latest);
  } catch(e) {
    $('list').innerHTML = `<div class="empty">데이터를 불러오지 못했습니다.<br><small style="white-space:pre-line;line-height:1.7;display:inline-block;margin-top:8px;text-align:left">${e.message}</small></div>`;
  }
}

async function loadDate(date){
  $('list').innerHTML = '<div class="loading">불러오는 중…</div>';
  PICKED.clear(); syncDock();
  try {
    const d = await getJSON(`daily/${date}.json`);
    RECORDS = d.records || [];
    const s = d.summary || {};
    $('meta').textContent =
      `${date} · 전체 ${s.total||RECORDS.length}건 / 딜후보 ${s.deals||0}건` +
      (d.runs ? ` · ${d.runs.length}회 수집 (${d.runs.map(r=>r.at).join(', ')})` : '');
    render();
  } catch(e) {
    RECORDS = [];
    $('list').innerHTML = `<div class="empty">${date} 데이터가 없습니다.</div>`;
    $('meta').textContent = '';
  }
}

function segVal(id){ return $(id).querySelector('.on').dataset.v; }

function render(){
  const cafe = segVal('cafe');
  const min  = +segVal('min');
  const q    = $('q').value.trim().toLowerCase();

  const rows = RECORDS.filter(r =>
    r.score >= min &&
    (!cafe || r.cafe === cafe) &&
    (!q || (r.title+r.desc).toLowerCase().includes(q))
  );

  if (!rows.length){
    $('list').innerHTML = '<div class="empty">조건에 맞는 항목이 없습니다.</div>';
    return;
  }

  $('list').innerHTML = rows.map(r => {
    const cc = r.cafe === '헬리녹스크루' ? 'cafe-h' : 'cafe-c';
    const hot = r.score >= 70 ? ' hot' : '';
    const b = [];
    b.push(`<span class="badge score${hot}">${r.score}</span>`);
    b.push(`<span class="badge ${cc}">${r.cafe}</span>`);
    if (r.tag) b.push(`<span class="badge">${r.tag}</span>`);
    (r.prices||[]).slice(0,2).forEach(p=>b.push(`<span class="badge price">${p}</span>`));
    (r.discounts||[]).slice(0,1).forEach(p=>b.push(`<span class="badge disc">${p}</span>`));
    if (r.coupon) b.push(`<span class="badge coupon">코드 ${r.coupon}</span>`);

    const ext = (r.urls||[]).map((u,i)=>
      `<a href="${u}" target="_blank" rel="noopener">외부링크${i?i+1:''} ↗</a>`).join('');

    return `<label class="row" data-link="${esc(r.link)}">
      <input type="checkbox" class="chk" data-link="${esc(r.link)}">
      <div class="body">
        <div class="tagline">${b.join('')}</div>
        <div class="ttl">${esc(r.title)}</div>
        <div class="dsc">${esc(r.desc)}</div>
        <div class="links">
          <a href="${r.link}" target="_blank" rel="noopener">카페 원문 ↗</a>${ext}
        </div>
      </div>
    </label>`;
  }).join('');

  document.querySelectorAll('.chk').forEach(c=>{
    c.checked = PICKED.has(c.dataset.link);
    c.closest('.row').classList.toggle('picked', c.checked);
    c.addEventListener('change', e=>{
      const l = e.target.dataset.link;
      e.target.checked ? PICKED.add(l) : PICKED.delete(l);
      e.target.closest('.row').classList.toggle('picked', e.target.checked);
      syncDock();
    });
  });
}

function esc(s){
  return (s||'').replace(/[&<>"]/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function syncDock(){
  $('pickN').textContent = PICKED.size;
  $('dock').classList.toggle('on', PICKED.size > 0);
}

$('copy').addEventListener('click', ()=>{
  const sel = RECORDS.filter(r=>PICKED.has(r.link));
  const txt = sel.map(r=>{
    const l = [`■ ${r.title}`];
    if (r.prices?.length)    l.push(`  가격: ${r.prices.join(', ')}`);
    if (r.discounts?.length) l.push(`  할인: ${r.discounts.join(', ')}`);
    if (r.coupon)            l.push(`  코드: ${r.coupon}`);
    l.push(`  ${r.desc}`);
    l.push(`  ${r.link}`);
    (r.urls||[]).forEach(u=>l.push(`  ${u}`));
    return l.join('\n');
  }).join('\n\n');

  navigator.clipboard.writeText(txt)
    .then(()=>toast(`${sel.length}개 복사됨`))
    .catch(()=>{
      const ta=document.createElement('textarea');
      ta.value=txt; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove(); toast(`${sel.length}개 복사됨`);
    });
});

$('clear').addEventListener('click', ()=>{ PICKED.clear(); render(); syncDock(); });
$('date').addEventListener('change', e=>loadDate(e.target.value));
$('q').addEventListener('input', render);
$('reload').addEventListener('click', ()=>loadDate($('date').value));

['cafe','min'].forEach(id=>{
  $(id).addEventListener('click', e=>{
    if (e.target.tagName !== 'BUTTON') return;
    $(id).querySelectorAll('button').forEach(b=>b.classList.remove('on'));
    e.target.classList.add('on');
    render();
  });
});

boot();
</script>
</body>
</html>
