<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>운영 지도</title>
<script>/* 관리자 인증 가드 — index.html과 같은 키 */ if (sessionStorage.getItem("kydz_admin_authed") !== "1") location.replace("index.html");</script>
<style>
:root{--bg:#f6f7f5;--panel:#fff;--line:#dfe3dc;--ink:#1d221d;--muted:#6b736b;--accent:#2f6f3e;--warn:#a15c00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151815;--panel:#1d211d;--line:#333a33;--ink:#e8ece6;--muted:#9aa39a;--accent:#7fc28e;--warn:#f0b35a}}
:root[data-theme="dark"]{--bg:#151815;--panel:#1d211d;--line:#333a33;--ink:#e8ece6;--muted:#9aa39a;--accent:#7fc28e;--warn:#f0b35a}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:14px;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header a{color:var(--muted);text-decoration:none;font-size:13px}
h1{font-size:16px;margin:0}
.sub{color:var(--muted);font-size:12.5px}
#status{margin-left:auto;font-size:12.5px;color:var(--muted)}
#status.dirty{color:var(--warn);font-weight:600}
#status.ok{color:var(--accent)}
iframe{flex:1;width:100%;border:0;background:#fff}
.msg{margin:24px auto;max-width:560px;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;line-height:1.6}
</style>
</head>
<body>
<header>
  <a href="index.html">← 관리자</a>
  <div><h1>공대남자 운영 지도</h1>
    <div class="sub">박스를 끌어 옮기고, 더블클릭으로 글자를 고치고, 아래 탭으로 그림을 바꿔요. 다 고치면 오른쪽 위 <b>저장</b>.</div></div>
  <span id="status">불러오는 중...</span>
</header>
<div id="body" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
<script>
// draw.io(embed.diagrams.net)를 띄우고, 저장하면 camping-hub 저장소 docs/pipeline.drawio에 커밋 (사용자 결정 261030 — GUI로 직접 고치기)
const REPO = '/repos/kydxyz-git/camping-hub/contents/docs/pipeline.drawio';
const DRAWIO = 'https://embed.diagrams.net/?embed=1&proto=json&spin=1&lang=ko&ui=atlas&noExitBtn=1&saveAndExit=0&libraries=1&pages=1';
const statusEl = document.getElementById('status'), body = document.getElementById('body');
let sha = null, xml = '', dirty = false, frame = null;

const token = () => { try { return localStorage.getItem('kydz_admin_gh_token') || ''; } catch (e) { return ''; } };
const setStatus = (t, cls = '') => { statusEl.textContent = t; statusEl.className = cls; };
const b64dec = s => decodeURIComponent(escape(atob(s.replace(/\n/g, ''))));
const b64enc = s => btoa(unescape(encodeURIComponent(s)));
const gh = (method, body) => fetch('https://api.github.com' + REPO + (method === 'GET' ? '?ref=main&t=' + Date.now() : ''), {
  method, headers: { Authorization: 'Bearer ' + token(), Accept: 'application/vnd.github+json', ...(body ? { 'Content-Type': 'application/json' } : {}) },
  body: body ? JSON.stringify(body) : undefined });

async function load() {
  const r = await gh('GET');
  if (!r.ok) throw new Error('불러오기 실패 (' + r.status + ')');
  const j = await r.json();
  sha = j.sha; xml = b64dec(j.content);
}

async function save(newXml) {
  setStatus('저장 중...');
  let r = await gh('PUT', { message: 'update(admin): 운영 지도 수정', content: b64enc(newXml), sha, branch: 'main' });
  if (r.status === 409 || r.status === 422) {   // 다른 곳(다른 창·Claude)에서 먼저 바뀜
    const cur = await gh('GET').then(x => x.json());
    if (b64dec(cur.content) !== xml && !confirm('다른 곳에서 운영 지도가 바뀌었어요. 지금 화면 내용으로 덮어쓸까요?\n(취소하면 저장하지 않아요 — 새로고침하면 바뀐 내용을 볼 수 있어요)')) {
      setStatus('저장 안 함 — 새로고침해서 최신본을 받아 주세요', 'dirty'); return false;
    }
    sha = cur.sha;
    r = await gh('PUT', { message: 'update(admin): 운영 지도 수정', content: b64enc(newXml), sha, branch: 'main' });
  }
  if (!r.ok) { setStatus('저장 실패 (' + r.status + ') — 토큰 권한을 확인해 주세요', 'dirty'); return false; }
  sha = (await r.json()).content.sha; xml = newXml; dirty = false;
  setStatus('저장됨 ' + new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }), 'ok');
  return true;
}

function post(msg) { frame.contentWindow.postMessage(JSON.stringify(msg), '*'); }

window.addEventListener('message', async e => {
  if (!frame || e.source !== frame.contentWindow || typeof e.data !== 'string') return;
  let m; try { m = JSON.parse(e.data); } catch (_) { return; }
  if (m.event === 'init') { post({ action: 'load', xml, autosave: 1, title: '운영 지도' }); setStatus('불러옴'); }
  else if (m.event === 'autosave') { dirty = true; setStatus('저장 안 된 변경 있음', 'dirty'); }   // 변경 표시만 (저장은 저장 버튼으로)
  else if (m.event === 'save') {
    const ok = await save(m.xml);
    post({ action: 'status', message: ok ? '저장됨' : '저장 실패', modified: !ok });
  }
});
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

(async () => {
  if (!token()) {
    body.innerHTML = '<div class="msg">GitHub 토큰이 이 브라우저에 없어요. <a href="index.html">관리자 대시보드</a>에서 토큰을 먼저 넣어 주세요. (저장할 때 저장소에 커밋하려면 토큰이 필요해요)</div>';
    setStatus(''); return;
  }
  try { await load(); } catch (err) {
    body.innerHTML = '<div class="msg">운영 지도를 못 불러왔어요: ' + String(err.message).replace(/</g, '&lt;') + '</div>';
    setStatus(''); return;
  }
  frame = document.createElement('iframe');
  frame.title = '운영 지도 편집기 (draw.io)';
  frame.src = DRAWIO;
  body.appendChild(frame);
})();
</script>
</body>
</html>
