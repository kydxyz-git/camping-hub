<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>공대남자 캠핑사이트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* 밤 캠핑장 한 장면: 위는 캔버스(아이소메트릭 캠핑장), 아래(PC는 오른쪽)는 지금 · 예약된 작업 · 기록 */
:root {
  color-scheme: dark;
  --night: #0f1a1f;      /* 밤하늘·바탕 */
  --ground: #16262b;     /* 패널 */
  --line: #24393f;
  --ink: #e9e4d6;        /* 본문 (달빛 종이색) */
  --muted: #8fa3a4;
  --ember: #ff8a3d;      /* 모닥불 — 강조 */
  --moss: #7fb069;       /* 정상·완료 */
  --display: "Gowun Batang", "Nanum Myeongjo", serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--night); color: var(--ink); font: 14px/1.55 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 14px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font: 700 clamp(22px, 4vw, 30px)/1.2 var(--display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h1 small { display: block; font: 400 13px var(--body); color: var(--muted); margin-top: 4px; letter-spacing: 0; }
@media (min-width: 700px) { h1 small { display: inline; margin: 0 0 0 8px; } }
.status { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.live { background: var(--moss); box-shadow: 0 0 10px var(--moss); }
.dot.demo { background: var(--ember); box-shadow: 0 0 10px var(--ember); }
.main { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1000px) { .main { grid-template-columns: minmax(0, 1fr) 330px; } }
.stage { position: relative; border-radius: 14px; overflow: hidden; background: #0b1418; border: 1px solid var(--line); aspect-ratio: 3 / 4.4; max-width: 100%; }
@media (min-width: 700px) { .stage { aspect-ratio: 16 / 12; } }
@media (min-width: 1000px) { .stage { aspect-ratio: 16 / 10; } }
canvas { display: block; width: 100%; height: 100%; }
.side { display: grid; gap: 12px; align-content: start; min-width: 0; }
.panel { background: var(--ground); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.panel h2 { font: 600 11px var(--body); letter-spacing: 0.08em; color: var(--muted); margin: 0 0 8px; }
.rows { display: grid; gap: 6px; }
.row { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 8px; align-items: start; }
.row .sw { width: 10px; height: 10px; border-radius: 3px; margin-top: 5px; }
.row b { font-weight: 600; }
.row .t { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.row .task { color: var(--ink); font-size: 12px; opacity: 0.85; overflow-wrap: anywhere; }
.row .when { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.row.soon .when { color: var(--ember); }
.row { cursor: pointer; border-radius: 6px; }
.row:hover { background: rgba(255,255,255,0.03); }
.more { grid-column: 2 / -1; display: grid; gap: 2px; padding: 4px 0 6px; font-size: 12px; color: var(--muted); }
.more ol { margin: 0; padding-left: 16px; display: grid; gap: 1px; }
.more li span { color: var(--ink); }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; max-height: 220px; overflow-y: auto; font: 12px/1.45 var(--mono); }
.log li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; color: var(--muted); }
.log li span:last-child { color: var(--ink); overflow-wrap: anywhere; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; }
button { font: 600 12px var(--body); color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
button:hover { border-color: var(--ember); }
button:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
.note { font-size: 12px; color: var(--muted); margin: 0; }
.wood { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; margin-bottom: 6px; }
.bar { height: 10px; border-radius: 6px; background: #0f1a1f; border: 1px solid var(--line); overflow: hidden; }
.bar span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #8a5a3c, var(--ember)); transition: width .8s; }
.wood b { font: 600 13px var(--mono); font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { .dot { box-shadow: none; } }
/* 고정화면: 화면 가득 — 가로는 왼쪽 지도 + 오른쪽 내용, 세로는 위 지도 + 아래 내용 */
.hud { display: none; }
.fixed-only { display: none; }
body.fixed { height: 100%; overflow: hidden; padding-block: max(8px, env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-bottom, 0px)); }
body.fixed header, body.fixed .controls, body.fixed .note, body.fixed .side .legend-panel { display: none; }
body.fixed .fixed-only { display: block; }
body.fixed .wrap { max-width: none; height: 100%; display: block; }
body.fixed .main { height: 100%; gap: 8px; grid-template-columns: minmax(0, 1fr); grid-template-rows: 58% minmax(0, 1fr); }
@media (orientation: landscape) { body.fixed .main { grid-template-columns: minmax(0, 1fr) min(300px, 36vw); grid-template-rows: minmax(0, 1fr); } }
body.fixed .stage { aspect-ratio: auto; height: 100%; }
body.fixed .side { overflow-y: auto; gap: 6px; min-height: 0; }
body.fixed .panel { padding: 8px 10px; }
body.fixed .panel h2 { margin-bottom: 4px; }
body.fixed .log { max-height: none; }
body.fixed .row .t, body.fixed .log { font-size: 11px; }
#gate { position: fixed; inset: 0; z-index: 50; background: var(--night); display: grid; place-items: center; padding: 16px; }
#gate[hidden] { display: none; }
#gate form { display: grid; gap: 10px; width: min(320px, 100%); }
#gate input { font: 16px var(--body); color: var(--ink); background: var(--ground); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
#gate button { padding: 10px; font-size: 14px; }
#gate .err { color: var(--ember); font-size: 12px; min-height: 1em; margin: 0; }
</style>
</head>
<body>
<div id="gate" hidden>
  <form>
    <h1>공대남자 캠핑사이트</h1>
    <input type="password" autocomplete="current-password" placeholder="비밀번호 (admin과 같음)" aria-label="비밀번호" required>
    <button type="submit">들어가기</button>
    <p class="err" role="alert"></p>
  </form>
</div>
<div class="wrap">
  <header>
    <h1>공대남자 캠핑사이트 <small>공대남자가 지금 캠핑장에서 뭘 하고 있는지</small></h1>
    <span class="status"><span class="dot demo" id="dot"></span><span id="mode">데모 중 — 아직 연결 안 됨</span></span>
  </header>
  <div class="main">
    <div class="hud" id="hud" aria-live="polite"><div id="hud-now"></div><div class="mini"><span id="hud-wood"></span></div><div class="dim" id="hud-next"></div></div>
    <div class="stage"><canvas id="cv" aria-label="공대남자 캠핑장. 캐릭터가 하는 일에 따라 텐트·타프·화로대·바베큐 그릴·커피 테이블·캠핑카·캠핑의자로 옮겨 다님"></canvas></div>
    <aside class="side">
      <section class="panel">
        <h2 style="display:flex;justify-content:space-between;align-items:center">지금 <button type="button" class="fixed-only" id="unfix" style="padding:2px 8px;font-size:11px">고정화면 끄기</button></h2>
        <div class="rows" id="now"></div>
      </section>
      <section class="panel" id="woodpanel">
        <h2>남은 장작 (사용량)</h2>
        <div class="wood"><div class="bar"><span id="woodbar"></span></div><b id="woodpct">-</b></div>
        <p class="note" id="woodnote"></p>
      </section>
      <section class="panel">
        <h2>예약된 작업</h2>
        <div class="rows" id="jobs"></div>
      </section>
      <section class="panel">
        <h2>기록</h2>
        <ul class="log" id="log"></ul>
      </section>
      <div class="controls">
        <button type="button" id="pause">데모 멈추기</button>
        <button type="button" id="burst">동료 부르기</button>
        <button type="button" id="job">예약 작업 돌려보기</button>
        <button type="button" id="refill">장작 보충 보기</button>
        <button type="button" id="tod">시간대: 자동</button>
        <button type="button" id="fixed">고정화면</button>
      </div>
      <p class="note">고정화면: 지도와 내용을 화면 가득 보여주고 화면이 꺼지지 않게 해요. 휴대폰을 가로로 눕히면 자동으로 켜지고, 지도를 두 번 톡 치거나 '고정화면 끄기'로 나와요.</p>
      <p class="note" id="modenote">지금은 예시 작업을 돌려 보여주는 데모예요. 내 컴퓨터(PC·노트북)에서 camp-watch.js를 켜고 그 주소로 열면 실제 Claude Code 작업이 실시간으로 움직여요.</p>
    </aside>
  </div>
</div>
<script>
(() => {
const LIVE = window.CAMP_LIVE || '';   // camp-watch.js로 열면 내 컴퓨터 작업 연결
const DEMO_MODE = !LIVE && /[?&]demo\b/.test(location.search);   // ?demo=1: 예시 작업 데모
const GH_MODE = !LIVE && !DEMO_MODE;   // 기본: GitHub에 올라간 커밋·자동 작업
'use strict';
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W = 0, H = 0, DPR = 1, S = 1;           // S: 장면 배율
const TW = 64, TH = 32, N = 12;              // 가로 화면: 아이소 타일 크기, 격자 N×N
const TK = 4, TN = 13;                       // 세로 화면(폰): 같은 아이소 시점, |x-y|≤TK 인 세로로 긴 섬 (x+y ≤ 2·TN)

// ── 장소 (격자 좌표). ax/ay = 캐릭터가 서는 곳, say = 말풍선 ──
const ZONES = {
  dome:    { x: 2.6, y: 2.4, ax: 0.2, ay: 1.1, say: '파일 읽는 중…',       act: 'read' },
  tipi:    { x: 5.6, y: 1.6, ax: 0.1, ay: 1.0, say: '파일 고치는 중…',     act: 'hammer' },
  shelter: { x: 9.2, y: 2.6, ax: -1.1, ay: 1.0, say: '파일 찾는 중…',      act: 'torch' },
  coffee:  { x: 10.1, y: 5.6, ax: -0.1, ay: 0.8, say: '계획 세우는 중…',   act: 'pour' },
  tarp:    { x: 8.3, y: 7.4, ax: 0.2, ay: 0.55, say: '인터넷 찾아보는 중…', act: 'type' },
  fire:    { x: 5.6, y: 5.8, ax: 0.6, ay: 0.6, say: '명령 돌리는 중…',     act: 'poke' },
  bbq:     { x: 3.4, y: 7.3, ax: 0.1, ay: 0.75, say: '테스트 굽는 중…',     act: 'flip' },
  chair:   { x: 3.9, y: 4.6, ax: 0.0, ay: 0.05, say: '기다리는 중…',       act: 'sit' },
  van:     { x: 1.9, y: 9.3, ax: 1.0, ay: 0.8, say: '동료 부르는 중…',     act: 'wave' },
};
ZONES.wood = { x: 6.9, y: 4.7, ax: 0.6, ay: 0.5, say: '장작 쌓는 중…', act: 'carry' };
// 화면 모양마다 배치 — wide: 가로(아이소 마름모), tall: 세로(폰)
const LAYOUTS = {
  wide: {
    zones: { dome: [2.6, 2.4], tipi: [5.6, 1.6], shelter: [9.2, 2.6], coffee: [10.1, 5.6], tarp: [8.3, 7.4], fire: [5.6, 5.8], bbq: [3.4, 7.3], chair: [3.9, 4.6], van: [1.9, 9.3], wood: [6.9, 4.7] },
    trees: [[0.4, 0.6], [1.4, 0.3], [0.3, 2.2], [0.5, 4.4], [0.4, 6.4], [11.2, 0.5], [10.6, 0.9], [11.4, 3.4], [11.4, 7.4], [11.5, 9.6], [8.6, 11.2], [6.2, 11.4], [4.0, 11.3], [0.6, 11.0], [9.8, 10.6], [7.6, 0.4]],
    picnic: [6.6, 9.4], lake: [10.1, 10.2],
    path: (x, y) => (x === y && x > 2 && x < 10) || (y === 6 && x > 2 && x < 10) || (x === 5 && y > 2 && y < 9),
  },
  tall: {   // (u, v) = (x+y, x-y) 로 적고 격자 좌표로 바꿈 — u는 위→아래, v는 왼쪽→오른쪽
    zones: uv({ dome: [4.2, -2.2], tipi: [3.6, 2.4], shelter: [8.2, 0.6], chair: [11.2, -2.6], coffee: [10.8, 3.0], fire: [13.4, 0], wood: [13.6, 2.3],
      bbq: [16.8, -2.6], tarp: [19.0, 1.0], van: [23.6, -1.4] }),
    trees: uvList([[0.6, 0], [1.6, -1.6], [1.8, 1.8], [5.8, -3.8], [6.2, 3.8], [9.8, -3.9], [13.6, -3.9], [16.0, 3.8], [20.4, -3.8], [22.6, 3.7], [25.4, 0.6], [25.0, -2.6]]),
    picnic: uv1(21.8, 1.8), lake: uv1(24.8, 2.2),
    path: (x, y) => x === y && x > 0 && x < 12 || (x - y === 1 && x + y > 14 && x + y < 22),
  },
};
function uv1(u, v) { return [(u + v) / 2, (u - v) / 2]; }
function uv(o) { return Object.fromEntries(Object.entries(o).map(([k, [u, v]]) => [k, uv1(u, v)])); }
function uvList(a) { return a.map(([u, v]) => uv1(u, v)); }
const inMap = (x, y) => TALL ? Math.abs(x - y) <= TK && x + y <= 2 * TN && x >= 0 && y >= 0 : x >= 0 && y >= 0 && x < N && y < N;
let TALL = false, L = LAYOUTS.wide;
function applyLayout() {
  L = TALL ? LAYOUTS.tall : LAYOUTS.wide;
  for (const [k, [x, y]] of Object.entries(L.zones)) { ZONES[k].x = x; ZONES[k].y = y; }
  if (typeof WOODPILE !== 'undefined') { WOODPILE.x = L.zones.wood[0]; WOODPILE.y = L.zones.wood[1]; }
  TREES = L.trees.map(([x, y], i) => ({ x, y, h: 0.8 + ((i * 37) % 10) / 20 }));
  // 이미 있는 캐릭터는 지금 장소로 바로 옮김
  if (typeof agents !== 'undefined') for (const a of agents.values()) { const z = ZONES[a.zone] || ZONES.chair; a.x = a.tx = z.x + z.ax; a.y = a.ty = z.y + z.ay; }
}
const dep = (x, y) => x + y;   // 그리는 순서 (뒤 → 앞)
const PLAN_TOOLS = /^(TodoWrite|TaskCreate|TaskUpdate|TaskList|EnterPlanMode|ExitPlanMode)$/;
function zoneOf(ev) {
  const t = ev.tool || '';
  if (ev.kind === 'idle') return 'chair';
  if (ev.kind === 'think' || PLAN_TOOLS.test(t)) return 'coffee';
  if (/^(Read|NotebookRead|LS)$/.test(t)) return 'dome';
  if (/^(Edit|Write|MultiEdit|NotebookEdit)$/.test(t)) return 'tipi';
  if (/^(Glob|Grep)$/.test(t)) return 'shelter';
  if (/^(WebSearch|WebFetch|ToolSearch)$/.test(t) || /^mcp__/.test(t)) return 'tarp';
  if (/^(Agent|Task)$/.test(t)) return 'van';
  if (/^(Bash|BashOutput)$/.test(t)) return /test|check|build|lint|pytest|jest|vitest|npm run|py_compile/.test(ev.text || '') ? 'bbq' : 'fire';
  return 'chair';
}

// ── 예약된 작업 (한국 시간) ──
const JOBS = [
  { name: '스레드 글 올리기', desc: '쿠파스 대기열에서 다음 글을 스레드에 올려요 (07·12·22시)', at: { hours: [7, 12, 22], min: 5 },  zone: 'tipi',    say: '스레드 글 올리는 중…' },
  { name: '쿠팡 특가 찾기', desc: '쿠팡 골드박스·생필품을 골라 특가 글을 만들어요',   at: { hours: [6], min: 10 },         zone: 'tarp',    say: '쿠팡 특가 찾는 중…' },
  { name: '특가 글 올리기', desc: '오늘 특가 글을 사진·링크 댓글과 함께 올려요',   at: { hours: [10], min: 5 },         zone: 'tipi',    say: '특가 글 올리는 중…' },
  { name: '댓글 확인', desc: '새 댓글을 모아 답글 초안을 만들어요',        at: { every: 60, min: 35 },          zone: 'coffee',  say: '댓글 읽는 중…' },
  { name: '방문 통계 정리', desc: '홈페이지 방문 기록을 모아 통계 파일에 저장해요',   at: { every: 60, min: 0 },           zone: 'shelter', say: '통계 정리하는 중…' },
  { name: '쿠팡 링크 점검', desc: '홈페이지 쿠팡 링크 52개를 따라가 확인해요 (매주 월)',   at: { hours: [9], min: 10, wd: 1 },  zone: 'dome',    say: '링크 점검하는 중…' },
  { name: '스레드 토큰 갱신', desc: '스레드 접속 토큰을 새로 받아 두어요 (매주 화)', at: { hours: [3], min: 17, wd: 2 },  zone: 'fire',    say: '토큰 갈아끼우는 중…' },
];
const KST = 9 * 3600e3;
function nextRun(job, now) {
  // 한국 시간 기준 다음 실행 시각 (분 단위로 앞으로 훑기 — 하루 1,440번이면 충분)
  const k = new Date(Math.ceil((now + KST) / 60e3) * 60e3);
  for (let i = 0; i < 8 * 1440; i++) {
    const d = new Date(k.getTime() + i * 60e3), h = d.getUTCHours(), m = d.getUTCMinutes(), wd = d.getUTCDay();
    const a = job.at;
    if (m !== a.min) continue;
    if (a.wd != null && wd !== a.wd) continue;
    if (a.every || a.hours.includes(h)) return d.getTime() - KST;
  }
  return null;
}
function untilText(ms) {
  const m = Math.round(ms / 60e3);
  if (m < 1) return '곧';
  if (m < 60) return `${m}분 뒤`;
  const h = Math.floor(m / 60);
  return h < 24 ? `${h}시간 ${m % 60}분 뒤` : `${Math.floor(h / 24)}일 뒤`;
}

// ── 아이소 변환 ──
function iso(x, y) { return { x: (x - y) * TW / 2, y: (x + y) * TH / 2 }; }
function toScreen(x, y) {
  const p = iso(x, y);
  if (TALL) return { x: W / 2 + p.x * S, y: H - ((2 * TN + 2) * TH / 2 + 14) * S + p.y * S };   // 땅은 아래에 붙이고 남는 위쪽은 하늘
  return { x: W / 2 + p.x * S, y: H * 0.54 - (N * TH / 2) * S + p.y * S };
}
function resize() {

document.getElementById('pause').onclick = e => { demoOn = !demoOn; e.currentTarget.textContent = demoOn ? '데모 멈추기' : '데모 다시 보기'; };
document.getElementById('burst').onclick = spawn;
document.getElementById('job').onclick = () => runJob(JOBS[Math.floor(Math.random() * JOBS.length)]);
document.getElementById('refill').onclick = refill;
const TODS = [null, 'dawn', 'day', 'sunset', 'night'];
document.getElementById('tod').onclick = e => { todForce = TODS[(TODS.indexOf(todForce) + 1) % TODS.length]; e.currentTarget.textContent = '시간대: ' + (todForce ? MOODS[todForce].name : '자동'); };

// ── 실제 작업 연결: 내 컴퓨터의 camp-watch.js가 Claude Code 기록을 보내 줌 (PC·노트북 합쳐서) ──
function startLive() {
  ['pause', 'burst', 'refill', 'job'].forEach(id => document.getElementById(id).hidden = true);
  document.getElementById('modenote').textContent = '내 컴퓨터의 Claude Code 작업을 실시간으로 보여줘요. 컴퓨터 안에서만 오가고 토큰은 쓰지 않아요. 클라우드(웹) 세션은 안 보여요.';
  const dot = document.getElementById('dot'), mode = document.getElementById('mode');
  const ids = new Map();   // 컴퓨터별 공대남자: 처음 연결된 컴퓨터가 'main'
  let machines = [];
  const label = m => machines.length > 1 && m ? `공대남자·${m}` : '공대남자';
  function charId(ev) {
    if (ev.side) return ev.agent;
    const m = ev.machine || '';
    if (!ids.has(m)) ids.set(m, ids.size ? 'pc:' + m : 'main');
    return ids.get(m);
  }
  function rename() {
    for (const [m, id] of ids) { const a = agents.get(id); if (a) a.name = label(m); }
    renderNow();
  }
  const es = new EventSource(LIVE);
  es.onopen = () => { dot.className = 'dot live'; };
  es.onerror = () => { dot.className = 'dot'; mode.textContent = '연결 끊김 — 다시 연결 중…'; };
  es.onmessage = e => {
    let ev; try { ev = JSON.parse(e.data); } catch (er) { return; }
    if (ev.type === 'hello') {
      machines = ev.machines || [];
      dot.className = 'dot live'; mode.textContent = '연결됨 — ' + (machines.length > 1 ? machines.join('·') : '내 컴퓨터');
      rename(); return;
    }
    if (ev.type === 'wood') {
      const up = wood.live && ev.level != null && wood.live.level != null && ev.level - wood.live.level > 0.3;
      wood.live = ev;
      if (up || (ev.level != null && wood.level < 0.05 && ev.level > 0.5)) refill();   // 5시간 지나 초기화 → 장작 나르기
      else if (!refilling) { if (ev.level != null) wood.level = ev.level; wood.resetAt = ev.resetAt; }
      renderWood(); return;
    }
    if (!ev.kind) return;
    const id = charId(ev);
    const name = ev.side ? '동료' : label(ev.machine);
    if (id !== ev.agent && ev.kind === 'idle') { const a = agents.get(id); if (a && a.zone === 'chair') return; }
    handle({ ...ev, agent: id, name });
    const a = agents.get(id); if (a) a.name = name;
  };
}

// ── GitHub 연결: 올라간 커밋은 공대남자가, 자동 작업(Actions)은 예약봇이 ──
// 홈페이지 저장소는 공개라 토큰 없이도 보임. 쿠파스(비공개)는 admin 스레드 관리에서 넣은 토큰이 있을 때만.
const GH_REPOS = [{ repo: 'kydxyz-git/camping-hub', key: 'kydz_admin_gh_token', label: '홈페이지' },
  { repo: 'kydxyz-git/cupas', key: 'kydz_cupas_gh_token', label: '쿠파스', needToken: true }];
const WF = {   // 워크플로 → [이름, 장소, 말풍선]
  'build-pages': ['검색용 페이지 만들기', 'shelter', '페이지 만드는 중…'], 'pages-build-deployment': ['홈페이지 배포', 'fire', '홈페이지 올리는 중…'],
  'link-check': ['쿠팡 링크 점검', 'dome', '링크 점검하는 중…'], check: ['쿠파스 점검', 'bbq', '점검하는 중…'],
  'coupang-search': ['쿠팡에서 찾기', 'tarp', '쿠팡 찾아보는 중…'], deals: ['쿠팡 특가', 'tarp', '쿠팡 특가 찾는 중…'],
  post: ['스레드 글 올리기', 'tipi', '스레드 글 올리는 중…'], 'refresh-token': ['스레드 토큰 갱신', 'fire', '토큰 갈아끼우는 중…'],
  replies: ['댓글 확인', 'coffee', '댓글 읽는 중…'],
};
function commitPlace(msg) {
  const m = msg.match(/^(\w+)(?:\(([^)]*)\))?:/) || [], type = m[1] || '';
  if (type === 'docs') return ['coffee', '정리해 적는 중…'];
  if (type === 'test') return ['bbq', '테스트 굽는 중…'];
  if (type === 'delete') return ['fire', '치우는 중…'];
  if (type === 'feat') return ['tipi', '새로 만드는 중…'];
  if (type === 'fix') return ['tipi', '고치는 중…'];
  if (type === 'sync' || type === 'update') return ['tipi', '내용 고치는 중…'];
  return ['shelter', '정리하는 중…'];
}
const isBotCommit = c => /bot\]?$|^kydz-build$/.test(c.commit.author.name || '') || /^chore\((stats|build|insights|replies)\)|^(post|replies):/.test(c.commit.message);
function startGitHub() {
  ['pause', 'burst', 'refill', 'job'].forEach(id => document.getElementById(id).hidden = true);
  document.getElementById('woodpanel').hidden = true;   // 사용량은 GitHub에 없음 (내 컴퓨터 연결에서만)
  wood.level = wood.shown = 1;
  const dot = document.getElementById('dot'), mode = document.getElementById('mode'), note = document.getElementById('modenote');
  const tok = r => { try { return localStorage.getItem(r.key) || ''; } catch (e) { return ''; } };
  const repos = () => GH_REPOS.filter(r => !r.needToken || tok(r));
  const every = () => repos().some(r => tok(r)) ? 60e3 : 150e3;   // 토큰 없으면 시간당 60번 제한이라 느리게
  note.textContent = `GitHub에 올라간 커밋은 공대남자가, 자동 작업(스레드 게시·특가·링크 점검 등)은 예약봇이 움직여요. ${every() / 60e3 >= 2 ? '2분 반' : '1분'}마다 확인.` +
    (repos().length < GH_REPOS.length ? ' 쿠파스는 admin 스레드 관리에서 토큰을 넣은 브라우저에서만 보여요.' : '');
  const gh = async (r, path) => {
    const t = tok(r), res = await fetch(`https://api.github.com/repos/${r.repo}/${path}`, { cache: 'no-store',
      headers: { Accept: 'application/vnd.github+json', ...(t ? { Authorization: 'Bearer ' + t } : {}) } });
    if (!res.ok) throw new Error(res.status === 403 || res.status === 429 ? '확인 횟수 제한' : '응답 ' + res.status);
    return res.json();
  };
  const seen = new Set(), runs = new Map(); let first = true, queue = [], idleTimer = 0;
  const main = agent('main');
  function play() {   // 새 커밋을 3.5초 간격으로 하나씩
    const c = queue.shift(); if (!c) return;
    const [zone, say] = commitPlace(c.msg);
    handle({ agent: 'main', kind: 'tool', text: `${c.label}에 올림`, say, task: c.msg }); goTo(main, zone, say, `${c.label}에 올림`);
    clearTimeout(idleTimer); idleTimer = setTimeout(() => handle({ agent: 'main', kind: 'idle', text: '쉬는 중' }), 10 * 60e3);
    if (queue.length) setTimeout(play, 3500);
  }
  function botStart(id, w, run) {
    handle({ agent: id, name: '예약봇', color: '#c9c3b3', kind: 'tool', text: w[0], say: w[2] });
    const a = agents.get(id); if (a) { goTo(a, w[1], w[2], w[0]); a.task = run.event === 'schedule' ? '예약 실행' : '직접 실행'; }
  }
  const botEnd = (id, w, run) => handle({ agent: id, name: '예약봇', kind: 'done', text: `${w[0]} ${run.conclusion === 'success' ? '끝' : run.conclusion === 'cancelled' ? '취소됨' : '실패 ⚠'}` });
  async function poll() {
    if (document.hidden && !first) return;
    const got = [], got2 = [], past = [];   // past: 처음 열 때 기록에 깔아 둘 지난 일
    try {
      for (const r of repos()) {
        const [cs, rs] = await Promise.all([gh(r, 'commits?per_page=10'), gh(r, 'actions/runs?per_page=10')]);
        cs.forEach(c => got.push({ c, r })); (rs.workflow_runs || []).forEach(run => got2.push({ run, r }));
      }
      dot.className = 'dot live'; mode.textContent = 'GitHub 연결됨 — ' + repos().map(r => r.label).join('·');
    } catch (e) { dot.className = 'dot'; mode.textContent = `GitHub 확인 실패 (${e.message}) — 잠시 뒤 다시`; return; }
    // 커밋: 오래된 것부터
    got.sort((a, b) => Date.parse(a.c.commit.author.date) - Date.parse(b.c.commit.author.date));
    for (const { c, r } of got) {
      if (seen.has(c.sha)) continue; seen.add(c.sha);
      const msg = c.commit.message.split('\n')[0].slice(0, 80), at = Date.parse(c.commit.author.date), bot = isBotCommit(c);
      if (first) { past.push({ at, who: bot ? '예약봇' : '공대남자', text: `${r.label}: ${msg}` }); continue; }
      if (bot) { log('예약봇', `${r.label}: ${msg}`, at); continue; }
      queue.push({ msg, label: r.label });
    }
    if (first) {   // 마지막 커밋이 20분 안이면 그 일 하는 중으로
      const last = got.filter(x => !isBotCommit(x.c)).pop();
      if (last && Date.now() - Date.parse(last.c.commit.author.date) < 20 * 60e3) queue.push({ msg: last.c.commit.message.split('\n')[0].slice(0, 80), label: last.r.label });
      else handle({ agent: 'main', kind: 'idle', text: last ? `쉬는 중 (마지막: ${last.r.label} ${untilText(Date.now() - Date.parse(last.c.commit.author.date)).replace(/ 뒤$/, '')} 전)` : '쉬는 중' });
    }
    if (queue.length) play();
    // 자동 작업
    got2.sort((a, b) => Date.parse(a.run.created_at) - Date.parse(b.run.created_at));
    for (const { run } of got2) {
      const w = WF[run.path ? run.path.split('/').pop().replace(/\.ya?ml$/, '') : run.name] || WF[run.name] || [run.name, 'fire', '자동 작업 중…'];
      const id = 'run:' + run.id, was = runs.get(run.id), active = run.status !== 'completed';
      runs.set(run.id, run.status);
      if (active && !was) botStart(id, w, run);
      else if (!active && was && was !== 'completed') botEnd(id, w, run);
      else if (!active && !was && !first && Date.parse(run.updated_at) > Date.now() - 5 * 60e3) { botStart(id, w, run); setTimeout(() => botEnd(id, w, run), 6000); }   // 확인 사이에 끝난 것
      else if (!active && !was && first && w !== WF['pages-build-deployment']) past.push({ at: Date.parse(run.updated_at), who: '예약봇', text: `${w[0]} ${run.conclusion === 'success' ? '끝' : '실패 ⚠'}` });
    }
    past.sort((a, b) => a.at - b.at).slice(-30).forEach(x => log(x.who, x.text, x.at));
    first = false;
  }
  const loop = async () => { await poll(); setTimeout(loop, every()); };
  loop();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
}

// ── 비밀번호: admin과 같은 비밀번호. 한 번 들어가면 이 브라우저에선 계속 (비밀번호를 바꾸면 다시 물어봄) ──
// 바꿀 때: kydzm/index.html의 PASSWORD_HASH와 같이 바꾼다
const PASSWORD_HASH = 'fc0d164e3259b5a28b9b7ac489e95e1638ba1bc37a27c2bb07ac7bdb624f1347', AUTH_KEY = 'kydz_camp_authed';
async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
function gate(start) {
  // 내 컴퓨터 연결(camp-watch)은 집 와이파이 안에서만 열리고, http라 암호 계산도 안 돼서 묻지 않음
  let ok = !!LIVE; try { ok = ok || localStorage.getItem(AUTH_KEY) === PASSWORD_HASH; } catch (e) {}
  if (ok) return start();
  const g = document.getElementById('gate'), f = g.querySelector('form'), inp = f.querySelector('input'), err = f.querySelector('.err');
  g.hidden = false; inp.focus();
  f.onsubmit = async e => {
    e.preventDefault();
    if (await sha256(inp.value) !== PASSWORD_HASH) { err.textContent = '비밀번호가 달라요'; inp.select(); return; }
    try { localStorage.setItem(AUTH_KEY, PASSWORD_HASH); } catch (er) {}
    g.hidden = true; start();
  };
}

// ── 고정화면 ──
let wakeLock = null;
async function keepAwake() { try { if ('wakeLock' in navigator && document.visibilityState === 'visible') wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { /* 허용 안 되면 그냥 둠 */ } }
function setFixed(on, fromUser) {
  document.body.classList.toggle('fixed', on);
  if (on) { keepAwake(); if (fromUser && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {}); }
  else { try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); }
  // 직접 켜고 끈 것만 기억 (휴대폰을 눕혀서 자동으로 켜진 건 세우면 다시 꺼짐)
  if (fromUser || !on) try { localStorage.setItem('kydz_camp_fixed', on ? '1' : ''); } catch (e) {}
  requestAnimationFrame(resize);
}
document.getElementById('fixed').onclick = () => setFixed(true, true);
document.getElementById('unfix').onclick = () => setFixed(false);
cv.addEventListener('click', e => {
  const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  let best = null, bd = 30 * Math.max(1, S);
  for (const a of agents.values()) { const p = toScreen(a.x, a.y), d = Math.hypot(p.x - mx, p.y - 18 * S - my); if (d < bd) { bd = d; best = a; } }
  if (best) { openRows.add(best.id); renderNow(); nowEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
});
let lastTap = 0;
cv.addEventListener('pointerup', () => { const n = Date.now(); if (n - lastTap < 350 && document.body.classList.contains('fixed')) setFixed(false); lastTap = n; });
document.addEventListener('visibilitychange', () => { if (document.body.classList.contains('fixed')) keepAwake(); });
const phoneLandscape = matchMedia('(orientation: landscape) and (max-height: 520px)');
phoneLandscape.addEventListener('change', e => setFixed(e.matches || (() => { try { return localStorage.getItem('kydz_camp_fixed') === '1'; } catch (er) { return false; } })()));
let wasFixed = false; try { wasFixed = localStorage.getItem('kydz_camp_fixed') === '1'; } catch (e) {}
if (phoneLandscape.matches || wasFixed || location.hash === '#fixed') setFixed(true);

resize(); agent('main'); renderNow(); renderJobs(); renderWood();
setInterval(() => { renderWood(); if (DEMO_MODE && Date.now() >= wood.resetAt) refill(); }, 30000);
handle({ agent: 'main', kind: 'idle', text: '캠핑장 도착' });
gate(() => { if (LIVE) startLive(); else if (GH_MODE) startGitHub(); else setInterval(demoTick, 3400); });
requestAnimationFrame(frame);
})();
</script>
