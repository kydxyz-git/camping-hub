<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>공대남자 캠핑사이트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* 밤 캠핑장 한 장면: 위는 캔버스(아이소메트릭 캠핑장), 아래(PC는 오른쪽)는 지금 · 예약된 작업 · 기록 */
:root {
  color-scheme: dark;
  --night: #0f1a1f;      /* 밤하늘·바탕 */
  --ground: #16262b;     /* 패널 */
  --line: #24393f;
  --ink: #e9e4d6;        /* 본문 (달빛 종이색) */
  --muted: #8fa3a4;
  --ember: #ff8a3d;      /* 모닥불 — 강조 */
  --moss: #7fb069;       /* 정상·완료 */
  --display: "Gowun Batang", "Nanum Myeongjo", serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--night); color: var(--ink); font: 14px/1.55 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 14px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font: 700 clamp(22px, 4vw, 30px)/1.2 var(--display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h1 small { display: block; font: 400 13px var(--body); color: var(--muted); margin-top: 4px; letter-spacing: 0; }
@media (min-width: 700px) { h1 small { display: inline; margin: 0 0 0 8px; } }
.status { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.live { background: var(--moss); box-shadow: 0 0 10px var(--moss); }
.dot.demo { background: var(--ember); box-shadow: 0 0 10px var(--ember); }
.main { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1000px) { .main { grid-template-columns: minmax(0, 1fr) 330px; } }
.stage { position: relative; border-radius: 14px; overflow: hidden; background: #0b1418; border: 1px solid var(--line); aspect-ratio: 3 / 4.4; max-width: 100%; }
@media (min-width: 700px) { .stage { aspect-ratio: 16 / 12; } }
@media (min-width: 1000px) { .stage { aspect-ratio: 16 / 10; } }
canvas { display: block; width: 100%; height: 100%; }
.side { display: grid; gap: 12px; align-content: start; min-width: 0; }
.panel { background: var(--ground); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.panel h2 { font: 600 11px var(--body); letter-spacing: 0.08em; color: var(--muted); margin: 0 0 8px; }
.rows { display: grid; gap: 6px; }
.row { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 8px; align-items: start; }
.row .sw { width: 10px; height: 10px; border-radius: 3px; margin-top: 5px; }
.row b { font-weight: 600; }
.row .t { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.row .when { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.row.soon .when { color: var(--ember); }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; max-height: 220px; overflow-y: auto; font: 12px/1.45 var(--mono); }
.log li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; color: var(--muted); }
.log li span:last-child { color: var(--ink); overflow-wrap: anywhere; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; }
button { font: 600 12px var(--body); color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
button:hover { border-color: var(--ember); }
button:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
.note { font-size: 12px; color: var(--muted); margin: 0; }
.wood { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; margin-bottom: 6px; }
.bar { height: 10px; border-radius: 6px; background: #0f1a1f; border: 1px solid var(--line); overflow: hidden; }
.bar span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #8a5a3c, var(--ember)); transition: width .8s; }
.wood b { font: 600 13px var(--mono); font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { .dot { box-shadow: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>공대남자 캠핑사이트 <small>공대남자가 지금 캠핑장에서 뭘 하고 있는지</small></h1>
    <span class="status"><span class="dot demo" id="dot"></span><span id="mode">데모 중 — 아직 연결 안 됨</span></span>
  </header>
  <div class="main">
    <div class="stage"><canvas id="cv" aria-label="공대남자 캠핑장. 캐릭터가 하는 일에 따라 텐트·타프·화로대·바베큐 그릴·커피 테이블·캠핑카·캠핑의자로 옮겨 다님"></canvas></div>
    <aside class="side">
      <section class="panel">
        <h2>지금</h2>
        <div class="rows" id="now"></div>
      </section>
      <section class="panel">
        <h2>남은 장작 (사용량)</h2>
        <div class="wood"><div class="bar"><span id="woodbar"></span></div><b id="woodpct">-</b></div>
        <p class="note" id="woodnote"></p>
      </section>
      <section class="panel">
        <h2>예약된 작업</h2>
        <div class="rows" id="jobs"></div>
      </section>
      <section class="panel">
        <h2>기록</h2>
        <ul class="log" id="log"></ul>
      </section>
      <div class="controls">
        <button type="button" id="pause">데모 멈추기</button>
        <button type="button" id="burst">동료 부르기</button>
        <button type="button" id="job">예약 작업 돌려보기</button>
        <button type="button" id="refill">장작 보충 보기</button>
        <button type="button" id="tod">시간대: 자동</button>
      </div>
      <p class="note">지금은 예시 작업을 돌려 보여주는 데모예요. 연결하면 공대남자의 실제 Claude Code 작업과 예약된 작업이 실시간으로 움직여요.</p>
    </aside>
  </div>
</div>
<script>
(() => {
'use strict';
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W = 0, H = 0, DPR = 1, S = 1;           // S: 장면 배율
const TW = 64, TH = 32, N = 12;              // 가로 화면: 아이소 타일 크기, 격자 N×N
const TK = 4, TN = 13;                       // 세로 화면(폰): 같은 아이소 시점, |x-y|≤TK 인 세로로 긴 섬 (x+y ≤ 2·TN)

// ── 장소 (격자 좌표). ax/ay = 캐릭터가 서는 곳, say = 말풍선 ──
const ZONES = {
  dome:    { x: 2.6, y: 2.4, ax: 0.2, ay: 1.1, say: '파일 읽는 중…',       act: 'read' },
  tipi:    { x: 5.6, y: 1.6, ax: 0.1, ay: 1.0, say: '파일 고치는 중…',     act: 'hammer' },
  shelter: { x: 9.2, y: 2.6, ax: -1.1, ay: 1.0, say: '파일 찾는 중…',      act: 'torch' },
  coffee:  { x: 10.1, y: 5.6, ax: -0.1, ay: 0.8, say: '계획 세우는 중…',   act: 'pour' },
  tarp:    { x: 8.3, y: 7.4, ax: 0.2, ay: 0.55, say: '인터넷 찾아보는 중…', act: 'type' },
  fire:    { x: 5.6, y: 5.8, ax: 0.6, ay: 0.6, say: '명령 돌리는 중…',     act: 'poke' },
  bbq:     { x: 3.4, y: 7.3, ax: 0.1, ay: 0.75, say: '테스트 굽는 중…',     act: 'flip' },
  chair:   { x: 3.9, y: 4.6, ax: 0.0, ay: 0.05, say: '기다리는 중…',       act: 'sit' },
  van:     { x: 1.9, y: 9.3, ax: 1.0, ay: 0.8, say: '동료 부르는 중…',     act: 'wave' },
};
ZONES.wood = { x: 6.9, y: 4.7, ax: 0.6, ay: 0.5, say: '장작 쌓는 중…', act: 'carry' };
// 화면 모양마다 배치 — wide: 가로(아이소 마름모), tall: 세로(폰)
const LAYOUTS = {
  wide: {
    zones: { dome: [2.6, 2.4], tipi: [5.6, 1.6], shelter: [9.2, 2.6], coffee: [10.1, 5.6], tarp: [8.3, 7.4], fire: [5.6, 5.8], bbq: [3.4, 7.3], chair: [3.9, 4.6], van: [1.9, 9.3], wood: [6.9, 4.7] },
    trees: [[0.4, 0.6], [1.4, 0.3], [0.3, 2.2], [0.5, 4.4], [0.4, 6.4], [11.2, 0.5], [10.6, 0.9], [11.4, 3.4], [11.4, 7.4], [11.5, 9.6], [8.6, 11.2], [6.2, 11.4], [4.0, 11.3], [0.6, 11.0], [9.8, 10.6], [7.6, 0.4]],
    picnic: [6.6, 9.4], lake: [10.1, 10.2],
    path: (x, y) => (x === y && x > 2 && x < 10) || (y === 6 && x > 2 && x < 10) || (x === 5 && y > 2 && y < 9),
  },
  tall: {   // (u, v) = (x+y, x-y) 로 적고 격자 좌표로 바꿈 — u는 위→아래, v는 왼쪽→오른쪽
    zones: uv({ dome: [4.2, -2.2], tipi: [3.6, 2.4], shelter: [8.2, 0.6], chair: [11.2, -2.6], coffee: [10.8, 3.0], fire: [13.4, 0], wood: [13.6, 2.3],
      bbq: [16.8, -2.6], tarp: [19.0, 1.0], van: [23.6, -1.4] }),
    trees: uvList([[0.6, 0], [1.6, -1.6], [1.8, 1.8], [5.8, -3.8], [6.2, 3.8], [9.8, -3.9], [13.6, -3.9], [16.0, 3.8], [20.4, -3.8], [22.6, 3.7], [25.4, 0.6], [25.0, -2.6]]),
    picnic: uv1(21.8, 1.8), lake: uv1(24.8, 2.2),
    path: (x, y) => x === y && x > 0 && x < 12 || (x - y === 1 && x + y > 14 && x + y < 22),
  },
};
function uv1(u, v) { return [(u + v) / 2, (u - v) / 2]; }
function uv(o) { return Object.fromEntries(Object.entries(o).map(([k, [u, v]]) => [k, uv1(u, v)])); }
function uvList(a) { return a.map(([u, v]) => uv1(u, v)); }
const inMap = (x, y) => TALL ? Math.abs(x - y) <= TK && x + y <= 2 * TN && x >= 0 && y >= 0 : x >= 0 && y >= 0 && x < N && y < N;
let TALL = false, L = LAYOUTS.wide;
function applyLayout() {
  L = TALL ? LAYOUTS.tall : LAYOUTS.wide;
  for (const [k, [x, y]] of Object.entries(L.zones)) { ZONES[k].x = x; ZONES[k].y = y; }
  if (typeof WOODPILE !== 'undefined') { WOODPILE.x = L.zones.wood[0]; WOODPILE.y = L.zones.wood[1]; }
  TREES = L.trees.map(([x, y], i) => ({ x, y, h: 0.8 + ((i * 37) % 10) / 20 }));
  // 이미 있는 캐릭터는 지금 장소로 바로 옮김
  if (typeof agents !== 'undefined') for (const a of agents.values()) { const z = ZONES[a.zone] || ZONES.chair; a.x = a.tx = z.x + z.ax; a.y = a.ty = z.y + z.ay; }
}
const dep = (x, y) => x + y;   // 그리는 순서 (뒤 → 앞)
const PLAN_TOOLS = /^(TodoWrite|TaskCreate|TaskUpdate|TaskList|EnterPlanMode|ExitPlanMode)$/;
function zoneOf(ev) {
  const t = ev.tool || '';
  if (ev.kind === 'idle') return 'chair';
  if (ev.kind === 'think' || PLAN_TOOLS.test(t)) return 'coffee';
  if (/^(Read|NotebookRead|LS)$/.test(t)) return 'dome';
  if (/^(Edit|Write|MultiEdit|NotebookEdit)$/.test(t)) return 'tipi';
  if (/^(Glob|Grep)$/.test(t)) return 'shelter';
  if (/^(WebSearch|WebFetch|ToolSearch)$/.test(t) || /^mcp__/.test(t)) return 'tarp';
  if (/^(Agent|Task)$/.test(t)) return 'van';
  if (/^(Bash|BashOutput)$/.test(t)) return /test|check|build|lint|pytest|jest|vitest|npm run|py_compile/.test(ev.text || '') ? 'bbq' : 'fire';
  return 'chair';
}

// ── 예약된 작업 (한국 시간) ──
const JOBS = [
  { name: '스레드 글 올리기', at: { hours: [7, 12, 22], min: 5 },  zone: 'tipi',    say: '스레드 글 올리는 중…' },
  { name: '쿠팡 특가 찾기',   at: { hours: [6], min: 10 },         zone: 'tarp',    say: '쿠팡 특가 찾는 중…' },
  { name: '특가 글 올리기',   at: { hours: [10], min: 5 },         zone: 'tipi',    say: '특가 글 올리는 중…' },
  { name: '댓글 확인',        at: { every: 60, min: 35 },          zone: 'coffee',  say: '댓글 읽는 중…' },
  { name: '방문 통계 정리',   at: { every: 60, min: 0 },           zone: 'shelter', say: '통계 정리하는 중…' },
  { name: '쿠팡 링크 점검',   at: { hours: [9], min: 10, wd: 1 },  zone: 'dome',    say: '링크 점검하는 중…' },
  { name: '스레드 토큰 갱신', at: { hours: [3], min: 17, wd: 2 },  zone: 'fire',    say: '토큰 갈아끼우는 중…' },
];
const KST = 9 * 3600e3;
function nextRun(job, now) {
  // 한국 시간 기준 다음 실행 시각 (분 단위로 앞으로 훑기 — 하루 1,440번이면 충분)
  const k = new Date(Math.ceil((now + KST) / 60e3) * 60e3);
  for (let i = 0; i < 8 * 1440; i++) {
    const d = new Date(k.getTime() + i * 60e3), h = d.getUTCHours(), m = d.getUTCMinutes(), wd = d.getUTCDay();
    const a = job.at;
    if (m !== a.min) continue;
    if (a.wd != null && wd !== a.wd) continue;
    if (a.every || a.hours.includes(h)) return d.getTime() - KST;
  }
  return null;
}
function untilText(ms) {
  const m = Math.round(ms / 60e3);
  if (m < 1) return '곧';
  if (m < 60) return `${m}분 뒤`;
  const h = Math.floor(m / 60);
  return h < 24 ? `${h}시간 ${m % 60}분 뒤` : `${Math.floor(h / 24)}일 뒤`;
}

// ── 아이소 변환 ──
function iso(x, y) { return { x: (x - y) * TW / 2, y: (x + y) * TH / 2 }; }
function toScreen(x, y) {
  const p = iso(x, y);
  if (TALL) return { x: W / 2 + p.x * S, y: H - ((2 * TN + 2) * TH / 2 + 14) * S + p.y * S };   // 땅은 아래에 붙이고 남는 위쪽은 하늘
  return { x: W / 2 + p.x * S, y: H * 0.54 - (N * TH / 2) * S + p.y * S };
}
function resize() {
  const r = cv.getBoundingClientRect();
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = r.width; H = r.height;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const tall = H > W;
  if (tall !== TALL || !resize.done) { TALL = tall; applyLayout(); resize.done = true; }
  S = TALL ? Math.min(W / ((2 * TK + 1.6) * TW / 2), H * 0.88 / ((2 * TN + 2) * TH / 2)) : Math.min(W / (N * TW * 1.05), H / (N * TH * 1.3));
}
addEventListener('resize', resize);

// ── 기본 도형 ──
function poly(pts, fill, stroke) {
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
}
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function tile(x, y, fill) { poly([toScreen(x, y), toScreen(x + 1, y), toScreen(x + 1, y + 1), toScreen(x, y + 1)], fill); }
function glow(p, r, rgba) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(p.x, p.y, 1, p.x, p.y, r); g.addColorStop(0, rgba); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(p.x - r, p.y - r, r * 2, r * 2); ctx.restore();
}

// ── 시간대 (한국 시간) — 하늘·땅·조명 ──
const MOODS = {
  dawn:   { name: '새벽', sky: ['#2b3350', '#c98a7a', '#e9b98f'], grass: ['#2b4a3a', '#284434'], path: ['#5a5446', '#544e41'], edge: ['#1c3328', '#172b22'], stars: 0.35, moon: 0.5, sun: null, fire: 0.6, tint: 'rgba(255,170,140,0.06)' },
  day:    { name: '낮',   sky: ['#7fb6d9', '#b9dbe9', '#e3f0e6'], grass: ['#4f8a4c', '#4a8247'], path: ['#b7a27a', '#ae9a72'], edge: ['#35603a', '#2d5232'], stars: 0, moon: 0, sun: [0.18, 0.12, '#fff3c4'], fire: 0.25, tint: 'rgba(255,255,255,0)' },
  sunset: { name: '노을', sky: ['#3c3a62', '#d9775a', '#f2b36d'], grass: ['#3d5f3c', '#385838'], path: ['#8a6f52', '#82684d'], edge: ['#27412b', '#213824'], stars: 0.15, moon: 0, sun: [0.8, 0.3, '#ffb36b'], fire: 0.7, tint: 'rgba(255,120,60,0.07)' },
  night:  { name: '밤',   sky: ['#0a1420', '#0f1d24', '#0b1418'], grass: ['#1d3a2c', '#1a3428'], path: ['#3a3a2e', '#36362b'], edge: ['#10231b', '#0d1d17'], stars: 1, moon: 1, sun: null, fire: 1, tint: 'rgba(20,40,80,0.10)' },
};
let todForce = null;   // 미리 보기로 고른 시간대 (없으면 자동)
function moodNow() {
  if (todForce) return MOODS[todForce];
  const h = new Date(Date.now() + 9 * 3600e3).getUTCHours() + new Date().getUTCMinutes() / 60;
  return h >= 5 && h < 7 ? MOODS.dawn : h >= 7 && h < 17 ? MOODS.day : h >= 17 && h < 19.5 ? MOODS.sunset : MOODS.night;
}
let M = MOODS.night;

// ── 배경 ──
const rnd = (a => () => (a = (a * 16807) % 2147483647) / 2147483647)(42);
const STARS = Array.from({ length: 90 }, () => ({ x: rnd(), y: rnd() * 0.3, r: rnd() * 1.2 + 0.3, p: rnd() * 6 }));
let TREES = [];
function drawSky(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, M.sky[0]); g.addColorStop(0.55, M.sky[1]); g.addColorStop(1, M.sky[2]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (M.stars) for (const s of STARS) {
    const a = (reduce ? 0.7 : 0.45 + 0.4 * Math.sin(t / 900 + s.p)) * M.stars;
    ctx.fillStyle = `rgba(233,228,214,${a})`; ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, 7); ctx.fill();
  }

  const lift = sit ? 8 * S : 0, top = p.y - bob + lift;
  ctx.globalAlpha = a.alpha;
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(p.x, p.y, 7 * S, 3 * S, 0, 0, 7); ctx.fill();
  // 다리 (걸을 땐 엇갈림)
  const sw = act === 'walk' && !reduce ? Math.sin(t / 90) * 2.5 * S : 0;
  ctx.fillStyle = '#2a3238';
  if (sit) { ctx.fillRect(p.x - 5 * S, p.y - 9 * S, 10 * S, 3 * S); ctx.fillRect(p.x - 5 * S, p.y - 7 * S, 3 * S, 7 * S); ctx.fillRect(p.x + 2 * S, p.y - 7 * S, 3 * S, 7 * S); }
  else { ctx.fillRect(p.x - 4 * S + sw, top - 9 * S, 3 * S, 9 * S); ctx.fillRect(p.x + 1 * S - sw, top - 9 * S, 3 * S, 9 * S); }
  // 몸·머리·모자
  ctx.fillStyle = a.color; ctx.fillRect(p.x - 6 * S, top - 22 * S, 12 * S, 14 * S);
  ctx.fillStyle = '#f0d2b0'; ctx.beginPath(); ctx.arc(p.x, top - 27 * S, 5.5 * S, 0, 7); ctx.fill();
  ctx.fillStyle = '#2f4b3a'; ctx.fillRect(p.x - 7 * S, top - 32 * S, 14 * S, 2.5 * S); ctx.fillRect(p.x - 4 * S, top - 36 * S, 8 * S, 4 * S);
  // 하는 일에 따라 팔과 손에 든 것
  const sh = { x: p.x + 5 * S, y: top - 19 * S };
  const ang = { walk: Math.sin(t / 90) * 0.6, read: -0.9, hammer: -1.2 + Math.abs(Math.sin(k * 6)) * 1.3, torch: -0.5 + Math.sin(k * 1.5) * 0.4,
    pour: -0.7 + Math.sin(k * 2) * 0.25, type: -0.4 + Math.sin(k * 14) * 0.12, poke: -0.6 + Math.sin(k * 3) * 0.45,
    flip: -0.9 + Math.max(0, Math.sin(k * 2.6)) * 0.9, sit: 0.5, wave: -2.2 + Math.sin(k * 8) * 0.5 }[act] || 0.3;
  const hand = { x: sh.x + Math.cos(ang) * 9 * S, y: sh.y - Math.sin(-ang) * 9 * S };
  ctx.strokeStyle = a.color; ctx.lineWidth = 3 * S; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(sh.x, sh.y); ctx.lineTo(hand.x, hand.y); ctx.stroke();
  ctx.lineWidth = 2 * S;
  if (a.carry || act === 'carry') { ctx.fillStyle = '#7a4e2e'; ctx.fillRect(p.x - 8 * S, top - 20 * S, 16 * S, 5 * S); ctx.fillRect(p.x - 6 * S, top - 25 * S, 12 * S, 5 * S); }
  if (act === 'read') { ctx.fillStyle = '#e9e4d6'; ctx.fillRect(hand.x - 2 * S, hand.y - 6 * S, 8 * S, 6 * S); }
  if (act === 'hammer') { ctx.strokeStyle = '#6b4a2f'; ctx.beginPath(); ctx.moveTo(hand.x, hand.y); ctx.lineTo(hand.x + 5 * S, hand.y - 4 * S); ctx.stroke(); ctx.fillStyle = '#8fa3a4'; ctx.fillRect(hand.x + 3 * S, hand.y - 7 * S, 5 * S, 3 * S); }
  if (act === 'torch') { ctx.save(); ctx.globalCompositeOperation = 'lighter'; poly([hand, { x: hand.x + 34 * S, y: hand.y - 10 * S + Math.sin(k * 1.5) * 8 * S }, { x: hand.x + 34 * S, y: hand.y + 8 * S + Math.sin(k * 1.5) * 8 * S }], 'rgba(255,230,160,0.18)'); ctx.restore(); }
  if (act === 'pour') { ctx.fillStyle = '#c7ccc9'; ctx.beginPath(); ctx.ellipse(hand.x + 3 * S, hand.y, 4 * S, 3 * S, 0, 0, 7); ctx.fill(); ctx.strokeStyle = 'rgba(180,210,220,0.7)'; ctx.beginPath(); ctx.moveTo(hand.x + 7 * S, hand.y); ctx.lineTo(hand.x + 9 * S, hand.y + 7 * S); ctx.stroke(); }
  if (act === 'poke' || act === 'flip') { ctx.strokeStyle = act === 'flip' ? '#8fa3a4' : '#6b4a2f'; ctx.beginPath(); ctx.moveTo(hand.x, hand.y); ctx.lineTo(hand.x + 10 * S, hand.y + 5 * S); ctx.stroke(); }
  if (act === 'sit' && !reduce && Math.sin(k * 0.8) > 0.7) { ctx.fillStyle = 'rgba(233,228,214,0.6)'; ctx.font = `${10 * S + 4}px sans-serif`; ctx.textAlign = 'left'; ctx.fillText('z', p.x + 8 * S, top - 36 * S - Math.sin(k) * 4 * S); }
  // 말풍선 — 장소에 도착하면 그곳에서 하는 일
  if (a.say && !a.moving) {
    ctx.font = `${Math.max(10, 10 * S + 2)}px "IBM Plex Sans KR", sans-serif`; ctx.textAlign = 'center';
    const dots = reduce ? '' : '.'.repeat(1 + Math.floor((t / 400) % 3));
    const txt = a.say.replace(/…$/, '') + (reduce ? '…' : dots), w = ctx.measureText(a.say.replace(/…$/, '') + '...').width + 14, h = 19, bx = p.x, by = top - 44 * S - 4;
    ctx.fillStyle = 'rgba(233,228,214,0.95)'; roundRect(bx - w / 2, by - h, w, h, 7); ctx.fill();
    poly([{ x: bx - 4, y: by }, { x: bx + 4, y: by }, { x: bx, y: by + 5 }], 'rgba(233,228,214,0.95)');
    ctx.fillStyle = '#0f1a1f'; ctx.fillText(txt, bx, by - 5.5);
  }
  ctx.font = `600 ${Math.max(9, 9 * S + 2)}px "IBM Plex Sans KR", sans-serif`; ctx.fillStyle = a.color; ctx.textAlign = 'center';
  ctx.fillText(a.name, p.x, p.y + 12 * S + 4);
  ctx.globalAlpha = 1; ctx.lineCap = 'butt';
}

// ── 그리기 (뒤에서 앞으로) ──
function frame(t) {
  const dt = Math.min(0.05, (t - (frame.last || t)) / 1000); frame.last = t;
  step(dt);
  M = moodNow();
  if (wood.shown !== wood.level) wood.shown += Math.sign(wood.level - wood.shown) * Math.min(Math.abs(wood.level - wood.shown), dt * 0.4);
  drawSky(t); drawGround();
  const Z = ZONES, items = [
    ...TREES.map(o => ({ d: dep(o.x, o.y), f: () => tree(o) })),
    { d: dep(Z.dome.x, Z.dome.y), f: () => dome(t) }, { d: dep(Z.tipi.x, Z.tipi.y), f: tipi }, { d: dep(Z.shelter.x, Z.shelter.y), f: () => shelter(t) },
    { d: dep(Z.coffee.x, Z.coffee.y), f: () => coffee(t) },
    { d: dep(Z.tarp.x, Z.tarp.y) - 0.2, f: tarpUnder }, { d: dep(Z.tarp.x, Z.tarp.y) + 1.4, f: () => tarpTop(t) },
    { d: dep(Z.fire.x, Z.fire.y), f: () => fire(t) }, { d: dep(Z.bbq.x, Z.bbq.y), f: () => bbq(t) },
    { d: dep(Z.chair.x, Z.chair.y) - 0.1, f: chairs }, { d: dep(Z.van.x, Z.van.y), f: van },
    { d: dep(L.picnic[0], L.picnic[1]), f: () => picnicTable(L.picnic[0], L.picnic[1]) }, { d: dep(WOODPILE.x, WOODPILE.y), f: woodpile },
    ...[...agents.values()].map(a => ({ d: dep(a.x, a.y) + 0.02, f: () => person(a, t) })),
  ].sort((a, b) => a.d - b.d);
  items.forEach(i => i.f());
  drawPuffs(dt);
  ctx.fillStyle = M.tint; ctx.fillRect(0, 0, W, H);
  requestAnimationFrame(frame);
}

// ── 이벤트 처리 ── {agent, name, tool, text, kind: 'tool'|'think'|'idle'|'done'}
const logEl = document.getElementById('log'), nowEl = document.getElementById('now'), jobsEl = document.getElementById('jobs');
const kstClock = ms => new Date(ms + KST).toISOString().slice(11, 19);
function log(who, text) {
  const li = document.createElement('li');
  li.innerHTML = '<span></span><span></span>';
  li.firstChild.textContent = kstClock(Date.now()); li.lastChild.textContent = `${who} · ${text}`;
  logEl.prepend(li); while (logEl.children.length > 60) logEl.lastChild.remove();
}
const pending = [];   // 장작 나르는 동안 들어온 공대남자 일 (끝나면 마지막 것부터 이어서)
function handle(ev) {
  const a = agent(ev.agent || 'main', ev.name, ev.color);
  if (refilling && a.id === 'main') { pending.push(ev); log(a.name, ev.text || ''); return; }
  if (ev.kind === 'done') { goTo(a, 'van', '돌아가는 중…', ev.text || '돌아가는 중'); setTimeout(() => { a.leaving = true; renderNow(); }, 2200); }
  else { const z = zoneOf(ev); goTo(a, z, ev.say, ev.text); }
  log(a.name, ev.text || a.say);
  if (demoOn && ev.kind !== 'done') useWood(0.004 + Math.random() * 0.006);
  renderNow();
}
function renderNow() {
  nowEl.innerHTML = '';
  for (const a of agents.values()) {
    if (a.leaving) continue;
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = '<span class="sw"></span><div><b></b> <span class="t"></span></div><span></span>';
    row.querySelector('.sw').style.background = a.color;
    row.querySelector('b').textContent = a.name;
    row.querySelector('.t').textContent = a.text;
    nowEl.append(row);
  }
}
function renderJobs() {
  const now = Date.now();
  const list = JOBS.map(j => ({ j, at: nextRun(j, now) })).filter(x => x.at).sort((a, b) => a.at - b.at);
  jobsEl.innerHTML = '';
  for (const { j, at } of list) {
    const row = document.createElement('div'); row.className = 'row' + (at - now < 30 * 60e3 ? ' soon' : '');
    row.innerHTML = '<span class="sw"></span><div><b></b> <span class="t"></span></div><span class="when"></span>';
    row.querySelector('.sw').style.background = '#8fa3a4';
    row.querySelector('b').textContent = j.name;
    row.querySelector('.t').textContent = kstClock(at).slice(0, 5);
    row.querySelector('.when').textContent = untilText(at - now);
    jobsEl.append(row);
  }
}
// 예약 작업 시각이 되면 예약봇이 와서 일하고 캠핑카로 돌아감
let botN = 0;
function runJob(j) {
  const id = 'bot' + (++botN), name = '예약봇';
  handle({ agent: id, name, color: '#c9c3b3', tool: '', kind: 'tool', say: j.say, text: j.name, _zone: j.zone });
  const a = agents.get(id); goTo(a, j.zone, j.say, j.name);
  setTimeout(() => handle({ agent: id, name, kind: 'done', text: `${j.name} 끝` }), 6500);
}
let lastMin = -1;
setInterval(() => {
  renderJobs();
  const now = Date.now(), m = Math.floor(now / 60e3);
  if (m === lastMin) return; lastMin = m;
  for (const j of JOBS) { const at = nextRun(j, now - 60e3); if (at && Math.floor(at / 60e3) === m) runJob(j); }
}, 5000);

// ── 데모: 실제 같은 작업 흐름 ──
const DEMO = [
  { kind: 'think', text: '할 일 정리' }, { tool: 'Read', text: 'CLAUDE.md' }, { tool: 'Grep', text: "'heatmap' 찾기" },
  { tool: 'Read', text: 'kydzm/index.html' }, { tool: 'Edit', text: 'index.html 고치기' },
  { tool: 'Bash', text: 'node --check (문법 검사)' }, { tool: 'Bash', text: 'git push origin main' },
  { tool: 'WebSearch', text: '쿠팡 파트너스 API' }, { kind: 'spawn' }, { tool: 'Write', text: 'deals.py 쓰기' },
  { tool: 'Bash', text: 'pytest 테스트' }, { kind: 'idle', text: '사용자 답 기다리기' },
];
const SUB_TASKS = [[{ tool: 'Glob', text: 'queue.json 찾기' }, { tool: 'Read', text: 'queue.json 읽기' }, { tool: 'Grep', text: '겨울 문구 찾기' }],
  [{ tool: 'WebFetch', text: '쿠팡 문서 읽기' }, { kind: 'think', text: '요약 정리' }]];
let demoOn = true, di = 0, subN = 0;
function spawn() {
  SUB_TASKS.forEach(tasks => {
    const id = 'sub' + (++subN), name = '동료 ' + subN;
    handle({ agent: 'main', tool: 'Agent', text: `${name}에게 일 맡기기` });
    tasks.forEach((e, i) => setTimeout(() => handle({ ...e, agent: id, name }), 1600 + i * 2800));
    setTimeout(() => handle({ agent: id, name, kind: 'done', text: '보고하고 돌아감' }), 1600 + tasks.length * 2800);
  });
}
function demoTick() {
  if (!demoOn) return;
  const e = DEMO[di++ % DEMO.length];
  if (e.kind === 'spawn') spawn(); else handle({ agent: 'main', ...e });
}
document.getElementById('pause').onclick = e => { demoOn = !demoOn; e.currentTarget.textContent = demoOn ? '데모 멈추기' : '데모 다시 보기'; };
document.getElementById('burst').onclick = spawn;
document.getElementById('job').onclick = () => runJob(JOBS[Math.floor(Math.random() * JOBS.length)]);
document.getElementById('refill').onclick = refill;
const TODS = [null, 'dawn', 'day', 'sunset', 'night'];
document.getElementById('tod').onclick = e => { todForce = TODS[(TODS.indexOf(todForce) + 1) % TODS.length]; e.currentTarget.textContent = '시간대: ' + (todForce ? MOODS[todForce].name : '자동'); };

resize(); agent('main'); renderNow(); renderJobs(); renderWood();
setInterval(() => { renderWood(); if (Date.now() >= wood.resetAt) refill(); }, 30000);
handle({ agent: 'main', kind: 'idle', text: '캠핑장 도착' });
setInterval(demoTick, 3400);
requestAnimationFrame(frame);
})();
</script>
