<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>운영 지도</title>
<style>
:root{--bg:#f6f7f5;--panel:#fff;--line:#dfe3dc;--ink:#1d221d;--muted:#6b736b;--accent:#2f6f3e;--err-bg:#fff1f0;--err:#a8071a;--dot:#d8dcd5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151815;--panel:#1d211d;--line:#333a33;--ink:#e8ece6;--muted:#9aa39a;--accent:#7fc28e;--err-bg:#3a1414;--err:#ffb3b3;--dot:#2a302a}}
:root[data-theme="dark"]{--bg:#151815;--panel:#1d211d;--line:#333a33;--ink:#e8ece6;--muted:#9aa39a;--accent:#7fc28e;--err-bg:#3a1414;--err:#ffb3b3;--dot:#2a302a}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:14px;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:16px;margin:0} .sub{color:var(--muted);font-size:12.5px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;font-size:12.5px;padding:5px 10px;border:1px solid var(--line);background:var(--panel);border-radius:6px;cursor:pointer;color:var(--ink)}
button:hover{border-color:var(--accent);color:var(--accent)} .tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;margin-left:auto} .legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:13px;height:13px;border-radius:3px;border:1px solid rgba(0,0,0,.25)}
main{flex:1;display:grid;grid-template-columns:minmax(280px,34%) minmax(0,1fr);min-height:0}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0} .pane.src{border-right:1px solid var(--line);background:var(--panel)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)} .bar b{color:var(--ink)}
textarea{flex:1;width:100%;border:0;resize:none;padding:12px 14px;font:12.5px/1.55 ui-monospace,Menlo,Consolas,monospace;color:var(--ink);background:transparent;outline:none;white-space:pre;overflow:auto}
.view{flex:1;overflow:auto;padding:16px;background:radial-gradient(circle,var(--dot) 1px,transparent 1px) 0 0/22px 22px}
.canvas{display:inline-block;background:#fff;border-radius:8px;padding:8px} .canvas svg{max-width:none!important;height:auto}
.err{display:none;margin:0;padding:10px 12px;background:var(--err-bg);color:var(--err);font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap} .err.on{display:block}
input[type=range]{width:110px;vertical-align:middle}
@media (max-width:900px){main{grid-template-columns:minmax(0,1fr);grid-template-rows:38vh minmax(0,1fr)}.pane.src{border-right:0;border-bottom:1px solid var(--line)}.legend{margin-left:0}}
</style>
</head>
<body>
<header>
  <div><h1>공대남자 운영 지도</h1><div class="sub">261030 · 수동/자동 · 수익까지의 경로 · 소스는 docs/pipeline.md와 같음</div></div>
  <div class="tabs"><button class="tab on" data-tab="map">전체 지도</button><button class="tab" data-tab="flow">콘텐츠 1건 흐름</button><button class="tab" data-tab="site">홈페이지 연결 구조</button></div>
  <div class="legend">
    <span><i style="background:#FFF3C4"></i>사용자</span><span><i style="background:#E3F2FD"></i>Claude</span><span><i style="background:#EEEEEE"></i>시스템</span>
    <span><i style="background:#F3E8FF"></i>정보 소스</span><span><i style="background:#DCFCE7"></i>자산</span><span><i style="background:#FFE4E6"></i>채널·유입</span>
    <span><i style="background:#FFEDD5"></i>수익</span><span><i style="background:#E0F2FE;border-style:dashed"></i>파트너·미정</span>
  </div>
</header>
<main>
  <section class="pane src">
    <div class="bar"><b>Mermaid 소스</b> 고치면 오른쪽이 바로 바뀜(이 브라우저에만 저장)
      <span style="margin-left:auto;display:flex;gap:6px"><button id="copy">소스 복사</button><button id="reset">되돌리기</button></span></div>
    <pre class="err" id="err"></pre>
    <textarea id="src" spellcheck="false" aria-label="Mermaid 소스"></textarea>
  </section>
  <section class="pane">
    <div class="bar"><b>미리보기</b>
      <label>확대 <input type="range" id="zoom" min="40" max="200" value="100"> <span id="zv">100%</span></label>
      <button id="fit">맞춤</button></div>
    <div class="view" id="view"><div class="canvas" id="canvas"></div></div>
  </section>
</main>
<script type="text/plain" id="src-map">
flowchart LR

    MAIL["협찬 메일 → Apps Script 10분<br/>→ 카카오 · 캘린더 · 노션 대장"]:::sys

  GR["그래가 파트너<br/>수익 ✕ · 예약 유입 계속"]:::partner

  IG --> DM --> HUB

  SE --> HUB

  BLOG -- 본문 링크 --> HUB
  HUB -- 릴스 모음 · 시리즈 --> IG
  HUB --> CP
  HUB --> NBC
  HUB --> KUR

  TH --> CP

  FB -.-> VIEW
  CLIP -.-> VIEW
  MK --> SPON
  MAIL --> SPON
  IG -- 협찬 콘텐츠 --> SPON

  classDef user    fill:#FFF3C4,stroke:#B7791F,color:#1a1a1a
  classDef ai      fill:#E3F2FD,stroke:#1E63B4,color:#1a1a1a
  classDef sys     fill:#EEEEEE,stroke:#616161,color:#1a1a1a
  classDef src     fill:#F3E8FF,stroke:#6B21A8,color:#1a1a1a
  classDef page    fill:#DCFCE7,stroke:#15803D,color:#1a1a1a,stroke-width:3px
  classDef in      fill:#FFE4E6,stroke:#BE123C,color:#1a1a1a
  classDef money   fill:#FFEDD5,stroke:#C2410C,color:#1a1a1a
  classDef partner fill:#E0F2FE,stroke:#0369A1,color:#1a1a1a,stroke-dasharray:5 4
</script>

<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs';
const $=id=>document.getElementById(id);
const src=$('src'),canvas=$('canvas'),err=$('err'),zoom=$('zoom'),view=$('view');
const DEF=k=>document.getElementById('src-'+k).textContent.trim();
const KEY=k=>'kydz_pipeline_v2_'+k;
const get=k=>{try{return localStorage.getItem(KEY(k))||DEF(k)}catch(e){return DEF(k)}};
const put=(k,v)=>{try{localStorage.setItem(KEY(k),v)}catch(e){}};
let tab='map';try{tab=localStorage.getItem('kydz_pipeline_tab')||'map'}catch(e){}
mermaid.initialize({startOnLoad:false,theme:'base',securityLevel:'strict',flowchart:{htmlLabels:true,curve:'basis',nodeSpacing:28,rankSpacing:44},
  themeVariables:{fontFamily:'-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif',fontSize:'13px',primaryColor:'#ffffff',lineColor:'#4b534b',clusterBkg:'#fbfcfa',clusterBorder:'#c9cfc6',titleColor:'#1d221d'}});
let seq=0,timer=null;
async function render(){try{await mermaid.parse(src.value);const{svg}=await mermaid.render('g'+(++seq),src.value);canvas.innerHTML=svg;err.classList.remove('on');applyZoom()}
  catch(e){err.textContent=String(e&&e.message||e).split('\n').slice(0,6).join('\n');err.classList.add('on')}}
// 확대: SVG 실제 크기(viewBox)에 배율을 곱해 너비·높이로 줌 (transform은 스크롤 영역이 안 늘어서)
const box=()=>{const s=canvas.querySelector('svg');return s&&s.viewBox&&s.viewBox.baseVal&&s.viewBox.baseVal.width?[s,s.viewBox.baseVal]:[s,null]};
function applyZoom(){const z=zoom.value/100,[s,vb]=box();$('zv').textContent=zoom.value+'%';if(!s||!vb)return;
  s.style.maxWidth='none';s.setAttribute('width',Math.round(vb.width*z));s.setAttribute('height',Math.round(vb.height*z))}
function fit(){const[s,vb]=box();if(!s||!vb)return;zoom.value=Math.max(40,Math.min(200,Math.floor((view.clientWidth-56)/vb.width*100)));applyZoom()}
async function show(k){tab=k;try{localStorage.setItem('kydz_pipeline_tab',k)}catch(e){}
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===k));src.value=get(k);await render();fit()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(b.dataset.tab));
src.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>{put(tab,src.value);render()},450)});
zoom.addEventListener('input',applyZoom);$('fit').onclick=fit;
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(src.value)}catch(e){src.select()}};
$('reset').onclick=()=>{src.value=DEF(tab);put(tab,src.value);render().then(fit)};
show(tab);
</script>
</body>
</html>
