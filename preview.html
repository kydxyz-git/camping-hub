<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<title>미리보기 · KYDZ</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light only;--ink:#15181A;--stone:#8B9089;--line:#E4E4DE;--stamp:#FFE873;
  --sans:'SUIT Variable',system-ui,sans-serif;--mono:'IBM Plex Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#2A2E31;color:#E9EAE6;font-family:var(--sans);min-height:100vh;
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:12px 20px;background:#22262A;border-bottom:1px solid #383D41;position:sticky;top:0;z-index:10}
.bar .t{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:#9AA0A4}
.seg{display:flex;gap:2px;background:#2F3438;border-radius:999px;padding:3px}
.seg button{border:none;background:none;color:#9AA0A4;font:inherit;font-size:12.5px;
  padding:6px 13px;border-radius:999px;cursor:pointer;transition:.15s}
.seg button:hover{color:#E9EAE6}
.seg button.on{background:var(--stamp);color:#15181A;font-weight:700}
.bar input[type=text]{flex:1 1 180px;max-width:280px;background:#2F3438;border:1px solid #3D4348;
  color:#E9EAE6;border-radius:8px;padding:7px 11px;font:inherit;font-size:12.5px}
.bar input:focus{outline:none;border-color:var(--stamp)}
.btn{border:1px solid #3D4348;background:#2F3438;color:#E9EAE6;font:inherit;font-size:12.5px;
  padding:7px 14px;border-radius:8px;cursor:pointer;transition:.15s}
.btn:hover{border-color:#5A6167}
.btn.go{background:var(--stamp);color:#15181A;border-color:var(--stamp);font-weight:700}
.auto{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#9AA0A4;cursor:pointer}

.stage{flex:1;display:flex;gap:26px;align-items:flex-start;justify-content:center;
  padding:26px 20px 40px;overflow:auto}
.dev{display:flex;flex-direction:column;align-items:center;gap:9px}
.dev .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:#8A9095}
.dev .frame{background:#0E1113;border-radius:16px;padding:8px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.dev.phone .frame{border-radius:32px;padding:10px}
.dev iframe{display:block;border:0;background:#FBFBF8;border-radius:9px;width:100%;height:100%}
.dev.phone iframe{border-radius:24px}
.hide{display:none}
</style>
</head>
<body>

<div class="bar">
  <span class="t">KYDZ PREVIEW</span>
  <div class="seg" id="site">
    <button data-p="v3.html" class="on">v3</button>
    <button data-p="index.html">기존</button>
    <button data-p="__cmp__">비교</button>
  </div>
  <div class="seg" id="seg">
    <button data-v="both" class="on">나란히</button>
    <button data-v="phone">모바일</button>
    <button data-v="desk">PC</button>
  </div>
  <input type="text" id="path" value="v3.html" spellcheck="false" aria-label="경로">
  <button class="btn go" id="load">열기</button>
  <button class="btn" id="reload">새로고침</button>
  <label class="auto"><input type="checkbox" id="autor"> 5초마다 자동</label>
</div>

<div class="stage hide" id="cmp">
  <div class="dev phone">
    <span class="lbl">v3 · MOBILE</span>
    <div class="frame" style="width:410px;height:800px"><iframe id="c-v3" title="v3"></iframe></div>
  </div>
  <div class="dev phone">
    <span class="lbl">기존 · MOBILE</span>
    <div class="frame" style="width:410px;height:800px"><iframe id="c-old" title="기존"></iframe></div>
  </div>
</div>

<div class="stage" id="stage">
  <div class="dev phone" id="d-phone">
    <span class="lbl">MOBILE · 390 × 780</span>
    <div class="frame" style="width:410px;height:800px"><iframe id="f-phone" title="모바일"></iframe></div>
  </div>
  <div class="dev desk" id="d-desk">
    <span class="lbl">DESKTOP · 1280 × 800</span>
    <div class="frame" style="width:1000px;height:660px"><iframe id="f-desk" title="PC"></iframe></div>
  </div>
</div>

<script>
const BASE='https://kydz.kr/';
const $=s=>document.querySelector(s);
const fP=$('#f-phone'), fD=$('#f-desk');
let timer=null;

function url(){
  const p=$('#path').value.trim().replace(/^\/+/,'')||'v3.html';
  return BASE+p+(p.includes('?')?'&':'?')+'nc='+Date.now();
}
function load(){ const u=url(); fP.src=u; fD.src=u; }

$('#load').onclick=load;
$('#path').addEventListener('keydown',e=>{ if(e.key==='Enter') load(); });

$('#site').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  [...$('#site').children].forEach(x=>x.classList.toggle('on',x===b));
  const cmp = b.dataset.p==='__cmp__';
  $('#cmp').classList.toggle('hide', !cmp);
  $('#stage').classList.toggle('hide', cmp);
  $('#seg').style.display = cmp ? 'none' : '';
  $('#path').style.display = cmp ? 'none' : '';
  if(cmp){
    const t=Date.now();
    $('#c-v3').src  = BASE+'v3.html?nc='+t;
    $('#c-old').src = BASE+'index.html?nc='+t;
    [$('#c-v3'),$('#c-old')].forEach(f=>{
      f.style.width='390px'; f.style.height='780px';
      f.style.transformOrigin='0 0';
    });
  }else{
    $('#path').value = b.dataset.p;
    load();
  }
};

$('#seg').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  [...$('#seg').children].forEach(x=>x.classList.toggle('on',x===b));
  const v=b.dataset.v;
  $('#d-phone').classList.toggle('hide', v==='desk');
  $('#d-desk').classList.toggle('hide', v==='phone');
};

function reloadAll(){
  if(!$('#cmp').classList.contains('hide')){
    const t=Date.now();
    $('#c-v3').src  = BASE+'v3.html?nc='+t;
    $('#c-old').src = BASE+'index.html?nc='+t;
  }else load();
}
$('#reload').onclick=reloadAll;
$('#autor').onchange=e=>{
  clearInterval(timer);
  if(e.target.checked) timer=setInterval(reloadAll,5000);
};

/* PC 프레임은 1280 기준으로 렌더한 뒤 축소해 실제 데스크톱 폭을 재현 */
function scaleDesk(){
  const box=$('#d-desk .frame');
  const w=1280, h=845, s=1000/w;
  fD.style.width=w+'px'; fD.style.height=h+'px';
  fD.style.transformOrigin='0 0'; fD.style.transform='scale('+s+')';
  box.style.height=Math.round(h*s)+'px';
}
function scalePhone(){
  const s=1; // 실제 크기 그대로
  fP.style.width='390px'; fP.style.height='780px';
  fP.style.transformOrigin='0 0'; fP.style.transform='scale('+s+')';
  $('#d-phone .frame').style.width='410px';
  $('#d-phone .frame').style.height='800px';
}
scaleDesk(); scalePhone(); load();
</script>
</body>
</html>
