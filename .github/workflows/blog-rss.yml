# 매일 04:20(KST, 새벽 — 공통 기억 261116) + 수동: 네이버 블로그 RSS → data/blog_posts.json (운영판 '올린 글' 달력의 블로그, 261117)
name: blog-rss

on:
  schedule:
    - cron: '20 19 * * *'
  workflow_dispatch:
  # 예비: 깃허브가 새벽 예약을 빼먹는 날이 있어서(261118) 매시 통계 커밋 때 05시 이후 오늘 아직 안 돌았으면 실행
  push:
    branches: [main]
    paths: ['data/stats.json']

permissions:
  contents: write
  actions: read

concurrency:
  group: blog-rss
  cancel-in-progress: false

jobs:
  rss:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 오늘 이미 돌았으면 건너뜀 (통계 커밋 예비 실행일 때)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          h=$(TZ=Asia/Seoul date +%H); today=$(TZ=Asia/Seoul date +%F)
          # 새 글이 없으면 파일이 안 바뀌니 '오늘 돌았는지'는 실행 기록으로 봄 (push 예비 실행 빼고)
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow blog-rss.yml --status success --limit 10 --json createdAt,event -q '[.[] | select(.event != "push")][0].createdAt' 2>/dev/null || echo "")
          lastk=$(TZ=Asia/Seoul date -d "${last:-1970-01-01T00:00:00Z}" +%F 2>/dev/null || echo "")
          if [ "$h" -lt 5 ] || [ "$lastk" = "$today" ]; then echo "SKIP=1" >> "$GITHUB_ENV"; echo "건너뜀 (지금 ${h}시, 마지막 $last)"; fi
      - name: Fetch blog RSS
        if: env.SKIP != '1'
        run: python3 tools/blog_rss.py
      - name: Commit & push
        run: |
          git config user.name "kydz-build"
          git config user.email "actions@users.noreply.github.com"
          git add data/blog_posts.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "chore(blog): 블로그 글 목록"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i*5))
          done
          exit 1
