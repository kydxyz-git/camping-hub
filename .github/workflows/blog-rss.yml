# 매일 12:20·23:20(KST) + 수동: 네이버 블로그 RSS → data/blog_posts.json (운영판 '올린 글' 달력의 블로그, 261117)
name: blog-rss

on:
  schedule:
    - cron: '20 3,14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-rss
  cancel-in-progress: false

jobs:
  rss:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch blog RSS
        run: python3 tools/blog_rss.py
      - name: Commit & push
        run: |
          git config user.name "kydz-build"
          git config user.email "actions@users.noreply.github.com"
          git add data/blog_posts.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "chore(blog): 블로그 글 목록"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i*5))
          done
          exit 1
