# admin '🛒 쿠팡에서 찾기' → 쿠팡 파트너스 API 검색 → coupang-search 브랜치(파일 1개, 매번 덮어씀)에 결과
name: coupang-search

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: '검색어'
        required: true
      req:
        description: 'admin 요청 번호'
        required: true

permissions:
  contents: write

concurrency:
  group: coupang-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow
      - name: Search
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          KEYWORD: ${{ inputs.keyword }}
          REQ: ${{ inputs.req }}
        run: python3 tools/coupang_search.py
      - name: Push result branch
        run: |
          mv coupang_search.json /tmp/coupang_search.json
          git config user.name "kydz-build"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan coupang-search
          git rm -rq --cached .
          git clean -fdxq
          cp /tmp/coupang_search.json coupang_search.json
          git add coupang_search.json
          git commit -qm "chore(coupang): 쿠팡에서 찾기 결과"
          git push -qf origin HEAD:coupang-search
