# admin이 data/*.json을 저장하면 검색엔진용 정적 페이지·sitemap을 다시 만들어 main에 커밋한다.
name: build-pages

on:
  push:
    branches: [main]
    paths:
      - 'data/camps.json'
      - 'data/items.json'
      - 'data/foods.json'
      - 'data/series.json'
      - 'data/config.json'
      - 'tools/build_pages.py'
      - '.github/workflows/build-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build static pages
        run: python3 tools/build_pages.py
      - name: Commit & push if changed
        run: |
          git config user.name "kydz-build"
          git config user.email "actions@users.noreply.github.com"
          git add -A camps gear foods sitemap.xml index.html
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "chore(build): 정적 페이지·sitemap 자동 갱신"
          # admin·통계 커밋이 그 사이 들어오면 최신 main 위에 다시 만들어 올린다
          for i in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            git fetch origin main && git reset --hard origin/main
            python3 tools/build_pages.py
            git add -A camps gear foods sitemap.xml index.html
            git diff --cached --quiet && exit 0
            git commit -m "chore(build): 정적 페이지·sitemap 자동 갱신"
            sleep $((i*3))
          done
          exit 1
