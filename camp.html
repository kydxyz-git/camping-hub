<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<title>캠핑장 기록 · 공대남자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  color-scheme:light only;
  --paper:#FBFBF8;--ink:#15181A;--moss:#3F5346;--stone:#8B9089;
  --line:#E4E4DE;--stamp:#FFE873;
  --sans:'SUIT Variable','Pretendard Variable',system-ui,sans-serif;
  --display:'Pretendard Variable','SUIT Variable',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --pad:clamp(20px,5vw,64px);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;width:100%;height:100%;object-fit:cover}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

.nav{position:sticky;top:0;z-index:50;background:rgba(251,251,248,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1240px;margin:0 auto;padding:14px var(--pad) 0;
  display:flex;flex-direction:column;align-items:center;gap:10px}
.mark{font-family:var(--display);font-weight:800;
  font-size:clamp(22px,3.2vw,34px);letter-spacing:.02em;white-space:nowrap;line-height:1.1}
.mark span{display:none}
.navrow{display:flex;align-items:center;justify-content:center;
  width:100%;border-top:1px solid var(--line);padding:6px 0}
.back{font-size:13.5px;font-weight:600;color:var(--stone);padding:6px 11px}
.back:hover{color:var(--ink)}
@media (max-width:620px){
  .nav-in{gap:8px;padding:11px 12px 0}
  .mark{font-size:20px}
  .navrow{padding:5px 0}
}

.wrap{max-width:1240px;margin:0 auto;padding:0 var(--pad) 96px}
.loading,.err{padding:96px 0;text-align:center;color:var(--stone);font-size:14px}

/* 갤러리 */
.gal{padding:clamp(24px,4vw,40px) 0 0}
.gal-main{position:relative;aspect-ratio:4/5;max-width:520px;margin:0 auto;
  border-radius:4px;overflow:hidden;background:#EDEDE7}
.gal-main img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  transition:opacity 1.1s ease}
.gal .thumbs{max-width:520px;margin:8px auto 0}
.gal-main .stamp{position:absolute;left:14px;bottom:14px;z-index:2;font-family:var(--mono);font-weight:600;font-size:12px;background:var(--stamp);padding:6px 11px;border-radius:2px}
.thumbs{display:flex;gap:8px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumbs button{flex:0 0 82px;aspect-ratio:4/3;border:none;padding:0;background:#EDEDE7;border-radius:3px;overflow:hidden;cursor:pointer;opacity:.5;transition:opacity .18s}
.thumbs button.on,.thumbs button:hover{opacity:1}

/* 헤더 */
.title{padding:clamp(26px,4vw,40px) 0 0;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.title h1{font-family:var(--display);font-weight:800;font-size:clamp(24px,4vw,42px);letter-spacing:-.035em;line-height:1.15}
.title .sub{width:100%;margin-top:8px;font-family:var(--mono);font-size:12.5px;
  letter-spacing:.02em;color:var(--stone)}
.badge{font-size:11.5px;font-weight:700;background:var(--ink);color:#fff;padding:5px 10px;border-radius:2px;margin-top:6px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.tag{font-size:12.5px;color:#4C524D;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px}
.tag.region{font-family:var(--mono);letter-spacing:.06em;background:var(--ink);color:#fff;border-color:var(--ink)}

/* 본문 */
.cols{display:grid;gap:clamp(28px,4vw,56px);grid-template-columns:1.6fr 1fr;margin-top:clamp(30px,4vw,48px)}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.block{margin-bottom:clamp(30px,4vw,44px)}
.block h2{font-size:13px;font-family:var(--mono);letter-spacing:.12em;color:var(--stone);padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:16px}
.facts{display:flex;gap:clamp(24px,4vw,44px);flex-wrap:wrap}
.fact b{display:block;font-family:var(--mono);font-weight:600;font-size:clamp(22px,3vw,32px);line-height:1;letter-spacing:-.03em}
.fact span{display:block;margin-top:7px;font-size:12px;color:var(--stone)}
.vids{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.vid{display:block;transition:.16s}
.vid:hover{transform:translateY(-2px)}
.vthumb{display:block;position:relative;aspect-ratio:4/5;overflow:hidden;
  border-radius:4px;background:#EDEDE7}
.vthumb img{width:100%;height:100%;object-fit:cover}
.vmeta{display:block;padding:9px 2px 0}
.vmeta b{display:block;font-size:13.5px;font-weight:700;letter-spacing:-.015em;line-height:1.4}
.vmeta em{display:block;font-style:normal;font-family:var(--mono);font-size:10.5px;
  font-weight:400;color:var(--stone);letter-spacing:.04em;margin-top:4px}
#map{height:280px;border-radius:4px;border:1px solid var(--line);background:#EDEDE7}
.notes{list-style:none;display:grid;gap:9px}
.notes li{position:relative;padding-left:14px;font-size:13.5px;color:#3F4540;line-height:1.6}
.notes li::before{content:"";position:absolute;left:0;top:9px;width:4px;height:4px;
  border-radius:50%;background:var(--stamp)}
.rows{border-top:1px solid var(--line)}
.row{display:flex;gap:14px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line)}
.row dt{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--stone);width:56px;flex:none}
.row dd{font-size:13.5px;font-weight:500;line-height:1.6}
.cta{display:block;text-align:center;background:var(--ink);color:#fff;font-weight:700;font-size:15px;padding:16px;border-radius:999px;transition:.18s}
.cta:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(21,24,26,.18)}
.cta-arrow{margin-left:5px;opacity:.65;font-weight:800}
.cta.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);margin-top:10px;font-weight:600;font-size:14px}
.note{margin-top:12px;font-size:12px;color:var(--stone);text-align:center;line-height:1.6}
footer{border-top:1px solid var(--line);padding:30px 0;margin-top:20px;font-size:12.5px;color:var(--stone)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-in">
    <a class="mark" href="./">공대남자</a>
    <div class="navrow"><a class="back" href="./#camps">← 다녀온 캠핑장</a></div>
  </div>
</nav>

<main class="wrap" id="root">
  <p class="loading">불러오는 중…</p>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const BASE='https://kydz.kr/';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const abs=p=>!p?'':/^https?:/.test(p)?p:BASE+String(p).replace(/^\.?\//,'');

/* INFO 표 — 값이 있는 항목만 */
function infoRows(c){
  const r=[];
  if(c.checkin||c.checkout) r.push(['입·퇴실', `${c.checkin||'-'} ~ ${c.checkout||'-'}`]);
  if(c.sites)   r.push(['사이트', c.sites]);
  if(c.price)   r.push(['요금', c.price]);
  if(c.address) r.push(['주소', c.address]);
  return r;
}

/* 대표 이미지: main_img 우선, 없으면 첫 장 */
function orderedImgs(c){
  const imgs=(c.imgs||[]).filter(Boolean);
  if(!imgs.length) return [];
  const m=c.main_img;
  if(m && imgs.includes(m)) return [m, ...imgs.filter(x=>x!==m)];
  return imgs;
}

(async function(){
  const id=new URLSearchParams(location.search).get('id');
  const root=document.getElementById('root');
  if(!id){ root.innerHTML='<p class="err">캠핑장을 지정하지 않았습니다. 목록에서 다시 선택해 주세요.</p>'; return; }

  let camps;
  try{
    const r=await fetch(BASE+'data/camps.json?v='+Date.now());
    if(!r.ok) throw 0;
    camps=await r.json();
  }catch(e){
    root.innerHTML='<p class="err">데이터를 불러오지 못했습니다. 새로고침해 주세요.</p>'; return;
  }

  const c=(camps||[]).find(x=>x.id===id);
  if(!c || c.published===false){
    root.innerHTML='<p class="err">해당 캠핑장을 찾을 수 없습니다. <a href="./#camps" style="text-decoration:underline">목록으로 돌아가기</a></p>'; return;
  }

  document.title=c.name+' · 공대남자 캠핑 기록';
  const imgs=orderedImgs(c);
  const v=+c.visits||0;
  const FEATURES=['계곡','바다','벚꽃','수영장','애견동반','개별샤워실','펜션','노키즈'];
  const all=[...(c.landscape||[]),...(c.extras||[])];
  const tags=FEATURES.filter(f=>all.includes(f));

  // 연결된 릴스: camp_id로 시리즈에서 수집 + 자체 videos 필드 병합
  let series=[];
  try{
    const r=await fetch(BASE+'data/series.json?v='+Date.now());
    if(r.ok) series=await r.json();
  }catch(e){}
  const linked=[];
  for(const s of (series||[])){
    if(s.published===false) continue;
    for(const ep of (s.eps||[])){
      if(ep.published===false || ep.camp_id!==c.id || !ep.url) continue;
      const num = ep.ep>0 ? `${s.name} EP.${String(ep.ep).padStart(2,'0')}${ep.ep_sub>0?'-'+ep.ep_sub:''}` : s.name;
      linked.push({url:ep.url, title:(ep.title||'').trim()||num, sub:num, thumb:ep.thumb||''});
    }
  }
  // 캠핑장에 직접 등록한 영상은 썸네일이 없다 → 캠핑장 대표 사진으로 대신 채운다
  const fallbackThumb=(imgs&&imgs[0])||'';
  const own=(c.videos||[]).filter(x=>x&&x.url)
    .map(x=>({url:x.url,title:x.title||'게시물 보기',sub:'',thumb:x.thumb||fallbackThumb}));
  const seen=new Set(); const vids=[];
  for(const x of [...linked,...own]){ if(!seen.has(x.url)){ seen.add(x.url); vids.push(x); } }

  root.innerHTML=`
    <section class="gal">
      <div class="gal-main" id="gal-main">
        ${imgs.map((s,i)=>`<img src="${esc(abs(s))}" alt="${esc(c.name)}" style="opacity:${i===0?1:0}">`).join('')}
      </div>
      ${imgs.length>1?`<div class="thumbs">${imgs.map((s,i)=>
        `<button data-i="${i}" class="${i===0?'on':''}" aria-label="사진 ${i+1}"><img src="${esc(abs(s))}" alt=""></button>`).join('')}</div>`:''}
    </section>

    <header class="title">
      <h1>${esc(c.name)}</h1>
      ${v?`<p class="sub">${v}번 다녀왔습니다</p>`:''}
    </header>
    <div class="tags">
      ${c.region?`<span class="tag region">${esc(c.region)}</span>`:''}
      ${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}
    </div>

    <div class="cols">
      <div>
        ${infoRows(c).length?`<div class="block">
          <h2>INFO</h2>
          <dl class="rows">
            ${infoRows(c).map(([k,val])=>`<div class="row"><dt>${esc(k)}</dt><dd>${esc(val)}</dd></div>`).join('')}
          </dl>
        </div>`:''}

        ${c.notes?`<div class="block">
          <h2>NOTE</h2>
          <ul class="notes">${String(c.notes).split('\n').filter(x=>x.trim())
            .map(x=>`<li>${esc(x.trim())}</li>`).join('')}</ul>
        </div>`:''}

        ${vids.length?`<div class="block">
          <h2>POST</h2>
          <div class="vids">
            ${vids.map(x=>`<a class="vid" href="${esc(x.url)}" target="_blank" rel="noopener">
              <span class="vthumb">${x.thumb?`<img src="${esc(abs(x.thumb))}" alt="">`:''}</span>
              <span class="vmeta">
                <b>${esc(x.title)}</b>
                ${x.sub?`<em>${esc(x.sub)}</em>`:''}
              </span>
            </a>`).join('')}
          </div>
        </div>`:''}
      </div>

      <aside>
        ${(c.lat&&c.lng)?`<div class="block"><h2>LOCATION</h2><div id="map"></div></div>`:''}
        <div class="block">
          <h2>RESERVATION</h2>
          ${c.url?`<a class="cta" href="${esc(c.url)}" target="_blank" rel="noopener">예약 페이지 열기 <span class="cta-arrow">→</span></a>`:
                  `<p class="note">등록된 예약 링크가 없습니다. 인스타그램 DM으로 문의해 주세요.</p>`}
        </div>
      </aside>
    </div>

    <footer>© 2026 공대남자 · <a href="./#camps" style="text-decoration:underline">캠핑장 목록으로</a></footer>
  `;

  // 대표 이미지 자동 전환 (랜덤 시작 · 5초 간격) + 썸네일 연동
  const slides=[...document.querySelectorAll('#gal-main img')];
  const thumbs=root.querySelector('.thumbs');
  let cur=0, timer=null;
  function show(n){
    if(!slides.length) return;
    slides[cur].style.opacity=0;
    cur=(n+slides.length)%slides.length;
    slides[cur].style.opacity=1;
    if(thumbs) thumbs.querySelectorAll('button')
      .forEach(b=>b.classList.toggle('on', +b.dataset.i===cur));
  }
  if(slides.length>1){
    show(Math.floor(Math.random()*slides.length));
    timer=setInterval(()=>show(cur+1),5000);
  }
  if(thumbs){
    thumbs.addEventListener('click',e=>{
      const b=e.target.closest('button'); if(!b) return;
      clearInterval(timer);            // 직접 고르면 자동 전환 중지
      show(+b.dataset.i);
    });
  }

  if(c.lat&&c.lng&&window.L){
    // 휠로 확대·축소 가능 / 처음엔 주변 지형이 함께 보이도록 넓게
    const map=L.map('map',{scrollWheelZoom:true}).setView([c.lat,c.lng],11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
      maxZoom:18, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);
    L.marker([c.lat,c.lng]).addTo(map).bindPopup(c.name);
  }
})();
</script>

<script>
/* ── 방문·클릭 통계 (index.html과 동일 로직) ── */
(function() {
  const STATS_URL = 'https://kyd-stats.kydxyz.workers.dev/log';

  // ─── 디바이스 감지 (클라이언트 측에서 명시) ─────────────────────
  // Worker가 User-Agent에서 감지하긴 하지만, sendBeacon은 일부 환경에서 UA가
  // minimal로 전송될 수 있어 클라이언트에서 명시적으로 보내는 게 안전
  function detectDevice() {
    const ua = navigator.userAgent || '';
    if (/iPad|Tablet|tablet/i.test(ua)) return 'tablet';
    if (/Mobile|Android|iPhone|iPod|Phone/i.test(ua)) return 'mobile';
    return 'desktop';
  }
  const DEVICE = detectDevice();

  // ─── 레퍼러 분류 ────────────────────────────────────────────────
  // 어디서 유입됐는지 자동 분류 (인스타/검색/직접 등)
  function classifyReferrer() {
    const ref = document.referrer || '';
    if (!ref) return 'direct';  // 북마크, 직접 입력, 앱에서 진입
    try {
      const host = new URL(ref).hostname.toLowerCase();
      // 자기 사이트 → null (referrer로 안 침)
      if (host === location.hostname || host.endsWith('kydz.kr')) return null;
      // 분류
      if (host.includes('instagram') || host.includes('ig.me') || host.includes('cdninstagram')) return '인스타그램';
      if (host.includes('facebook') || host.includes('fb.com')) return '페이스북';
      if (host.includes('youtube') || host.includes('youtu.be')) return '유튜브';
      if (host.includes('google')) return '구글';
      if (host.includes('naver')) return '네이버';
      if (host.includes('daum') || host.includes('kakao')) return '다음/카카오';
      if (host.includes('bing')) return '빙';
      if (host.includes('graega')) return '그래가';
      // 기타: 호스트명 그대로
      return host;
    } catch { return 'direct'; }
  }
  const REFERRER = classifyReferrer();

  // 전송 함수 (sendBeacon 우선, 실패 시 fetch fallback)
  function send(payload) {
    try {
      // 모든 이벤트에 device 자동 포함 (Worker가 fallback으로 UA 봄)
      payload.device = DEVICE;
      // referrer는 페이지뷰에만 (클릭은 페이지뷰 context로 묶임)
      if (payload.type === 'pageview' && REFERRER) {
        payload.referrer = REFERRER;
      }
      const body = JSON.stringify(payload);
      let beaconOk = false;
      if (navigator.sendBeacon) {
        // sendBeacon은 같은 핸들러에서 두 번째 호출 시 false 반환 가능 (브라우저 큐 한계)
        const blob = new Blob([body], { type: 'text/plain;charset=UTF-8' });
        beaconOk = navigator.sendBeacon(STATS_URL, blob);
        if (DEBUG && !beaconOk) console.log('[kydz stats] sendBeacon returned false, falling back to fetch');
      }
      // sendBeacon이 없거나 false 반환 시 fetch fallback (keepalive로 navigation 후도 OK)
      if (!beaconOk) {
        fetch(STATS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
          body,
          keepalive: true,
          mode: 'cors',
          credentials: 'omit',
        }).then(r => {
          if (DEBUG) console.log('[kydz stats] fetch fallback:', r.status);
        }).catch(err => {
          if (DEBUG) console.log('[kydz stats] fetch fallback failed:', err.message);
        });
      } else if (DEBUG) {
        console.log('[kydz stats] sendBeacon OK');
      }
    } catch (e) {
      if (DEBUG) console.log('[kydz stats] send error:', e.message);
    }
  }

  // ─── 1) 페이지뷰 추적 ──────────────────────────────────────────────
  // 해시 변경마다 전송 (예: #, #camps, #camps/12, #series/0/3)
  // 중복 차단 (path 종류에 따라 dedup 강도 분리):
  // ▶ 방문 카운팅 (/, /#stories, /#camps 등 탭/홈):
  //   1) 메모리 1초 + 2) sessionStorage 30분 + 3) localStorage 24시간
  // ▶ 콘텐츠 클릭 (/series/xxx, /camps/xxx, /foods/xxx, /items/xxx 등 카드):
  //   1) 메모리 1초 + 2) sessionStorage 5분 (기존 유지) — 24시간은 X
  //   → 자주 본 콘텐츠가 24시간 동안 안 잡히면 인기 데이터가 왜곡되므로 콘텐츠는 짧게
  let lastPath = '';
  let lastSent = 0;
  const MEM_DEDUP_MS       = 1000;                // 1초 (공통)
  const CONTENT_DEDUP_MS   = 5 * 60 * 1000;       // 콘텐츠 클릭 5분 (기존)
  const VISIT_DEDUP_MS     = 30 * 60 * 1000;      // 방문 30분 (5분→강화)
  const VISIT_LOCAL_DEDUP  = 24 * 60 * 60 * 1000; // 방문 24시간 (신규)
  // 디버그 모드: URL에 ?debug=1 또는 localStorage.setItem('kydzm:debug', '1')
  const DEBUG = (function() {
    try {
      if (location.search.includes('debug=1')) {
        localStorage.setItem('kydzm:debug', '1');
        return true;
      }
      return localStorage.getItem('kydzm:debug') === '1';
    } catch { return false; }
  })();
  if (DEBUG) console.log('[kydz stats] debug ON, device=' + DEVICE + ', referrer=' + REFERRER);

  // 콘텐츠 경로 판별: /series/xxx, /camps/xxx, /foods/xxx, /items/xxx 형태
  // 방문 경로 (/, /#stories 등)는 false
  function isContentPath(path) {
    return /^\/(series|camps|foods|items)\/[^/]+/.test(path);
  }

  function shouldTrack(path) {
    const now = Date.now();
    const isContent = isContentPath(path);
    const sessionDedupMs = isContent ? CONTENT_DEDUP_MS : VISIT_DEDUP_MS;
    // 1) 메모리 중복 차단 (1초, 공통)
    if (path === lastPath && now - lastSent < MEM_DEDUP_MS) {
      if (DEBUG) console.log('[kydz stats] dedup 1s:', path);
      return false;
    }
    // 2) sessionStorage 중복 차단 (콘텐츠 5분 / 방문 30분)
    try {
      const key = 'kydzm:pv:' + path;
      const prev = sessionStorage.getItem(key);
      if (prev && (now - parseInt(prev, 10) < sessionDedupMs)) {
        if (DEBUG) console.log(`[kydz stats] dedup ${isContent ? '5m' : '30m'}:`, path);
        return false;
      }
      sessionStorage.setItem(key, String(now));
    } catch (e) {}
    // 3) localStorage 24시간 dedup — 방문 경로에만 적용 (콘텐츠는 X)
    if (!isContent) {
      try {
        const lkey = 'kydzm:pvd:' + path;
        const prev = localStorage.getItem(lkey);
        if (prev && (now - parseInt(prev, 10) < VISIT_LOCAL_DEDUP)) {
          if (DEBUG) console.log('[kydz stats] dedup 24h:', path);
          return false;
        }
        localStorage.setItem(lkey, String(now));
      } catch (e) {}
    }
    lastPath = path;
    lastSent = now;
    return true;
  }

  // 페이지 로드 시 24시간 지난 localStorage dedup 키 자동 정리 (lazy cleanup)
  // 방문 dedup만 localStorage 사용하므로 cleanup도 그것만
  (function cleanupOldLocalDedup() {
    try {
      const now = Date.now();
      const expired = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (!k || !k.startsWith('kydzm:pvd:')) continue;
        const v = localStorage.getItem(k);
        if (v && (now - parseInt(v, 10)) > VISIT_LOCAL_DEDUP) {
          expired.push(k);
        }
      }
      expired.forEach(k => localStorage.removeItem(k));
      if (DEBUG && expired.length) console.log('[kydz stats] cleanup expired dedup keys:', expired.length);
    } catch (e) {}
  })();

  // PC 화면은 해시 이름이 달라(#gear/#food/#home) 같은 탭이 따로 집계된다 → 모바일 이름으로 통일
  const PATH_ALIAS = { '/#gear': '/#items', '/#food': '/#foods', '/#home': '/' };
  function normalizePath(p) {
    const base = p.split('/').slice(0, 2).join('/');
    if (PATH_ALIAS[p]) return PATH_ALIAS[p];
    if (p.startsWith('/#gear/')) return p.replace('/#gear/', '/#items/');
    if (p.startsWith('/#food/')) return p.replace('/#food/', '/#foods/');
    return p;
  }

  function trackPageView() {
    const path = normalizePath(location.pathname + (location.hash || ''));
    if (!shouldTrack(path)) return;
    send({
      type: 'pageview',
      path: path || '/',
      title: document.title || '',
    });
  }
  // 초기 로드
  trackPageView();
  // 해시 변경
  window.addEventListener('hashchange', trackPageView);

  // ─── 2) 외부 링크 클릭 추적 ────────────────────────────────────────
  // 도메인별 라벨 매핑
  function detectTarget(url) {
    if (!url) return null;
    const u = url.toLowerCase();
    if (u.includes('graega.co.kr') || u.includes('graega')) return '그래가';
    if (u.includes('booking.naver') || u.includes('naver.me') || u.includes('place.naver')) return '네이버예약';
    if (u.includes('campit')) return '캠핏';
    if (u.includes('thankqcamping') || u.includes('thankq')) return '땡큐캠핑';
    if (u.includes('coupang')) return '쿠팡';
    if (u.includes('kurly')) return '컬리';
    if (u.includes('naver')) return '네이버';
    if (u.includes('11st')) return '11번가';
    if (u.includes('gmarket')) return '지마켓';
    if (u.includes('ssg.com')) return 'SSG';
    if (u.includes('oasis')) return '오아시스';
    if (u.includes('ig.me') || u.includes('instagram.com')) return '인스타DM';
    if (u.startsWith('mailto:')) return '메일';
    if (u.startsWith('tel:')) return '전화';
    // 외부 도메인 (자체 도메인 제외)
    try {
      const host = new URL(url, location.href).hostname;
      if (host && host !== location.hostname && !host.endsWith('kydz.kr')) return host;
    } catch {}
    return null;
  }

  // 카드 페이지뷰 - pointerdown 단계에서 미리 발송
  // 이유: click → 새 탭 navigation 사이 매우 짧은 시간에 send 요청이 drop될 수 있음
  // pointerdown은 click보다 먼저, 새 탭 열리기 한참 전에 발생 → 안전
  function sendCardPageview(card) {
    if (!card) return;
    const cardPath = card.getAttribute('data-track-path') || '';
    const cardTitle = card.getAttribute('data-track-title') || '';
    if (!cardPath) return;
    if (DEBUG) console.log('[kydz stats] card detected:', cardPath);
    if (!shouldTrack(cardPath)) return;
    if (DEBUG) console.log('[kydz stats] sending pageview:', cardPath);
    send({
      type: 'pageview',
      path: cardPath,
      title: cardTitle,
    });
  }

  // pointerdown: 마우스/터치/펜 모두 잡음, 좌클릭만
  document.addEventListener('pointerdown', function(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const card = e.target.closest('[data-track-path]');
    if (card) sendCardPageview(card);
  }, true);  // capture 단계에서 빨리

  // 클릭 이벤트 캡쳐 (외부 링크 + fallback)
  document.addEventListener('click', function(e) {
    // 내부 페이지 이동 버튼 (협업 문의 등) — 외부 도메인이 아니어서 자동 분류가 안 됨
    const internalBtn = e.target.closest('[data-track-internal="1"]');
    if (internalBtn) {
      send({
        type: 'click',
        target: internalBtn.getAttribute('data-track-target') || 'unknown',
        url: internalBtn.getAttribute('href') || '',
        context: location.pathname + (location.hash || ''),
      });
      // 계속 진행 — 아래 카드/외부 링크 처리와 겹치지 않음
    }

    // 명시적 외부 채널 버튼 (data-track-target + data-track-external)
    const externalBtn = e.target.closest('[data-track-external="1"]');
    if (externalBtn) {
      const explicitTarget = externalBtn.getAttribute('data-track-target') || 'unknown';
      send({
        type: 'click',
        target: explicitTarget,
        url: externalBtn.getAttribute('href') || externalBtn.tagName.toLowerCase() === 'button' ? '#button' : '',
        context: '__external__',
      });
      return;
    }

    // 카드 fallback (키보드 Enter, 일부 접근성 도구 등 pointerdown 안 발생하는 케이스)
    const card = e.target.closest('[data-track-path]');
    let cardPath = '';
    if (card) {
      cardPath = card.getAttribute('data-track-path') || '';
      // pointerdown에서 이미 발송했으면 shouldTrack 1초 dedup에서 차단됨
      sendCardPageview(card);
    }

    // 외부 링크 클릭 추적
    const a = e.target.closest('a[href]');
    if (!a) return;
    const href = a.getAttribute('href');
    if (!href) return;
    const target = detectTarget(href);
    if (!target) return; // 내부 링크 또는 미분류 → 추적 안 함
    // context: 추적 카드 path 우선, 없으면 현재 위치 (탭 hash)
    const context = cardPath || (location.pathname + (location.hash || ''));
    send({
      type: 'click',
      target,
      url: href,
      context,
    });
  }, true);

  // ─── 3) 검색어 추적 (디바운스 1초) ────────────────────────────────
  let searchTimer = null;
  let lastSearch = { category: '', query: '' };
  document.addEventListener('input', function(e) {
    const t = e.target;
    if (!t || t.tagName !== 'INPUT') return;
    // 검색창인지 판별 (id에 'search' 포함)
    const id = (t.id || '').toLowerCase();
    if (!id.includes('search')) return;
    // 카테고리 추정 (해시 기반)
    const hash = (location.hash || '').replace(/^#/, '').split('/')[0];
    const category = hash || 'unknown';
    const query = t.value.trim();
    if (!query || query.length < 2) return; // 너무 짧으면 무시
    if (category === lastSearch.category && query === lastSearch.query) return;

    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      lastSearch = { category, query };
      send({ type: 'search', category, query });
    }, 1000); // 1초 후 전송 (타이핑 멈춤 감지)
  }, true);
})();
</script>
</body>
</html>
