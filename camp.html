<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<title>캠핑장 기록 · 공대남자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  color-scheme:light only;
  --paper:#FBFBF8;--ink:#15181A;--moss:#3F5346;--stone:#8B9089;
  --line:#E4E4DE;--stamp:#FFE873;
  --sans:'SUIT Variable','Pretendard Variable',system-ui,sans-serif;
  --display:'Pretendard Variable','SUIT Variable',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --pad:clamp(20px,5vw,64px);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;width:100%;height:100%;object-fit:cover}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

.nav{position:sticky;top:0;z-index:50;background:rgba(251,251,248,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1240px;margin:0 auto;padding:14px var(--pad) 0;
  display:flex;flex-direction:column;align-items:center;gap:10px}
.mark{font-family:var(--display);font-weight:800;
  font-size:clamp(22px,3.2vw,34px);letter-spacing:.02em;white-space:nowrap;line-height:1.1}
.mark span{display:none}
.navrow{display:flex;align-items:center;justify-content:center;
  width:100%;border-top:1px solid var(--line);padding:6px 0}
.back{font-size:13.5px;font-weight:600;color:var(--stone);padding:6px 11px}
.back:hover{color:var(--ink)}
@media (max-width:620px){
  .nav-in{gap:8px;padding:11px 12px 0}
  .mark{font-size:20px}
  .navrow{padding:5px 0}
}

.wrap{max-width:1240px;margin:0 auto;padding:0 var(--pad) 96px}
.loading,.err{padding:96px 0;text-align:center;color:var(--stone);font-size:14px}

/* 갤러리 */
.gal{padding:clamp(24px,4vw,40px) 0 0}
.gal-main{position:relative;aspect-ratio:4/5;max-width:520px;margin:0 auto;
  border-radius:4px;overflow:hidden;background:#EDEDE7}
.gal-main img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  transition:opacity 1.1s ease}
.gal .thumbs{max-width:520px;margin:8px auto 0}
.gal-main .stamp{position:absolute;left:14px;bottom:14px;z-index:2;font-family:var(--mono);font-weight:600;font-size:12px;background:var(--stamp);padding:6px 11px;border-radius:2px}
.thumbs{display:flex;gap:8px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumbs button{flex:0 0 82px;aspect-ratio:4/3;border:none;padding:0;background:#EDEDE7;border-radius:3px;overflow:hidden;cursor:pointer;opacity:.5;transition:opacity .18s}
.thumbs button.on,.thumbs button:hover{opacity:1}

/* 헤더 */
.title{padding:clamp(26px,4vw,40px) 0 0;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.title h1{font-family:var(--display);font-weight:800;font-size:clamp(24px,4vw,42px);letter-spacing:-.035em;line-height:1.15}
.title .sub{width:100%;margin-top:8px;font-family:var(--mono);font-size:12.5px;
  letter-spacing:.02em;color:var(--stone)}
.badge{font-size:11.5px;font-weight:700;background:var(--ink);color:#fff;padding:5px 10px;border-radius:2px;margin-top:6px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.tag{font-size:12.5px;color:#4C524D;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px}
.tag.region{font-family:var(--mono);letter-spacing:.06em;background:var(--ink);color:#fff;border-color:var(--ink)}

/* 본문 */
.cols{display:grid;gap:clamp(28px,4vw,56px);grid-template-columns:1.6fr 1fr;margin-top:clamp(30px,4vw,48px)}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.block{margin-bottom:clamp(30px,4vw,44px)}
.block h2{font-size:13px;font-family:var(--mono);letter-spacing:.12em;color:var(--stone);padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:16px}
.facts{display:flex;gap:clamp(24px,4vw,44px);flex-wrap:wrap}
.fact b{display:block;font-family:var(--mono);font-weight:600;font-size:clamp(22px,3vw,32px);line-height:1;letter-spacing:-.03em}
.fact span{display:block;margin-top:7px;font-size:12px;color:var(--stone)}
.vids{display:grid;gap:10px}
.vid{display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:4px;padding:12px 14px;transition:.16s}
.vid:hover{border-color:#C7CAC3;transform:translateY(-1px)}
.vid b{font-size:14px;font-weight:600}
.vid b em{display:block;font-style:normal;font-family:var(--mono);font-size:11px;
  font-weight:400;color:var(--stone);letter-spacing:.04em;margin-top:3px}
.vid span{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--stone)}
#map{height:280px;border-radius:4px;border:1px solid var(--line);background:#EDEDE7}
.cta{display:block;text-align:center;background:var(--ink);color:#fff;font-weight:700;font-size:15px;padding:16px;border-radius:999px;transition:.18s}
.cta:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(21,24,26,.18)}
.cta.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);margin-top:10px;font-weight:600;font-size:14px}
.note{margin-top:12px;font-size:12px;color:var(--stone);text-align:center;line-height:1.6}
footer{border-top:1px solid var(--line);padding:30px 0;margin-top:20px;font-size:12.5px;color:var(--stone)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-in">
    <a class="mark" href="./v3.html#home">공대남자</a>
    <div class="navrow"><a class="back" href="./v3.html#camps">← 다녀온 캠핑장</a></div>
  </div>
</nav>

<main class="wrap" id="root">
  <p class="loading">불러오는 중…</p>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const BASE='https://kydz.kr/';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const abs=p=>!p?'':/^https?:/.test(p)?p:BASE+String(p).replace(/^\.?\//,'');

/* 대표 이미지: main_img 우선, 없으면 첫 장 */
function orderedImgs(c){
  const imgs=(c.imgs||[]).filter(Boolean);
  if(!imgs.length) return [];
  const m=c.main_img;
  if(m && imgs.includes(m)) return [m, ...imgs.filter(x=>x!==m)];
  return imgs;
}

(async function(){
  const id=new URLSearchParams(location.search).get('id');
  const root=document.getElementById('root');
  if(!id){ root.innerHTML='<p class="err">캠핑장을 지정하지 않았습니다. 목록에서 다시 선택해 주세요.</p>'; return; }

  let camps;
  try{
    const r=await fetch(BASE+'data/camps.json?v='+Date.now());
    if(!r.ok) throw 0;
    camps=await r.json();
  }catch(e){
    root.innerHTML='<p class="err">데이터를 불러오지 못했습니다. 새로고침해 주세요.</p>'; return;
  }

  const c=(camps||[]).find(x=>x.id===id);
  if(!c || c.published===false){
    root.innerHTML='<p class="err">해당 캠핑장을 찾을 수 없습니다. <a href="./v3.html#camps" style="text-decoration:underline">목록으로 돌아가기</a></p>'; return;
  }

  document.title=c.name+' · 공대남자 캠핑 기록';
  const imgs=orderedImgs(c);
  const v=+c.visits||0;
  const tags=[...(c.seasons||[]),...(c.landscape||[]),...(c.extras||[])];

  // 연결된 릴스: camp_id로 시리즈에서 수집 + 자체 videos 필드 병합
  let series=[];
  try{
    const r=await fetch(BASE+'data/series.json?v='+Date.now());
    if(r.ok) series=await r.json();
  }catch(e){}
  const linked=[];
  for(const s of (series||[])){
    if(s.published===false) continue;
    for(const ep of (s.eps||[])){
      if(ep.published===false || ep.camp_id!==c.id || !ep.url) continue;
      const num = ep.ep>0 ? `${s.name} EP.${String(ep.ep).padStart(2,'0')}${ep.ep_sub>0?'-'+ep.ep_sub:''}` : s.name;
      linked.push({url:ep.url, title:(ep.title||'').trim()||num, sub:num});
    }
  }
  const own=(c.videos||[]).filter(x=>x&&x.url).map(x=>({url:x.url,title:x.title||'영상 보기',sub:''}));
  const seen=new Set(); const vids=[];
  for(const x of [...linked,...own]){ if(!seen.has(x.url)){ seen.add(x.url); vids.push(x); } }

  root.innerHTML=`
    <section class="gal">
      <div class="gal-main" id="gal-main">
        ${imgs.map((s,i)=>`<img src="${esc(abs(s))}" alt="${esc(c.name)}" style="opacity:${i===0?1:0}">`).join('')}
      </div>
      ${imgs.length>1?`<div class="thumbs">${imgs.map((s,i)=>
        `<button data-i="${i}" class="${i===0?'on':''}" aria-label="사진 ${i+1}"><img src="${esc(abs(s))}" alt=""></button>`).join('')}</div>`:''}
    </section>

    <header class="title">
      <h1>${esc(c.name)}</h1>
      ${v?`<p class="sub">${v}번 다녀왔습니다</p>`:''}
    </header>
    <div class="tags">
      ${c.region?`<span class="tag region">${esc(c.region)}</span>`:''}
      ${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}
    </div>

    <div class="cols">
      <div>
        <div class="block">
          <h2>RECORD</h2>
          <div class="facts">
            <div class="fact"><b>${v}</b><span>다녀온 횟수</span></div>
            <div class="fact"><b>${imgs.length}</b><span>기록한 사진</span></div>
            <div class="fact"><b>${vids.length}</b><span>영상 기록</span></div>
          </div>
        </div>

        ${vids.length?`<div class="block">
          <h2>VIDEO</h2>
          <div class="vids">
            ${vids.map(x=>`<a class="vid" href="${esc(x.url)}" target="_blank" rel="noopener">
              <b>${esc(x.title)}${x.sub?`<em>${esc(x.sub)}</em>`:''}</b><span>인스타그램 →</span></a>`).join('')}
          </div>
        </div>`:''}
      </div>

      <aside>
        ${(c.lat&&c.lng)?`<div class="block"><h2>LOCATION</h2><div id="map"></div></div>`:''}
        <div class="block">
          <h2>RESERVATION</h2>
          ${c.url?`<a class="cta" href="${esc(c.url)}" target="_blank" rel="noopener">예약 페이지 열기</a>`:
                  `<p class="note">등록된 예약 링크가 없습니다. 인스타그램 DM으로 문의해 주세요.</p>`}
        </div>
      </aside>
    </div>

    <footer>© 2026 공대남자 · <a href="./v3.html#camps" style="text-decoration:underline">캠핑장 목록으로</a></footer>
  `;

  // 대표 이미지 자동 전환 (랜덤 시작 · 5초 간격) + 썸네일 연동
  const slides=[...document.querySelectorAll('#gal-main img')];
  const thumbs=root.querySelector('.thumbs');
  let cur=0, timer=null;
  function show(n){
    if(!slides.length) return;
    slides[cur].style.opacity=0;
    cur=(n+slides.length)%slides.length;
    slides[cur].style.opacity=1;
    if(thumbs) thumbs.querySelectorAll('button')
      .forEach(b=>b.classList.toggle('on', +b.dataset.i===cur));
  }
  if(slides.length>1){
    show(Math.floor(Math.random()*slides.length));
    timer=setInterval(()=>show(cur+1),5000);
  }
  if(thumbs){
    thumbs.addEventListener('click',e=>{
      const b=e.target.closest('button'); if(!b) return;
      clearInterval(timer);            // 직접 고르면 자동 전환 중지
      show(+b.dataset.i);
    });
  }

  if(c.lat&&c.lng&&window.L){
    const map=L.map('map',{scrollWheelZoom:false}).setView([c.lat,c.lng],13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
      maxZoom:18, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);
    L.marker([c.lat,c.lng]).addTo(map).bindPopup(c.name);
  }
})();
</script>
</body>
</html>
